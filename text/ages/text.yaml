      mes affaires!
      J'suis furieuse!
      Je vais te voler
      tes affaires!
  - name: TX_0713
    index: 0x13
    text: |-
      Ouch...\stop
      Fais attention
      o\xae tu vas! Je
      viens de ce
      tunnel. Je
      volais
      tranquillement.
      Que fais-tu ici?
      Bon, je vais te
      voler tes
      affaires!
