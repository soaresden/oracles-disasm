      \pos(2)Maudite
      \col(3)Veran\col(0)!
      Elle ne peut pas
      toucher la
      pierre, alors
      elle t'a utilis\xa6
      pour p\xa6n\xa6trer
      ici!
  - name: TX_2a03
    index: 0x03
    text: |-
      \pos(2)Je savais que
      \col(3)Nayru\col(0) \xa6tait
      l'Oracle des
      Ages.\stop
      J'ai toujours
      \xa6t\xa6 \xa0 ses
      c\xd0t\xa6s pour la
      prot\xa6ger.
  - name: TX_2a04
