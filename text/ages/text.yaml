      boul\xa6!
      J'en ai plus
      que toi!
      A bient\xd0t!
      Ah ha ha ha!
  - name: TX_0707
    index: 0x07
    text: |-
      Petit...
      Je m'en
      souviendrai!
  - name: TX_0708
    index: 0x08
