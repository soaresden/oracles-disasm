      Vous \xa6changez \col(0x84)\item(0x02)\col(0)
      contre \col(0x84)\item(0x03)\col(0) \col(1)Sac qui
      Pue\col(0)! Eurkh... Ca
      pue!
  - name: TX_005d
    index: 0x5d
    text: |-
      Vous obtenez \col(0x84)\item(0x04)
      \col(1)une Bonne
      Viande\col(0)! La
      sp\xa6cialit\xa6 du
      chef!
  - name: TX_005e
    index: 0x5e
    text: |-
      Vous obtenez
      \col(0x84)\item(0x05) \col(1)Masque Chien\col(0)!
      Pour les
      passionn\xa6s
      de chiens!
  - name: TX_005f
    index: 0x5f
    text: |-
      Vous obtenez
      un \col(0x84)\item(0x06)
      \col(1)Halt\xa5re\col(0)!
      Mais il n'y en a
      qu'un!
  - name: TX_0060
    index: 0x60
    text: |-
      Vous obtenez
      une \col(0x84)\item(0x07)
      \col(1)Moustache en
      Fromage\col(0)! C'est
      bizarre...
  - name: TX_0061
    index: 0x61
    text: |-
      Vous avez appris
      une \col(0x84)\item(0x08) \col(1)Blague
      trop Dr\xd0le\col(0)!
      Devenez une star
      de l'humour!
  - name: TX_0062
    index: 0x62
    text: |-
      Vous obtenez un
      \col(0x84)\item(0x09)
      \col(1)Livre Emouvant\col(0)!
      C'est une
      histoire
      triste.
  - name: TX_0063
    index: 0x63
    text: |-
      Vous obtenez
      une \col(0x84)\item(0x0a)
      \col(1)Rame Magique\col(0)!
      C'est chouette!
  - name: TX_0064
    index: 0x64
    text: |-
      Vous obtenez
      le \col(0x84)\item(0x0b)
      \col(1)Ukul\xa6l\xa6 de
      Mer\col(0)!
