    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      \call(TX_270b)Te voir me
      donne de
      l'espoir pour
      finir mes
      recherches.
  - name: TX_2710
    index: 0x10
    text: |-
      H\xa6! Comment va
      le radeau? Je
      vais peut-\xa7tre
