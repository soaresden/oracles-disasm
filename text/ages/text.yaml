      parfum marin!
  - name:
    - TX_0065
    - TX_0066
    index:
    - 0x65
    - 0x66
    text: |-
      Vous obtenez
      \col(0x84)\item(0x0c)\col(0)
      l'\col(1)Ep\xa6e Bris\xa6e\col(0)!
      Mais... Elle est
      cass\xa6e!
