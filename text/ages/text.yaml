  - name: TX_070f
    index: 0x0f
    text: |-
      Quoi...\stop
      Oh, non...\stop
      .........\stop
      Ohhh!
      ...........
  - name: TX_0710
    index: 0x10
    text: |-
      Beuhaaaa!\stop
      Ahhh...(sniff)
      C'est si
      triste!
  - name: TX_0711
    index: 0x11
