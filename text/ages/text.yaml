      C'est un succ\xa5s!
      Tu es dou\xa6.
      Tu t'es sorti de
      ce pi\xa5ge! Heu de
      cette c\xa6r\xa6monie.
      Voici ton truc:
      \col(1)\call(0xff)\col(0),
      tout neuf!\stop
      Je suis trop
      fort!
