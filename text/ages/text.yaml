    text: |-
      Un \col(1)anneau\col(0) \xa6tait
      \jump(TX_3502)
    null_terminator: false
  - name: TX_3505
    index: 0x05
    text: |-
      Une \col(1)Potion\col(0)
      \xa6tait\x20
      \jump(TX_3502)
    null_terminator: false
  - name: TX_3506
    index: 0x06
    text: |-
      \col(1)200 Rubis\col(0)
      \xa6taient
      \jump(TX_3502)
    null_terminator: false
  - name: TX_3507
    index: 0x07
    text: |-
      \col(1)5 coeurs\col(0) \xa6taient
      \jump(TX_3502)
    null_terminator: false
  - name: TX_3508
    index: 0x08
    text: |-
      Une \col(1)f\xa6e\col(0) \xa6tait\x20
      \jump(TX_3502)
    null_terminator: false
  - name: TX_3509
    index: 0x09
    text: |-
      Ce sol fertile
      est parfait pour
