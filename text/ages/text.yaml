      o\xae tu vas! Tu
      viens de
      bousculer \col(3)Maple\col(0),
      l'apprentie de
      \col(3)Syrup\col(0)! A cause
      de toi, toutes
      mes affaires
      sont tomb\xa6es!
      La sorci\xa5re
      \col(3)Syrup\col(0) va \xa7tre
      furieuse!
      Et je dois
      trouver ce \col(1)Livre
      d'Images\col(0). Qui
      peut bien avoir
      ce \col(0x84)\item(0x09)
      \col(1)livre\col(0)?\stop Je
      suis furieuse!
      Je vais voler
      tes affaires!
  - name: TX_0701
    index: 0x01
