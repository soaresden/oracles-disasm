  data:
  - name: TX_3100
    index: 0x00
    text: |-
      \sfx(0xc7)Les
      chutes de
      pierres barrent
      le passage.
      Moi, je dors et
      j'attends. Avant
      il y avait plein
      de chutes de
      pierres qui
      causaient des
      d\xa6g\xa1ts.
  - name: TX_3101
    index: 0x01
    text: |-
      \sfx(0xc7)C'est
      bien que tu aies
      trouv\xa6 ma
      cachette.
  - name: TX_3102
    index: 0x02
    text: |-
      \sfx(0xc7)Un
      jeune gar\xa4on m'a
      apport\xa6 un \col(1)Chou
      P\xa6teur\col(0) \xa0 \col(3)Roule-
      roche\col(0).\stop
      Gr\xa1ce \xa0 lui, les
      \col(1)Choux P\xa6teurs\col(0)
      sont devenus la
      sp\xa6cialit\xa6 de
      \col(3)Rouleroche\col(0).
  - name: TX_3103
    index: 0x03
    text: |-
      \sfx(0xc7)Comme
      le tunnel est
      fini, nous avons
      de nouveaux
      arrivants! Des
      Goron ont
      ouvert des
      \xa6choppes. Tu
      devrais y
      aller!
  - name: TX_3104
    index: 0x04
    text: |-
      \sfx(0xc7)Es-tu
      all\xa6 dans des
      \xa6choppes de
      Goron?
      Tu dois y aller
      au moins deux ou
      trois fois!
  - name: TX_3105
    index: 0x05
    text: |-
      \sfx(0xc7)Cet
      escalier m\xa5ne \xa0
      la base de
      \col(3)Rouleroche\col(0).
  - name: TX_3106
    index: 0x06
    text: |-
      \sfx(0xc7)Les
      Goron s'occupent
      de leurs fr\xa5res!
  - name: TX_3107
    index: 0x07
    text: |-
      \sfx(0xc7)Quand
      mon grand-p\xa5re
      \xa6tait jeune, il
      avait d'autres
      \xa6choppes avant
      d'ouvrir
      Cible Chariot.
  - name: TX_3108
    index: 0x08
    text: |-
      \sfx(0xc7)J'ai
      plein de cadeaux
      dans mes stands
      de jeux!
  - name: TX_3109
    index: 0x09
    text: |-
      \sfx(0xc7)Des
      probl\xa5mes
      viennent de plus
      bas.
      Il s'est pass\xa6
      un truc?
  - name: TX_310a
    index: 0x0a
    text: |-
      \sfx(0xc7)Alors, l'ancien
      avait raison?
      C'est bien!
  - name: TX_310b
    index: 0x0b
    text: |-
      \sfx(0xc7)Les
      Goron aiment
      les jeux! Il y a
      plein de jeux
      partout!
  - name: TX_310c
    index: 0x0c
    text: |-
      \sfx(0xc7)Le \col(3)Goron
      Gracieux\col(0)
      se vante d'avoir
      trouv\xa6 une belle
      \col(1)cl\xa6\col(0) dans la
      grotte d'une
      cascade. Je suis
      jaloux.
  - name: TX_310d
    index: 0x0d
    text: |-
      \sfx(0xc7)Je
      peux danser car
      le monde est
      en paix!
  - name: TX_310e
    index: 0x0e
    text: |-
      \sfx(0xc7)Le
      champ de tir
      est aussi
      populaire que la
      danse!
  - name: TX_310f
    index: 0x0f
    text: |-
      \sfx(0xc7)J'ai
      battu le record
      des Cibles
      Chariots!
  - name: TX_3110
    index: 0x10
    text: |-
      \sfx(0xc7)Depuis que ce
      goret de
      \col(3)Grand Moblin\col(0)
      est pass\xa6, on ne
      peut plus faire
      pousser de
      \col(1)Choux P\xa6teurs\col(0).
  - name: TX_3111
    index: 0x11
    text: |-
      \sfx(0xc7)Est-ce que le
      \col(3)Grand Moblin\col(0) est
      parti?
      Alors on va
      pouvoir faire
      pousser des
      \col(1)Choux P\xa6teurs\col(0)!
  - name: TX_3112
    index: 0x12
    text: |-
      \sfx(0xc7)Les
      \col(1)Choux P\xa6teurs\col(0)
      poussent
      lentement.
  - name: TX_3113
    index: 0x13
    text: |-
      \sfx(0xc7)Des
      trucs \xa6tranges
      sont apparus
      ici, \xa0 \col(3)Roule-
      roche\col(0)!\stop
      Un type appel\xa6
      le \col(3)Grand Moblin\col(0)
      les a
      construits!
  - name: TX_3114
    index: 0x14
    text: |-
      \sfx(0xc7)As-tu
      d\xa6truit le \col(3)Fort
      du Grand Moblin\col(0)?
      Merci beaucoup!\stop
      On va pouvoir
      aller voir les
      autres Goron au
      Pic de l'Est!
  - name: TX_3115
    index: 0x15
    text: |-
      \sfx(0xc7)Il faut se
      d\xa6barrasser du
      \col(3)Grand Moblin\col(0),
      mais je peux pas
      rouler assez
      vite pour y
      aller.
      Avant, il y
      avait un arbre
      qui donnait des
      graines vitesse.
      M\xa7me un Goron
      pouvait aller
      vite gr\xa1ce \xa0 \xa4a!
  - name: TX_3116
    index: 0x16
    text: |-
      \sfx(0xc7)H\xa6!
      Je viens de voir
      le \col(3)Grand Moblin\col(0)
      aller \xa0 \col(3)Roule-
      roche\col(0). Je ne
      devrais pas
      m'inqui\xa6ter.
  - name: TX_3117
    index: 0x17
    text: |-
      \sfx(0xc7)Les
      Goron ont de
      nombreux objets
      magiques! Si tu
      en as un,
      prends-en soin.
  - name: TX_3118
    index: 0x18
    text: |-
      \sfx(0xc7)Tu
      t'accroches \xa0
      ton \col(1)Embl\xa5me de
      la Fraternit\xa6\col(0)?
      Tu dois en
      prendre soin.
  - name: TX_3119
    index: 0x19
    text: |-
      \sfx(0xc7)H\xa6, fr\xa5re!
      Tu danses bien
      aujourd'hui?
  - name: TX_311a
    index: 0x1a
    text: |-
      \sfx(0xc7)Les
      humains vivent
      des moments
      difficiles. Que
      s'est-il pass\xa6?
  - name: TX_311b
    index: 0x1b
    text: |-
      \sfx(0xc7)Je
      vais rendre cet
      endroit plus
      agr\xa6able en le
      remplissant de
      Goron!
  - name: TX_311c
    index: 0x1c
    text: |-
      \sfx(0xc7)Il y a une\x20
      grande cascade \xa0
      \col(3)Rouleroche\col(0).
      Tu devrais aller
      la voir.
  - name: TX_311d
    index: 0x1d
    text: |-
      \sfx(0xc7)Il para\xa9t
      qu'il y a un
      m\xa6dicament
      pour le rhume
      des Goron.
      C'est de la
      \col(1)Soupe de Lave\col(0).
      Faut que
      j'essaie \xa4a.
  - name: TX_311e
    index: 0x1e
    text: |-
      \sfx(0xc7)\col(3)Rouleroche\col(0) est
      un danger \xa0
      cause du
      \col(3)Grand Moblin\col(0).
  - name: TX_311f
    index: 0x1f
    text: |-
      \sfx(0xc7)\col(3)Rouleroche\col(0) est
      redevenu calme
      depuis que le
      \col(3)Grand Moblin\col(0)
      est parti.
  - name: TX_3120
    index: 0x20
    text: |-
      \sfx(0xc7)Il
      para\xa9t qu'il y a
      un Goron appel\xa6
      \col(3)Biggoron\col(0) qui est
      grand comme une
      montagne. Mais
      il vit ailleurs
      qu'\xa0 \col(3)Rouleroche\col(0).
  - name: TX_3121
    index: 0x21
    text: |-
      \sfx(0xc7)A
      l'est d'ici, la
      Danse Goron fait
      rage! Si tu sais
      pas danser,
      t'auras pas
      d'amis.
  - name: TX_3122
    index: 0x22
    text: |-
      \sfx(0xc7)La
      Danse Goron!
      Ca va faire un
      succ\xa5s!
  - name: TX_3123
    index: 0x23
    text: |-
      \sfx(0xc7)Les
      Goron ont
      toujours aim\xa6
      les jeux! Il
      faut que tu
      joues aussi!
  - name: TX_3124
    index: 0x24
    text: |-
      \sfx(0xc7)Le
      \col(3)Goron Gracieux\col(0)
      danse \xa0
      l'arri\xa5re! Il
      est trop top!
  - name: TX_3125
    index: 0x25
    text: |-
      \sfx(0xc7)La Danse
      Goron est
      la passion des
      Goron. Je veux
      \xa7tre le meilleur
      danseur.
  - name: TX_3126
    index: 0x26
    text: |-
      \sfx(0xc7)Je
      veux \xa7tre encore
      le \col(3)Goron
      Gracieux\col(0)!
  - name: TX_3127
    index: 0x27
    text: |-
      \sfx(0xc7)Qui
      sont ces gens
      encapuchonn\xa6s?
      Ils semblent
      s'int\xa6resser \xa0
      la Danse Goron.
  - name: TX_3128
    index: 0x28
    text: |-
      \sfx(0xc7)Je ne
      sais pas d'o\xae tu
      viens, mais
      merci d'avoir
      chass\xa6 le \col(3)Grand
      Moblin\col(0). Il nous
      emp\xa7chait de
      faire pousser
      des \col(1)Choux
      P\xa6teurs\col(0).
      On va pouvoir
      faire pousser
      des \col(1)Choux
      P\xa6teurs\col(0) sans
      crainte!
      Prends-en
      un en gage de
      reconnaissance.
  - name: TX_3129
    index: 0x29
    text: |-
      \sfx(0xc7)Il y a
      longtemps, un
      jeune gar\xa4on a
      sauv\xa6 l'Anc\xa7tre
      Goron...
      Tu ressembles \xa0
      ce gar\xa4on!
      C'est pas demain
      la veille qu'on
      laissera un
      \col(3)Grand Moblin\col(0)
      s'installer ici!
  - name:
    - TX_312a
    - TX_312b
    - TX_312c
    - TX_312d
    - TX_312e
    - TX_312f
    - TX_3130
    index:
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    - 0x30
    text: |-
      \sfx(0xc7)Oh!
      Tu es le gar\xa4on
      de l'autre fois!\stop
      Je garde les
      \col(1)secrets\col(0) des
      Goron. Tu en
      connais?
        \opt()Oui \opt()Non
  - name: TX_3131
    index: 0x31
    text: |-
      \sfx(0xc7)Oh.
      Ah bon.
  - name: TX_3132
    index: 0x32
    text: |-
      \sfx(0xc7)H\xa6!
      Ca c'est un
      secret!\stop
      Ce \col(1)secret\col(0) sera
      aussi celui des
      Goron! En
      remerciement, je
      vais te donner
      \col(1)l'Ep\xa6e de
      Biggoron\col(0)!
      Je vais te
      tester pour voir
      si tu peux
      utiliser
      cette \col(1)\xa6p\xa6e\col(0), OK?
        \opt()OK \opt()Non!
  - name: TX_3133
    index: 0x33
    text: |-
      \sfx(0xc7)Il le
      faut?
  - name: TX_3134
    index: 0x34
    text: |-
      Hein? Tu n'as
      pas besoin de
      l'\col(1)Ep\xa6e
      Biggoron\col(0)?
  - name: TX_3135
    index: 0x35
    text: |-
      Voici le test:
      avec l'\col(1)Ep\xa6e
      Biggoron\col(0) tu
      dois toucher
      les cibles!
      Connais-tu les
      r\xa5gles?
        \opt()Oui \opt()Non
  - name: TX_3136
    index: 0x36
    text: |-
      Laisse-moi
      t'expliquer.\stop
      Renvoie avec
      l'\col(1)\xa6p\xa6e\col(0) les
      boules vers les
      cibles.
      Il te faut le
      plus de points
      possible. Tu
      auras 10
      boules.
      Voici les
      cibles:
      F\xa6e  100 pts
      Bleue    30 pts
      Rouge    -10
      pts
      Imp    -50 pts
      Compris?
        \opt()Oui \opt()Non
  - name: TX_3137
    index: 0x37
    text: |-
      OK! Si tu
      obtiens au
      moins
      300 points,
      cette \col(1)\xa6p\xa6e\col(0) est
      tienne.
      Pr\xa7t? Go!
  - name: TX_3138
    index: 0x38
    text: |-
      \sfx(0xc7)Hmm... Peut-\xa7tre
      es-tu trop
      rapide?
      Encore un essai?
         \opt()Oui \opt()Non
  - name: TX_3139
    index: 0x39
    text: |-
      Reviens quand tu
      seras pr\xa7t.
  - name: TX_313a
    index: 0x3a
    text: |-
      \sfx(0xc7)Bien
      jou\xa6!
      Comme promis,
      voici l'\col(1)Ep\xa6e
      Biggoron\col(0)!
  - name: TX_313b
    index: 0x3b
    text: |-
      \sfx(0xc7)Je vais te dire
      le \col(1)secret\col(0) pour
      garder l'\col(1)Ep\xa6e
      Biggoron\col(0) en
      \col(3)Labrynna\col(0)!\stop
      \secret1\stop
      Reviens si tu
      oublies le
      \col(1)secret\col(0)!
  - name: TX_313c
    index: 0x3c
    text: |-
      \sfx(0xc7)Es-tu
      venu faire mon
      test?
        \opt()Oui  \opt()Non
  - name: TX_313d
    index: 0x3d
    text: |-
      Quoi? Tu ne veux
      pas de l'\col(1)Ep\xa6e
      Biggoron\col(0)?
  - name: TX_313e
    index: 0x3e
    text: |-
      \sfx(0xc7)Voici le \col(1)secret\col(0)
      pour avoir
      l'\col(1)Ep\xa6e
      Biggoron\col(0) en
      \col(3)Labrynna\col(0):\stop
      \secret1\stop
      Ne l'oublie pas!
  - name: TX_313f
    index: 0x3f
    text: |-
      \sfx(0xc7)Trop
      t\xd0t!
  - name: TX_3140
    index: 0x40
    text: |-
      \sfx(0xc7)Trop
      tard! T'as pas
      le timing!
  - name: TX_3141
    index: 0x41
    text: \sfx(0xc7)Mauvais coup!
  - name: TX_3142
    index: 0x42
    text: |-
      Je peux voir ta
      destin\xa6e...\stop
      Esprit des
      Goron,
      montre-moi tout!\stop
      Oh, mon dieu!!!
  - name: TX_3143
    index: 0x43
    text: |-
      \call(TX_3142)
      Je vois ton
      avenir. Tu
      voyages dans
      une plaine
      inconnue!
  - name: TX_3144
    index: 0x44
    text: |-
      \call(TX_3142)
      Tu voyages \xa0
      travers les flux
      du temps!
  - name: TX_3145
    index: 0x45
    text: |-
      \call(TX_3142)
      Je te vois
      danser avec le
      \col(3)Goron Gracieux\col(0)!
  - name: TX_3146
    index: 0x46
    text: |-
      \call(TX_3142)
      Je te vois
      frapper de ton
      \col(1)\xa6p\xa6e\col(0) un barrage
      de boules
      volantes!
  - name: TX_3147
    index: 0x47
    text: |-
      \call(TX_3142)
      Je te vois dans
      un avenir
      \xa6loign\xa6. Tu
      donnes une
      boisson
      \xa6nerg\xa6tique \xa0
      un Goron!
  - name: TX_3148
    index: 0x48
    text: |-
      \call(TX_3142)
      Je te vois
      donner un \col(1)vase\col(0) \xa0
      un Goron qui
      cherche un objet
      pr\xa6cieux!
  - name: TX_3149
    index: 0x49
    text: |-
      \call(TX_3142)
      Je te vois dans
      un avenir
      lointain.
      Tu donnes \xa0
      manger \xa0 un
      Goron affam\xa6!
  - name: TX_314a
    index: 0x4a
    text: |-
      \call(TX_3142)
      Je te vois dans
      un avenir
      lointain.
      Tu conduis un
      v\xa6hicule \xa6trange
      en tirant sur
      tout ce qui
      bouge!
  - name: TX_314b
    index: 0x4b
    text: |-
      \call(TX_3142)
      Je te vois
      danser avec
      ferveur!
  - name: TX_314c
    index: 0x4c
    text: |-
      \call(TX_3142)
      Je te vois
      donner une chose
      chaude \xa0 un ami
      du \col(3)Goron
      Gracieux\col(0)!
  - name: TX_314d
    index: 0x4d
    text: |-
      \call(TX_3142)
      Je te vois dans
      l'avenir.
      Tu esquives des
      bombes lanc\xa6es
      autour de toi!
  - name: TX_314e
    index: 0x4e
    text: |-
      Je peux voir ta
      destin\xa6e...\stop
      Esprit Goron,
      montre-moi tout!\stop
      Incroyable!
  - name: TX_314f
    index: 0x4f
    text: |-
      \call(TX_314e)
      Je te vois
      voyager dans
      une plaine
      inconnue!
  - name: TX_3150
    index: 0x50
    text: |-
      \call(TX_314e)
      Je te vois
      franchir le flux
      du temps!
  - name: TX_3151
    index: 0x51
    text: |-
      \call(TX_314e)
      Je te vois dans
      le pass\xa6.
      Tu danses avec
      le \col(3)Goron
      Gracieux\col(0)!
  - name: TX_3152
    index: 0x52
    text: |-
      \call(TX_314e)
      Je te vois dans
      le pass\xa6.
      Tu frappes de
      ton \xa6p\xa6e un
      barrage de
      boules
      volantes!
  - name: TX_3153
    index: 0x53
    text: |-
      \call(TX_314e)
      Je te vois
      donner une
      boisson
      \xa6nerg\xa6tique \xa0 un
      Goron endormi.
  - name: TX_3154
    index: 0x54
    text: |-
      \call(TX_314e)
      Je te vois dans
      le pass\xa6.
      Tu donnes un
      \col(1)vase\col(0) \xa0 un Goron
      qui cherche une
      chose!
  - name: TX_3155
    index: 0x55
    text: |-
      \call(TX_314e)
      Je te vois
      donner \xa0 manger
      \xa0 un Goron
      affam\xa6!
  - name: TX_3156
    index: 0x56
    text: |-
      \call(TX_314e)\stop
      Je te vois
      conduire un
      v\xa6hicule \xa6trange
      tirant tout
      autour de toi!
  - name: TX_3157
    index: 0x57
    text: |-
      \call(TX_314e)\stop
      Je te vois
      danser avec
      ferveur!
  - name: TX_3158
    index: 0x58
    text: |-
      \call(TX_314e)\stop
      Je te vois dans
      le pass\xa6.
      Tu donnes un
      truc chaud \xa0 un
      ami du \col(3)Goron
      Gracieux\col(0)!
  - name: TX_3159
    index: 0x59
    text: |-
      \call(TX_314e)\stop
      Je te vois
      esquiver des
      \col(1)Bombes\col(0)!
- group: 0x32
  data:
  - name: TX_3200
    index: 0x00
    text: |-
      Veux-tu
      apprendre les
      \col(1)dons du h\xa6ros\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3201
    index: 0x01
    text: |-
      Veux-tu
      apprendre les
      tactiques avec
      l'\col(1)\xa6cu\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3202
    index: 0x02
    text: |-
      Veux-tu
      t'informer sur
      les \col(1)Graines
      Mystique\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3203
    index: 0x03
    text: |-
      Veux-tu
      t'informer sur
      les \col(1)Bombes\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3204
    index: 0x04
    text: |-
      Veux-tu te
      renseigner sur
      les \col(1)objets\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3205
    index: 0x05
    text: |-
      Veux-tu
      apprendre les
      \col(1)cartes\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3206
    index: 0x06
    text: |-
      Veux-tu
      apprendre les
      \col(1)sauvegardes\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3207
    index: 0x07
    text: |-
      Veux-tu
      t'informer sur
      les \col(1)Ages\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3208
    index: 0x08
    text: |-
      Veux-tu
      t'informer sur
      les \col(1)Sous-menus\col(0)?
      \opt()Oui \opt()Non
  - name: TX_3209
    index: 0x09
    text: |-
      Veux-tu te
      renseigner sur
      les \col(1)essences\col(0)?
      \opt()Oui \opt()Non
  - name: TX_320a
    index: 0x0a
    text: |-
      Un don pour les
      h\xa6ros!\stop
      Maintiens le
      bouton \col(1)\xa6p\xa6e\col(0)
      enfonc\xa6 pour
      charger de la
      puissance, et
      rel\xa1che pour
      une attaque
      cyclone!
  - name: TX_320b
    index: 0x0b
    text: |-
      D\xa6tourne les
      attaques
      ennemies en
      appuyant sur le
      bouton \col(1)\xa6cu\col(0).
  - name: TX_320c
    index: 0x0c
    text: |-
      Il y a cinq
      types de
      \col(1)Graines
      Mystique\col(0).
      Elles existent
      dans diff\xa6rentes
      \xa6poques, et
      chaque \col(1)graine\col(0)
      est unique.\stop
      Tu ne peux pas
      transporter de
      \col(1)graines\col(0) sans
      \col(1)poche\col(0).
  - name: TX_320d
    index: 0x0d
    text: |-
      Apr\xa5s avoir
      sorti une
      \col(1)Bombe\col(0),
      appuie sur le
      bouton pour la
      poser.
      Appuie sur \col(0x84)\item(0x00)\col(0)
      pour lancer une
      \col(1)Bombe\col(0) dans
      cette direction.
      Appuie encore
      sur le bouton
      pour ramasser
      une \col(1)Bombe\col(0)
      pos\xa6e.
  - name: TX_320e
    index: 0x0e
    text: |-
      Assigne des
      objets \xa0
      \abtn ou \bbtn
      dans les
      sous-\xa6crans. Tu
      ne poss\xa5des
      qu'une certaine
      quantit\xa6
      d'objets, telles
      les \col(1)graines\col(0)
      et les \col(1)Bombes\col(0).
  - name: TX_320f
    index: 0x0f
    text: |-
      SELECT pour
      afficher la
      carte. D\xa6place
      le curseur et
      appuie sur \abtn
      pour voir les
      noms. Les
      r\xa6gions
      sombres sont
      inexplor\xa6es.
  - name: TX_3210
    index: 0x10
    text: |-
      SELECT deux fois
      dans le menu
      pour afficher le
      Menu Essence.
      Choisis ensuite
      Sauvegarder avec
      \abtn pour afficher
      le menu
      sauvegarde.
  - name: TX_3211
    index: 0x11
    text: |-
      Le pr\xa6sent et
      le pass\xa6 sont
      li\xa6s. Certains
      \xa6v\xa6nements
      du pass\xa6
      influent sur le
      pr\xa6sent. Les
      objets du
      pr\xa6sent
      peuvent \xa7tre
      transport\xa6s
      dans le pass\xa6!
  - name: TX_3212
    index: 0x12
    text: |-
      START pour
      acc\xa6der au
      menu, SELECT
      pour faire
      d\xa6filer les
      \xa6crans\stop
      Inventaire,
      \xa6cran Qu\xa7te et
      \xa6cran Essence.
      Dans l'\xa6cran
      Qu\xa7te, vous
      pouvez activer
      un \col(1)anneau\col(0).
  - name: TX_3213
    index: 0x13
    text: |-
      Hmm, m\xa7me ces
      \col(3)Oizosaitout\col(0)
      savent tout sur
      les \col(1)essences\col(0).
  - name:
    - TX_3214
    - TX_3215
    index:
    - 0x14
    - 0x15
    text: |-
      Non! Je dois
      \xa6couter le chant
      de \col(3)Nayru\col(0)!
  - name: TX_3216
    index: 0x16
    text: |-
      \col(3)Cit\xa6 Lynna\col(0)!
      Maison de \col(3)Nayru\col(0)!
      \col(3)Zelda\col(0) viens!
      \col(3)Zelda\col(0) viens!
  - name: TX_3217
    index: 0x17
    text: S'il te plait!
- group: 0x33
  data:
  - name: TX_3300
    index: 0x00
    text: |-
      Voici la
      \col(3)Biblioth\xa5que de
      l'Ile du
      Monocle\col(0).
      Il para\xa9t qu'il
      y a de la \col(1)Poudre
      de F\xa6e\col(0) \xa0
      l'arri\xa5re, mais
      je n'en ai pas
      vu.
  - name: TX_3301
    index: 0x01
    text: |-
      Voici la
      \col(3)Biblioth\xa5que de
      l'\xa9le Monocle\col(0).
      Il n'y a plus de
      \col(1)Poudre de F\xa6e\col(0),
      mais les mers
      sont propres.
  - name: TX_3302
    index: 0x02
    text: |-
      Le monstre
      \xa6trange est
      toujours sur
      l'\xa9le de l'est.
      Il n'attaque
      jamais, et
      semble avoir
      besoin d'aide.
      Il para\xa9t m\xa7me
      qu'il peut
      parler. C'est
      d\xa6bile!
  - name: TX_3303
    index: 0x03
    text: |-
      Le monstre
      \xa6trange \xa6tait
      en fait
      la \col(3)Reine
      des F\xa6es\col(0).
      Aussi \xa6trange
      que cela puisse
      para\xa9tre, \xa4a
      doit \xa7tre
      vrai.
  - name: TX_3304
    index: 0x04
    text: |-
      La \col(3)Reine des
      F\xa6es\col(0) vivait sur
      l'\xa9le \xa0 l'ouest,
      mais elle a
      disparu...
      Elle pourrait
      certainement
      faire quelque
      chose pour les
      mers...
  - name: TX_3305
    index: 0x05
    text: |-
      C'est toi qui as
      sauv\xa6 la \col(3)Reine
      des F\xa6es\col(0)?
      Alors c'est toi
      qui as sauv\xa6
      les \col(3)Mers Zora\col(0).
  - name: TX_3306
    index: 0x06
    text: |-
      La \col(1)Poudre de F\xa6e\col(0)
      est quelque part
      derri\xa5re, mais
      sans un autre
      \col(1)Livre des
      Scell\xa6s\col(0), on
      ne peut pas
      l'atteindre. Au
      fait, c'est quoi
      de la \col(1)Poudre de
      F\xa6e\col(0)?
  - name: TX_3307
    index: 0x07
    text: |-
      Je pensais pas
      qu'on pouvait
      r\xa6soudre cette
      \xa6nigme...
      Depuis
      quand le \col(1)Livre
      des Scell\xa6s\col(0)
      est-il en ta
      possession?
  - name: TX_3308
    index: 0x08
    text: |-
      Voici le \col(1)Livre
      des Scell\xa6s\col(0).
      C'est le
      dernier
      exemplaire
      restant. Ils
      \xa6taient
      utilis\xa6s
      pour des
      \xa6nigmes.
  - name: TX_3309
    index: 0x09
    text: |-
      Tu penses
      pouvoir
      r\xa6soudre
      l'\xa6nigme de ce
      \col(1)livre\col(0)?
      Hoh hoh! Voil\xa0
      qui est
      int\xa6ressant! Je
      te donne le
      \col(1)Livre des
      Scell\xa6s\col(0)!
  - name: TX_330a
    index: 0x0a
    text: |-
      As-tu trouv\xa6
      l'enigme?
  - name: TX_330b
    index: 0x0b
    text: |-
      Tu es courageux
      pour \xa7tre arriv\xa6
      jusqu'ici. Je
      vais te donner
      ceci.
  - name: TX_330c
    index: 0x0c
    text: |-
      Continue comme
      \xa4a. Et n'oublie
      pas ton
      courage.
  - name:
    - TX_330d
    - TX_330e
    - TX_330f
    index:
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Je n'ai plus ce
      que tu cherches.
  - name: TX_3310
    index: 0x10
    text: |-
      Tu as trouv\xa6
      l'\xa6nigme. Tu
      d\xa6sires quelque
      chose?
        \opt()Oui \opt()Non
  - name: TX_3311
    index: 0x11
    text: Alors va-t'en!
  - name: TX_3312
    index: 0x12
    text: |-
      Tu connais le
      \col(1)secret\col(0)?\stop
      Ce secret ne
      sert que pour
      la \col(3)biblioth\xa5que\col(0).\stop
      Ne le dis \xa0
      personne. Je
      t'offre ceci en
      \xa6change de ton
      silence!
  - name:
    - TX_3313
    - TX_3314
    index:
    - 0x13
    - 0x14
    text: |-
      C'est le \col(1)secret\col(0)
      de l'\xa6cu en
      \col(3)Holodrum\col(0):\stop
      \secret1\stop
      Reviens si tu
      as oubli\xa6 le
      \col(1)secret\col(0)!
  - name: TX_3315
    index: 0x15
    text: |-
      Merci d'avoir
      pay\xa6 pour
      r\xa6parer ma
      porte.
  - name: TX_3316
    index: 0x16
    text: |-
      Ne recommence
      pas!
  - name: TX_3317
    index: 0x17
    text: |-
      Je ne peux pas
      prendre ce que
      tu n'as pas.
      \jump(TX_3316)
    null_terminator: false
  - name: TX_3318
    index: 0x18
    text: Ne dis rien!
  - name: TX_3319
    index: 0x19
    text: |-
      Je n'ai plus
      rien pour toi.
- group: 0x34
  data:
  - name: TX_3400
    index: 0x00
    text: |-
      La douleur!
      C'est la fin
      pour moi...
      La famille
      royale va
      s'\xa6teindre en
      une
      g\xa6n\xa6ration...
      La douleur...
  - name: TX_3401
    index: 0x01
    text: |-
      \call(TX_3400)
      Donner \col(1)Potion
      Magique\col(0)?
        \opt()Oui \opt()Non
  - name: TX_3402
    index: 0x02
    text: |-
      Est-ce une
      \col(1)Potion Magique\col(0)?\stop
      Hmm...
      Elle a l'air
      bizarre... Pas
      grave, je ne
      risque rien,
      puisque je vais
      mourir!
  - name: TX_3403
    index: 0x03
    text: Gloub, ahh!
  - name: TX_3404
    index: 0x04
    text: |-
      Ahh! C'est
      d\xa6gueulasse!\stop
      Mais elle me
      soigne, la
      lign\xa6e royale
      est sauv\xa6e!\stop
      Qui es-tu?\stop
      Et bien, merci,
      \Link!\stop
      C'est l'eau
      croupie venant
      de l'est qui m'a
      rendu malade. Je
      ne t'oublierai
      jamais!\stop
      Que d\xa6sires-tu,
      \Link?\stop
      Un gros poisson?
      Tu veux dire...
      \col(3)Jabu-Jabu\col(0)?\stop
      Mais \col(3)Jabu-Jabu\col(0)
      est le gardien
      des Zora!
      C'est une
      insulte si tu
      l'appelles un
      poisson! Mesure
      tes paroles!
  - name: TX_3405
    index: 0x05
    text: |-
      De l'eau croupie
      s'\xa6coule de
      l'est. C'est \xa4a
      qui a du me
      rendre malade.
      En tout cas, je
      ne t'oublierai
      pas!
  - name: TX_3406
    index: 0x06
    text: |-
      En plus, tu as
      nettoy\xa6 les
      mers! Je dois te
      remercier encore
      une fois! Quoi?
      Tu veux entrer
      dans le ventre
      de \col(3)Jabu-Jabu\col(0)?
      J'aimerais bien
      te laisser le
      faire,
      mais \col(3)Jabu-Jabu\col(0)
      est encore
      jeune.
      Il est trop
      petit pour
      entrer en lui.
      Tu devrais
      oublier cette
      folle id\xa6e.
  - name: TX_3407
    index: 0x07
    text: |-
      \Link!
      Le sauveur des
      \col(3)Mers Zora\col(0)!\stop
      Je te remercie
      de la part des
      Zora!
  - name: TX_3408
    index: 0x08
    text: |-
      Grand Soigneur!\stop
      Que veux-tu?\stop
      Tu souhaites
      entrer dans
      \col(3)Jabu-Jabu\col(0)?
      Il te faut ma
      permission pour
      y entrer, mais
      je ne peux
      laisser
      n'importe qui
      voir notre
      gardien.
      Quoiqu'il en
      soit, les eaux
      croupies ont
      failli tuer
      \col(3)Jabu-Jabu\col(0).\n
    null_terminator: false
  - name: TX_3409
    index: 0x09
    text: |-
      Si tu dis \xa7tre
      oblig\xa6 de le
      faire, alors tu
      dois purifier
      l'eau croupie
      pour sauver
      \col(3)Jabu-Jabu\col(0).
      Acceptes-tu
      cette qu\xa7te?
        \opt()Oui \opt()Non
  - name: TX_340a
    index: 0x0a
    text: |-
      C'est ainsi...
      Alors rien ne
      peut \xa7tre fait.
  - name: TX_340b
    index: 0x0b
    text: |-
      Tr\xa5s bien!
      Alors prends
      \xa4a!
  - name: TX_340c
    index: 0x0c
    text: |-
      C'est la \col(1)cl\xa6\col(0) de
      la \col(3)Biblioth\xa5que
      de l'Ile du
      Monocle\col(0) qui est
      \xa0 l'est d'ici.
      C'est une
      ancienne
      \col(3)Biblioth\xa5que\col(0).
      Je ne sais pas
      si cette \col(1)cl\xa6\col(0)
      marche toujours.
      Tu pourras
      comprendre
      pourquoi les
      eaux sont
      empoisonn\xa6es,
      l\xa0-bas. Je te
      fais confiance
      pour sauver
      \col(3)Jabu-Jabu\col(0).
  - name: TX_340d
    index: 0x0d
    text: |-
      Merci \xa0 toi,
      l'eau de mer est
      purifi\xa6e et
      \col(3)Jabu-Jabu\col(0) est
      sauv\xa6. Tout va
      bien.\stop
      Comme promis, je
      vais te laisser
      entrer dans le
      ventre de
      \col(3)Jabu-Jabu\col(0).\n
    null_terminator: false
  - name: TX_340e
    index: 0x0e
    text: |-
      Tu peux aller
      voir \col(3)Jabu-Jabu\col(0).
  - name: TX_340f
    index: 0x0f
    text: |-
      Tu es le h\xa6ros
      qui a purifi\xa6
      les \col(3)Mers Zora\col(0).
      Je te remercie
      de la part de
      tous les Zora.
  - name: TX_3410
    index: 0x10
    text: |-
      Le \col(3)Roi des Zora\col(0)
      n'a pas de
      successeur. Si
      sa maladie
      continue et
      qu'il meurt, le
      peuple des Zora
      n'aura plus de
      roi.
  - name: TX_3411
    index: 0x11
    text: |-
      Merci \xa0 toi, le
      \col(3)Roi des Zora\col(0) va
      mieux! La lign\xa6e
      royale est
      sauv\xa6e!
  - name: TX_3412
    index: 0x12
    text: |-
      Tu veux entrer
      dans
      \col(3)Jabu-Jabu\col(0)?!?
      Mais \col(3)Jabu-Jabu\col(0)
      n'est qu'un
      b\xa6b\xa6! Tu ne peux
      entrer dans son
      ventre!
  - name: TX_3413
    index: 0x13
    text: |-
      Cet escalier
      m\xa5ne \xa0 la salle
      du tr\xd0ne.
      Le Roi est
      malade. Si tu
      veux le voir,
      tu devras
      faire court.
  - name: TX_3414
    index: 0x14
    text: |-
      Cet escalier
      m\xa5ne \xa0 la salle
      du tr\xd0ne.
      Mesure tes
      paroles quand tu
      lui parles.
  - name: TX_3415
    index: 0x15
    text: |-
      Notre ma\xa9tre, le
      \col(3)Roi Zora\col(0),
      est tomb\xa6
      malade...
      Nous avons fait
      tout ce que nous
      pouvions, mais
      rien ne change.
  - name: TX_3416
    index: 0x16
    text: |-
      \Link!
      Voici le \col(3)Palais
      du Roi Zora\col(0).
  - name: TX_3417
    index: 0x17
    text: |-
      Le \col(3)Roi des Zora\col(0)
      a l'air de
      souffrir, non?
  - name: TX_3418
    index: 0x18
    text: |-
      Merci pour ce
      que tu as fait!
      Tu as redonn\xa6
      vie au \col(3)Roi des
      Zora\col(0)!
  - name: TX_3419
    index: 0x19
    text: |-
      Les \col(3)Mers Zora\col(0)
      sont pures!
      C'est gr\xa1ce \xa0
      toi, \Link.
  - name: TX_341a
    index: 0x1a
    text: |-
      Je crois qu'il
      nous faut un
      m\xa6dicament
      appel\xa6 \col(1)Potion
      Magique\col(0) pour
      soigner le \col(3)Roi
      des Zora\col(0). Mais
      nous ne savons
      pas o\xae en
      trouver!
  - name:
    - TX_341b
    - TX_341c
    - TX_341d
    - TX_341e
    - TX_341f
    index:
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Bien, bien,
      \Link!
  - name: TX_3420
    index: 0x20
    text: |-
      Ceci \xa6tait le
      palais du \col(3)Roi
      Zora\col(0). Il y a
      longtemps, le
      roi est tomb\xa6
      malade. Depuis,
      nous n'avons
      plus de roi.
      Voici ce que le
      roi cherchait...
      La \col(1)cl\xa6\col(0) de la
      \col(3)Biblioth\xa5que de
      l'\xa9le Monocle\col(0),
      elle \xa6tait
      perdue.
  - name: TX_3421
    index: 0x21
    text: |-
      Le Roi
      recherchait la
      \col(1)cl\xa6\col(0) de la
      \col(3)Biblioth\xa5que de
      l'Ile Monocle\col(0)
      dans un endroit,
      \xa0 l'est.
  - name: TX_3422
    index: 0x22
    text: |-
      Le \col(3)Roi des Zora\col(0)
      permettra \xa0 un
      h\xa6ros d'entrer
      dans \col(3)Jabu-Jabu\col(0).
  - name: TX_3423
    index: 0x23
    text: |-
      As-tu pris
      l'\col(1)\x1aessence\x1a\col(0)?
      C'est la moindre
      des choses, de
      la part du h\xa6ros
      du \col(3)Roi des
      Zora\col(0).
  - name: TX_3424
    index: 0x24
    text: |-
      Cet escalier
      m\xa5ne \xa0 la salle
      du tr\xd0ne. Mesure
      tes paroles
      quand tu parles
      au Roi.
  - name: TX_3425
    index: 0x25
    text: |-
      Bienvenue,
      voyageur. Voici
      le palais du \col(3)Roi
      Zora\col(0).
  - name: TX_3426
    index: 0x26
    text: |-
      Bien, bien!
      \Link!
      Voici le palais
      du \col(3)Roi des
      Zora\col(0).
  - name: TX_3427
    index: 0x27
    text: |-
      Notre ma\xa9tre, le
      \col(3)Rois des Zora\col(0),
      est \xa0 l'arri\xa5re.
      Fais attention
      de ne pas \xa7tre
      impoli.
  - name: TX_3428
    index: 0x28
    text: |-
      Le Roi est tr\xa5s
      ouvert d'esprit.
      Tu peux lui
      parler de ce que
      tu veux.
  - name:
    - TX_3429
    - TX_342a
    - TX_342b
    - TX_342c
    - TX_342d
    - TX_342e
    - TX_342f
    index:
    - 0x29
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    text: |-
      Nos mers sont
      pures de nouveau
      gr\xa1ce \xa0 toi. Le
      Roi en est
      content!
  - name: TX_3430
    index: 0x30
    text: |-
      Tu as fait
      beaucoup pour
      nous!\stop
      Les mers sont
      pures! Je
      t'offre ce
      symbole de
      l'h\xa6roisme,
      l'\col(1)Ecaille de
      Zora\col(0)!
  - name: TX_3431
    index: 0x31
    text: |-
      Cet oc\xa6an
      englouti tout
      ceux qui
      naviguent
      dessus. Tu ne
      peux franchir la
      \col(3)Mer des
      Temp\xa7tes\col(0)!
      Je ne peux pas
      te laisser
      passer, mon
      gar\xa4on!
  - name: TX_3432
    index: 0x32
    text: |-
      L'\col(1)Ecaille des
      Zora\col(0)?
      Alors tu es
      \Link!
      Tu peux passer!
      Ce que tu vas
      faire ne me
      regarde pas,
      mais bonne
      chance!
  - name: TX_3433
    index: 0x33
    text: |-
      J'\xa6tudie les
      causes de cette
      pollution.\stop
      Il semble que
      l'eau a \xa6t\xa6
      pollu\xa6e il y a
      tr\xa5s longtemps,
      mais je n'en
      sais pas
      plus...
  - name: TX_3434
    index: 0x34
    text: |-
      Je vais \xa6tudier
      encore un peu
      pour essayer
      d'aider le
      peuple des
      Zora.
  - name: TX_3435
    index: 0x35
    text: |-
      Tu as besoin de
      moi, v\xa6n\xa6r\xa6e
      sir\xa5ne?
        \opt()Oui \opt()Non
  - name: TX_3436
    index: 0x36
    text: Je vois...
  - name: TX_3437
    index: 0x37
    text: |-
      Oh! Un \col(1)secret\col(0) du
      Zora que j'ai
      envoy\xa6 en
      \col(3)Holodrum\col(0) pour
      nous trouver un
      nouveau domaine!
      Tu as bien fait!
      Merci. Voil\xa0
      pour toi... Oui!
      Donne-moi ton
      \col(1)\xa6p\xa6e\col(0)! Je vais
      l'aiguiser!
  - name: TX_3438
    index: 0x38
    text: |-
      Tu veux me
      tromper?
  - name:
    - TX_3439
    - TX_343a
    - TX_343b
    - TX_343c
    - TX_343d
    - TX_343e
    - TX_343f
    index:
    - 0x39
    - 0x3a
    - 0x3b
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    text: |-
      Je vais te dire
      le \col(1)secret\col(0) pour
      aiguiser ton
      \col(1)\xa6p\xa6e\col(0) en
      \col(3)Holodrum\col(0)!\stop
      \secret1\stop
      Reviens si tu
      oublies le
      \col(1)secret\col(0).
  - name: TX_3440
    index: 0x40
    text: |-
      Les eaux sont
      pollu\xa6es! Koff!
      Koff! Je ne peux
      pas nager en
      paix.
  - name: TX_3441
    index: 0x41
    text: |-
      Ha-ha! Les mers
      sont propres! Je
      peux \xa0 nouveau
      nager!
  - name: TX_3442
    index: 0x42
    text: |-
      \call(TX_3447)
      Ne sois pas
      insolent!
  - name: TX_3443
    index: 0x43
    text: |-
      Les mers sont
      redevenues
      pures!
      Le \col(3)Roi Zora\col(0)
      va mieux!
      Tout va bien!
  - name: TX_3444
    index: 0x44
    text: |-
      Nous valons
      mieux, nous les
      Zora des mers,
      que ces
      mis\xa6rables Zoras
      des rivi\xa5res!
  - name: TX_3445
    index: 0x45
    text: |-
      Tu n'es pas au
      bon endroit si
      tu veux te
      plaindre des
      Zora des
      rivi\xa5res.
  - name: TX_3446
    index: 0x46
    text: |-
      Il y a une
      \col(3)Biblioth\xa5que\col(0) \xa0
      l'est du palais
      du \col(3)Roi des
      Zora\col(0).
  - name: TX_3447
    index: 0x47
    text: |-
      Le palais du \col(3)Roi
      des Zora\col(0) est
      l\xa0-bas.
  - name: TX_3448
    index: 0x48
    text: |-
      Les mers sont
      propres!
      Le \col(3)Roi des\col(0)
      Zora va \xa7tre
      content!
  - name: TX_3449
    index: 0x49
    text: |-
      \col(3)Jabu-Jabu\col(0)
      est au-del\xa0 de
      cet endroit. Il
      para\xa9t que son
      ventre est un
      labyrinthe.
  - name: TX_344a
    index: 0x4a
    text: |-
      Il faut faire
      attention \xa0
      \col(3)Jabu-Jabu\col(0)! Il
      peut nous
      avaler!
  - name: TX_344b
    index: 0x4b
    text: |-
      N'y a-t'il aucun
      \xa7tre digne de
      recevoir le
      symbole Zora de
      l'h\xa6roisme,
      l'\col(1)Ecaille des
      Zora\col(0)?
  - name: TX_344c
    index: 0x4c
    text: |-
      \Link! H\xa6ros des
      Zora!
  - name: TX_344d
    index: 0x4d
    text: |-
      Il n'y as pas
      beaucoup de
      sir\xa5nes qui
      viennent nous
      rendre visite!
      Voici le \col(3)Village
      Zora\col(0)!
  - name: TX_344e
    index: 0x4e
    text: |-
      Bienvenue, jeune
      sir\xa5ne, au
      \col(3)Village Zora\col(0)!
- group: 0x35
  data:
  - name: TX_3500
    index: 0x00
    text: |-
      Vous pouvez
      planter une
      \col(1)Graine Gasha\col(0).
        \opt()Planter \opt()Non
  - name: TX_3501
    index: 0x01
    text: |-
      Vous obtenez une
      \col(1)Noix Gasha\col(0)!
      Regardez ce
      qu'elle
      contient!
  - name: TX_3502
    index: 0x02
    text: \xa0 l'int\xa6rieur!
  - name: TX_3503
    index: 0x03
    text: |-
      Il y a dedans
      un \col(1)Quart de
      Coeur\col(0)!\heartpiece
      Regardez dans
      le sous-menu.
  - name: TX_3504
