    - 0x24
    text: |-
      \pos(2)Il y a
      peut-\xa7tre
      quelque chose
      dans la \col(3)Maison
      de Nayru\col(0) qui
      pourra t'aider!
  - name:
    - TX_0505
    - TX_0506
    - TX_0525
    - TX_0526
    index:
    - 0x05
    - 0x06
    - 0x25
    - 0x26
    text: |-
      \pos(2)Tu peux
      voyager dans
      le temps avec
      la \col(1)Harpe des
      Ages\col(0).
  - name:
    - TX_0507
    - TX_0508
    - TX_0527
    - TX_0528
    index:
    - 0x07
    - 0x08
    - 0x27
    - 0x28
    text: |-
      \pos(2)Je sens une
      \col(1)Essence du Temps\col(0)
      sur l'\col(3)Ile
      Croissant\col(0) dans
      la mer du sud!!!
      Mais prends
      garde en
      traversant la
      mer, OK?
  - name:
    - TX_0509
    - TX_0529
    index:
    - 0x09
    - 0x29
    text: |-
      \pos(2)La \col(3)Tour Noire\col(0)
      du pass\xa6 est
      presque
      termin\xa6e. Il va
      se passer des
      choses terribles
      si tu ne te
      d\xa6p\xa7ches pas!\n
    null_terminator: false
  - name:
    - TX_050a
    - TX_052a
    index:
    - 0x0a
    - 0x2a
    text: |-
      \pos(2)Une \col(1)essence\col(0)
      r\xa6sonne pr\xa5s du
      pic au nord-
      ouest de la \col(3)Cit\xa6
      Lynna\col(0).
      Peux-tu y
      aller?
  - name:
    - TX_050b
    - TX_050c
    - TX_052b
    - TX_052c
    index:
    - 0x0b
    - 0x0c
    - 0x2b
    - 0x2c
    text: |-
      \pos(2)Il y a une
      montagne au nord
      de la \col(3)Maison de
      Nayru\col(0) qui est en
      relation avec
      les \col(1)essences\col(0).
      D\xa6sol\xa6e! Je n'en
      sais pas plus!
  - name:
    - TX_050d
    - TX_052d
    index:
    - 0x0d
    - 0x2d
    text: |-
      \pos(2)Suis la
      l\xa6gende des
      Goron.
      Peut-\xa7tre
      contient-elle
      un indice.
  - name:
    - TX_050e
    - TX_050f
    - TX_052e
    - TX_052f
    index:
    - 0x0e
    - 0x0f
    - 0x2e
    - 0x2f
    text: |-
      \pos(2)C'est pour
      cela que \col(3)Nayru\col(0) a
      \xa6t\xa6 captur\xa6e?
  - name:
    - TX_0510
    - TX_0511
    - TX_0530
    - TX_0531
    index:
    - 0x10
    - 0x11
    - 0x30
    - 0x31
    text: |-
      \pos(2)Pourquoi
      est-ce que je
      ressens une
      \col(1)essence\col(0) pr\xa5s de
      \col(3)Rouleroche\col(0)?
  - name:
    - TX_0512
    - TX_0532
    index:
    - 0x12
    - 0x32
    text: |-
      \pos(2)Je suis jalouse
      que tu en
      fasses autant
      pour une autre
      fille, \Link!
      Laisse l'Oracle
      des Ages!
  - name:
    - TX_0513
    - TX_0533
    index:
    - 0x13
    - 0x33
    text: |-
      \pos(2)Vite, va au
      \col(3)Palais d'Ambi\col(0)!\heart
  - name:
    - TX_0514
    - TX_0515
    - TX_0534
    - TX_0535
