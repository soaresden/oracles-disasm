groups:
- group: 0x00
  data:
  - name:
    - TX_0000
    - TX_0001
    index:
    - 0x00
    - 0x01
    text: |-
      Vous obtenez \col(1)1
      Rubis\col(0)!
  - name: TX_0002
    index: 0x02
    text: |-
      Vous obtenez
      \col(1)5 Rubis\col(0)!
  - name: TX_0003
    index: 0x03
    text: |-
      Vous obtenez
      \col(1)10 Rubis\col(0)!
  - name: TX_0004
    index: 0x04
    text: |-
      Vous obtenez
      \col(1)20 Rubis\col(0)!
      C'est pas mal.
  - name: TX_0005
    index: 0x05
    text: |-
      Vous obtenez
      \col(1)30 Rubis\col(0)!
      C'est bien.
  - name: TX_0006
    index: 0x06
    text: |-
      Vous obtenez
      \col(1)50 Rubis\col(0)!
      Quelle chance!
  - name: TX_0007
    index: 0x07
    text: |-
      Vous obtenez \col(1)100
      Rubis\col(0)!
      G\xa6nial!
  - name: TX_0008
    index: 0x08
    text: |-
      Vous obtenez \col(1)150
      Rubis\col(0)!
      C'est la
      f\xa7te!!!
  - name: TX_0009
    index: 0x09
    text: |-
      Vous obtenez \col(1)200
      Rubis\col(0)! C'est
      le bonheur!
  - name: TX_000a
    index: 0x0a
    text: |-
      Vous avez appris
      le \col(1)Chant des
      Flux\col(0)!\stop
      Jouez-le pour
      aller du pass\xa6
      au pr\xa6sent!
      Choisissez-le
      quand vous
      utilisez la
      \col(1)harpe\col(0)!
  - name: TX_000b
    index: 0x0b
    text: |-
      Vous avez appris
      le \col(1)Chant du
      Temps\col(0)!\stop
      Jouez-le pour
      voyager entre
      le pr\xa6sent et
      le pass\xa6!
      Choisissez-le
      quand vous
      utilisez
      la \col(1)harpe\col(0).
  - name: TX_000c
    index: 0x0c
    text: |-
      Vous obtenez
      L'\col(1)Embl\xa5me Fr\xa5re\col(0)!
      Vous \xa7tes
      maintenant un
      Goron aussi!
  - name: TX_000d
    index: 0x0d
    text: |-
      Vous obtenez le
      \col(1)Semis Parfum\col(0)!
       Va-t-il
      donner des
      graines?
  - name: TX_000e
    index: 0x0e
    text: |-
      \pos(2)\slow()Vous obtenez
      l'\col(1)Esprit
      Eternel\col(0),
      une Essence
      du Temps!\stop
      M\xa7me apr\xa5s la
      mort, il parle
      aux coeurs \xa0
      travers le
      temps.
  - name: TX_000f
    index: 0x0f
    text: |-
      \pos(2)\slow()Vous obtenez le
      \col(1)Bois Ancien\col(0), une
      Essence du
      Temps!\stop
      Il murmure la
      v\xa6rit\xa6 aux
      oreilles closes
      depuis
      l'immobilit\xa6.
  - name: TX_0010
    index: 0x10
    text: |-
      \pos(2)\slow()Vous obtenez le
      \col(1)Hurlement Echo\col(0),
      une Essence du
      Temps!\stop
      Il r\xa6sonne
      depuis
      les plaines
      isol\xa6es
      pour parler aux
      coeurs
      insolents.
  - name: TX_0011
    index: 0x11
    text: |-
      \pos(2)\slow()Vous obtenez la
      \col(1)Flamme Br\xaflante\col(0),
      une Essence du
      Temps!\stop
      Elle rallume les
      coeurs faibles
      d'une flamme
      passionn\xa6e.
  - name: TX_0012
    index: 0x12
    text: |-
      \pos(2)\slow()Vous obtenez la
      \col(1)Terre Sacr\xa6e\col(0),
      une Essence
      du Temps!\stop
      Tout ce qui
      dort dans les
      entrailles de la
      terre conna\xa9tra
      la chaleur
      nourrissante
      de la Terre
      Sacr\xa6e.
  - name: TX_0013
    index: 0x13
    text: |-
      \pos(2)\slow()Vous obtenez le
      \col(1)Pic D\xa6muni\col(0),
      une Essence
      du Temps!\stop
      C'est un esprit
      fier et seul,
      qui reste
      noble et
      vif, m\xa7me dans
      les moments
      difficiles.
  - name: TX_0014
    index: 0x14
    text: |-
      \pos(2)\slow()Vous obtenez la
      \col(1)Mar\xa6e\col(0), une
      Essence du
      Temps!\stop
      Le chant
      mystique
      de la mer
      r\xa6sonne
      en une vague
      qui envoie les
      h\xa6ros vers
      l'aventure.
  - name: TX_0015
    index: 0x15
    text: |-
      \pos(2)\slow()Vous obtenez
      l'\col(1)Etoile
      Tombante\col(0),
      une Essence du
      Temps!\stop
      La lumi\xa5re
      \xa6ternelle
      de ce corps
      c\xa6leste sert de
      guide vers les
      autres
      essences.
  - name: TX_0016
    index: 0x16
    text: |-
      Vous obtenez un
      nouveau \col(1)Coeur\col(0)!
  - name: TX_0017
    index: 0x17
    text: |-
      Vous obtenez un
      \col(1)Quart de
      Coeur\col(0)!\heartpiece
      Ramassez-en 4
      pour obtenir un
      nouveau \col(1)Coeur\col(0)!
      Le nombre de
      Quart de Coeur
      est dans
      l'Inventaire.
  - name: TX_0018
    index: 0x18
    text: |-
      C'est une \col(1)Carte
      du Donjon\col(0)!
      SELECT pour
      l'afficher.
      Les zones
      sombres sont
      les endroits
      inexplor\xa6s.
  - name: TX_0019
    index: 0x19
    text: |-
      Vous trouvez la
      \col(1)Boussole\col(0)!\stop
      Elle affiche
      votre position
      et celle des
      coffres et
      des cl\xa6s.
  - name: TX_001a
    index: 0x1a
    text: |-
      Vous trouvez une
      \col(1)Petite Cl\xa6\col(0)!\stop
      Elle sert \xa0
      ouvrir des
      portes ou
      des blocs
      dans les
      donjons.
  - name: TX_001b
    index: 0x1b
    text: |-
      Vous trouvez la
      \col(1)Cl\xa6 du Boss\col(0)!
  - name: TX_001c
    index: 0x1c
    text: |-
      Vous obtenez une
      \col(1)Ep\xa6e de Bois\col(0)!
      Maintenez
      \abtn ou \bbtn
      pour charger
      et rel\xa1chez pour
      ex\xa6cuter une
      attaque
      cyclone!
  - name: TX_001d
    index: 0x1d
    text: |-
      Vous obtenez
      l'\col(1)Ep\xa6e Noble\col(0)!
  - name: TX_001e
    index: 0x1e
    text: |-
      Vous obtenez la
      l\xa6gendaire \col(1)Ep\xa6e
      Ma\xa9tre\col(0)!
  - name: TX_001f
    index: 0x1f
    text: |-
      Vous obtenez un
      \col(1)Ecu de Bois\col(0)!
  - name: TX_0020
    index: 0x20
    text: |-
      Vous obtenez un
      \col(1)Ecu de Fer\col(0)!
  - name: TX_0021
    index: 0x21
    text: |-
      Vous obtenez un
      \col(1)Ecu Miroir\col(0)!
  - name: TX_0022
    index: 0x22
    text: |-
      Vous obtenez le
      \col(1)Boomerang\col(0)!
      Il peut stopper
      les ennemis!
  - name: TX_0023
    index: 0x23
    text: |-
      Vous obtenez la
      \col(1)Cl\xa6 du
      Cimeti\xa5re\col(0)!
  - name: TX_0024
    index: 0x24
    text: |-
      Vous obtenez des
      \col(1)Bombes\col(0)!
      Elles servent \xa0
      casser des murs
      fragiles. \abtn ou
      \bbtn pour allumer
      une \col(1)Bombe\col(0).
      Avec \col(0x84)\item(0x00),
      vous pouvez
      lancer une
      \col(1)Bombe\col(0).
  - name: TX_0025
    index: 0x25
    text: |-
      Vous obtenez la
      \col(1)Pelle\col(0)! Vous
      pouvez creuser!
  - name: TX_0026
    index: 0x26
    text: |-
      \pos(2)Vous obtenez le
       \col(1)Bracelet de
      Force\col(0)!
      Maintenez le
      bouton et
      appuyez sur \col(0x84)\item(0x00)\col(0)
      pour soulever de
      gros objets!
  - name: TX_0027
    index: 0x27
    text: |-
      Vous obtenez la
      \col(1)Plume de Roc\col(0)!
      Vous \xa7tes l\xa6ger
      comme une
      plume!
  - name: TX_0028
    index: 0x28
    text: |-
      Vous obtenez
      l'\col(1)Inverseur\col(0)!
      Inverser votre
      position avec
      celle d'un objet
      \xa0 distance.
  - name: TX_0029
    index: 0x29
    text: |-
      Vous obtenez les
      \col(1)Graines Parfum\col(0)!
      Leur odeur
      attire les
      monstres.
      Ouvrez votre
      \col(1)Poche \xa0 Graines\col(0)
      pour les
      utiliser.
  - name: TX_002a
    index: 0x2a
    text: |-
      Vous obtenez les
      \col(1)Graines Myst\xa5re\col(0)!
      Leur effet est
      un myst\xa5re!
      Essayez-les
      partout!
      Ouvrez votre
      \col(1)Poche \xa0 Graines\col(0)
      pour les
      utiliser.
  - name: TX_002b
    index: 0x2b
    text: |-
      Vous obtenez les
      \col(1)Graines P\xa6gase\col(0)!
      Elles augmentent
      votre vitesse!
      Ouvrez votre
      \col(1)Poche \xa0 Graines\col(0)
      pour les
      utiliser.
  - name: TX_002c
    index: 0x2c
    text: |-
      Vous obtenez les
      \col(1)Graines Vent\col(0)!
      Leur souffle
      peut vous
      transporter
      n'importe o\xae.
      Ouvrez votre
      \col(1)Poche \xa0 Graines\col(0)
      pour les
      utiliser.
  - name: TX_002d
    index: 0x2d
    text: |-
      \pos(2)Vous obtenez
      une \col(1)Poche \xa0
      Graines\col(0)! Elle
      poss\xa5de 20
      \col(1)Graines
      Braise\col(0)!
  - name: TX_002e
    index: 0x2e
    text: |-
      Vous obtenez le
      \col(1)Lance-Graines\col(0)!\stop
      Choisissez une
      \col(1)graine\col(0), tirez
      et regardez-la
      faire des
      ricochets.
  - name: TX_002f
    index: 0x2f
    text: |-
      Vous obtenez le
      \col(1)Bracelet de
      Force\col(0)!
      Vous pouvez
      soulever des
      objets lourds.
  - name: TX_0030
    index: 0x30
    text: |-
      Vous obtenez le
      \col(1)Grappin\col(0)!
      Tirez sur un
      objet pour \xa7tre
      tract\xa6 vers
      lui.
  - name: TX_0031
    index: 0x31
    text: |-
      Vous obtenez les
      \col(1)Palmes Zora\col(0)!
      Vous pouvez
      nager! \abtn pour
      nager, \bbtn pour
      plonger!
  - name: TX_0032
    index: 0x32
    text: |-
      Vous obtenez des
      \col(1)Missiles\col(0)!
      Lancez-les sur
      vos ennemis!
  - name: TX_0033
    index: 0x33
    text: |-
      Vous obtenez une
      \col(1)Grosse Graine
      Bojo\col(0)! Elle peut
      disperser les
      forces
      mal\xa6fiques!
  - name: TX_0034
    index: 0x34
    text: |-
      Vous obtenez une
      \col(1)Bo\xa9te \xa0 Anneaux\col(0)
      plus grosse!
      Elle contient
      plus d'\col(1)anneaux\col(0)!
  - name: TX_0035
    index: 0x35
    text: |-
      Oups! Ca ne se
      porte pas comme
      \xa4a!
  - name: TX_0036
    index: 0x36
    text: |-
      Vous obtenez une
      \col(1)Tenue de Sir\xa5ne\col(0)!
      Vous pouvez
      nager en eaux
      profondes.
      \col(0x84)\item(0x00)\col(0) pour nager, \bbtn
      pour plonger
      et \abtn pour
      utiliser un
      objet.
  - name: TX_0037
    index: 0x37
    text: |-
      Vous obtenez une
      \col(1)Noix de Tuni\col(0)!
  - name: TX_0038
    index: 0x38
    text: |-
      Vous obtenez la \col(1)
      Fl\xafte de Ricky\col(0)!
      \col(3)Ricky\col(0) viendra \xa0
      votre secours si
      vous en jouez.
  - name: TX_0039
    index: 0x39
    text: |-
      Vous obtenez la
      \col(1)Fl\xafte de
      Dimitri\col(0)! \col(3)Dimitri\col(0)
      viendra \xa0 votre
      secours si vous
      en jouez.
  - name: TX_003a
    index: 0x3a
    text: |-
      Vous obtenez la
      \col(1)Fl\xafte de Moosh\col(0)!
      \col(3)Moosh\col(0) viendra \xa0
      votre secours si
      vous en jouez!
  - name: TX_003b
    index: 0x3b
    text: |-
      Vous obtenez une
      \col(1)Fl\xafte Etrange\col(0)!
      Elle a l'air
      rare!
  - name: TX_003c
    index: 0x3c
    text: |-
      Vous obtenez un
      \col(1)Chou P\xa6teur\col(0)! A
