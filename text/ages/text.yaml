  - name: TX_0050
    index: 0x50
    text: |-
      Vous obtenez dix
      \col(1)Graines P\xa6gase\col(0)!
  - name: TX_0051
    index: 0x51
    text: |-
      Vous ne
      r\xa6g\xa6n\xa6rez qu'un
      seul coeur.
