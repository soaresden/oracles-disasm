      Hmm! Pas mal!\stop
      Mais c'est tout
      ce que tu auras
      aujourd'hui.
  - name: TX_0709
    index: 0x09
    text: |-
      Ouch...\stop
      Fais attention,
      tu viens de
      bousculer \col(3)Maple\col(0),
      l'apprentie de
      \col(3)Syrup\col(0), la
