    text: |-
      \col(3)Veran\col(0) a dit
      qu'elle va
      revenir dans le
      temps. Elle
      veut utiliser
      le pouvoir de
      \col(3)Nayru\col(0)
      pour intervenir
      dans le pass\xa6.
      On ressent d\xa6j\xa0
      les effets \xa0
      \col(3)Labrynna\col(0).\stop
      \col(3)Holodrum\col(0),
      puis \col(3)Labrynna\col(0)
      ont subi un
      funeste sort. Je
      suis d\xa6sol\xa6e de
      demander tant,
      mais je ne peux
      compter sur
      personne
      d'autre.
      Par piti\xa6, sauve
      \col(3)Nayru\col(0)!
  - name: TX_0120
    index: 0x20
    text: |-
      \Link, tu dois
      sauver \col(3)Nayru\col(0)!
  - name: TX_0121
    index: 0x21
    text: |-
      Il doit y avoir
      une pi\xa5ce
      secr\xa5te! J'ai
      senti des
      courants d'airs
      venant du
      dessus...
  - name: TX_0122
    index: 0x22
    text: |-
      Tu dois sauver
      \col(3)Nayru\col(0)!
      Le monde est en
      train de
      s'\xa6crouler!
  - name: TX_0123
    index: 0x23
    text: |-
      Sauver \col(3)Nayru\col(0) ne
      suffit pas...
      Laisse-moi \xa4a.
      Tu dois
      retourner dans
      le temps pour
      arr\xa7ter les
      plans de \col(3)Veran\col(0)!
  - name: TX_0124
    index: 0x24
    text: |-
      \Link!!!
      Attends!
  - name: TX_0125
    index: 0x25
    text: |-
      \pos(2)\Link, je
      fouillais dans
      le pass\xa6 et j'ai
      d\xa6couvert un
      truc horrible!
      \col(3)Ralph\col(0) est un
      descendant de la
      \col(3)Reine Ambi\col(0)!
      Sais-tu ce que
      cela veut dire?\stop
      \col(3)Ralph\col(0) vit car
      \col(3)Ambi\col(0) a v\xa6cu dans
      le pass\xa6. Si
      \col(3)Ambi\col(0) est tu\xa6e,
      \col(3)Ralph\col(0) n'existera
      jamais!\stop
      J'ai essay\xa6 de
      stopper \col(3)Ralph\col(0),
      mais je n'ai pas
      r\xa6ussi!
  - name: TX_0126
    index: 0x26
    text: |-
      \pos(2)Tu es le seul
      qui puisse
      sauver \col(3)Ralph\col(0)
      et nous tous,
      \Link!
  - name: TX_0127
    index: 0x27
    text: |-
      \Link!
      Bon timing!
      Cet oiseau vient
      de me dire que
      \col(3)Zelda\col(0) est partie
      pour le \col(3)Village
      Lynna\col(0)!
      Je suis venue
      la retrouver,
      mais...\stop
      Quel bazar!
      Un monstre rouge
      est apparu
      devant mes yeux
      et a captur\xa6
      \col(3)Zelda\col(0)!
      Je suis
      d\xa6sesp\xa6r\xa6e...
      Que dois-je
      faire?
      \Link, \col(3)Zelda\col(0)
      est le symbole
      de l'espoir pour
      le monde! S'il
      lui est arriv\xa6
      quelque chose,
      tout espoir
      sera perdu!\stop
      Tu dois sauver
      \col(3)Zelda\col(0)!
      \Link, tu dois
      trouver un moyen
      de sauver
      \col(3)Zelda\col(0)!
  - name: TX_0128
    index: 0x28
    text: |-
      \col(3)Zelda\col(0)!!!
      Tu es sauve!
      J'\xa6tais
      inqui\xa5te.
      Pourquoi es-tu
      venue seule dans
      cet endroit
      dangereux?
  - name: TX_0129
    index: 0x29
    text: |-
      \col(3)Zelda\col(0) doit \xa7tre
      au sommet de la
      tour! \Link, tu
      dois la sauver!
  - name: TX_012a
    index: 0x2a
    text: |-
      \Link s'en
      occupe. Il n'y a
      plus rien \xa0
      craindre, \col(3)Zelda\col(0).
      Nous devons nous
      cacher dans la
      \col(3)Maison de Nayru\col(0)
      et attendre les
      instructions de
      \Link.\stop
      \Link...
      Tu te dirigeais
      vers les
      montagnes du
      nord-ouest? Il y
      a un sentier qui
      y m\xa5ne. Fais
      attention.
  - name: TX_012b
    index: 0x2b
    text: |-
      Que va-t-il
      arriver aux
      villageois?
  - name: TX_012c
    index: 0x2c
    text: |-
      Le sort de \col(3)Zelda\col(0)
      m'inqui\xa5te.
      \Link,
      tu dois sauver
      \col(3)Nayru\col(0)!
  - name: TX_012d
    index: 0x2d
    text: |-
      Sauver \col(3)Nayru\col(0) ne
      suffit pas.
      \Link! Nous
      comptons sur
      toi!
  - name: TX_012e
    index: 0x2e
    text: |-
      Si \col(3)Zelda\col(0) \xa6tait
      ici, tout irait
      bien!
  - name: TX_012f
    index: 0x2f
    text: |-
      Ahhh! \col(3)Zelda\col(0) a
      \xa6t\xa6 captur\xa6e!
      Que devons-nous
      faire? Tu dois
      faire quelque
      chose, \Link!
  - name: TX_0130
    index: 0x30
    text: |-
      \Link!
      C'est terrible!\n
  - name: TX_0131
    index: 0x31
    text: |-
      \col(3)Zelda\col(0)!
      Oh, \col(3)Zelda\col(0)!
      Ecoute, alors
      que les gens
      p\xa6trifi\xa6s
      commen\xa4aient \xa0
      aller mieux,
      \col(3)Zelda\col(0) et moi
      avons encourag\xa6
      un enfant qui
      pleurait. Et
      alors, la
      lumi\xa5re...
  - name: TX_0132
    index: 0x32
    text: |-
      Je m'inqui\xa6tais
      pour \col(3)Nayru\col(0).
