      Mais j'l'aime
      bien!
      Tiens, en
      \xa6change je vais
      te donner \xa4a!
      Jouer du
      ukul\xa6l\xa6 sous
      la lune, c'est
      trop cool.
  - name: TX_2713
    index: 0x13
    text: |-
      Je vais devoir
      ramer avec mes
      mains.
  - name: TX_2714
    index: 0x14
    text: |-
      H\xa6! Tu bosses
      dur?
  - name: TX_2715
    index: 0x15
    text: |-
      Bienvenue dans
      la \col(3)Biblioth\xa5que
      de l'Ile du
      Monocle\col(0). Il y a
      longtemps, de la
      \col(1)Poudre de F\xa6e\col(0) y
