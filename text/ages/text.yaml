- group: 0x01
  data:
  - name: TX_0100
    index: 0x00
    text: \pos(2)A L'AIDEEEE!!!
  - name: TX_0101
    index: 0x01
    text: |-
      C'\xa6tait
      terrifiant!\stop
      J'ai \xa6t\xa6
      attaqu\xa6e
      par surprise...
      Merci,
      voyageur.
      Quel est ton
      nom?\stop
      \Link?\stop
      Je vois une \sym(0x57)
      sur le dos de ta
      main gauche.
      C'est le signe
      du h\xa6ros
      d'\col(3)Hyrule\col(0)! C'est
      pour \xa4a que le
      monstre s'est
      enfui.\stop
      Je suis \col(3)Impa\col(0),
      la nurse de la
      \col(3)Princesse Zelda\col(0)
      d'\col(3)Hyrule\col(0).
  - name: TX_0102
    index: 0x02
    text: |-
      \call(TX_0101)
      Je recherche
      une chanteuse
      nomm\xa6e \col(3)Nayru\col(0).\stop
      Veux-tu m'aider,
      \Link?
      Je me sentirai
      plus en s\xa6curit\xa6
      avec toi pr\xa5s
      de moi.
  - name: TX_0103
    index: 0x03
    text: |-
      \call(TX_0101)
      \col(3)Zelda\col(0) m'a
      demand\xa6 de
      trouver cette
      chanteuse
      nomm\xa6e
      \col(3)Nayru\col(0).\stop
      Veux-tu m'aider,
      \Link?
      Je me sentirai
      plus en
      s\xa6curit\xa6.
  - name: TX_0104
    index: 0x04
    text: Oh! C'est \xa4a!
  - name: TX_0105
    index: 0x05
    text: |-
      Le rocher avec
      une \sym(0x57)!
  - name: TX_0106
    index: 0x06
    text: |-
      Pourrais-tu
      bouger ce
      rocher pour
      moi, \Link?
  - name: TX_0107
    index: 0x07
    text: |-
      Je... Hm...
      Je vais
      juste...
  - name: TX_0108
    index: 0x08
    text: |-
      Je n'y arrive
      pas...
  - name: TX_0109
    index: 0x09
    text: |-
      Merci...
      Allons-y.
  - name: TX_010a
    index: 0x0a
    text: |-
      O\xae vas-tu?
      \jump(TX_010c)
    null_terminator: false
  - name: TX_010b
    index: 0x0b
    text: Que fais-tu?\n
    null_terminator: false
  - name:
    - TX_010c
