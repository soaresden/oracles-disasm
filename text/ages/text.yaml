      inqui\xa6t\xa6... Mais
      j'ai vu... Ce
      monde ravag\xa6 par
      la d\xa6solation et
      la douleur...
      Qui se
      consumait!
  - name: TX_0604
    index: 0x04
    text: |-
      \Link,\stop
      la \sym(0x57) sur ta main
      gauche est la
      marque des
      h\xa6ros. Nous
      devons emp\xa7cher
      \col(3)Veran\col(0) de faire
      ce qu'elle veut!
      Toi seul peux
      sauver le monde
      des plans
      mal\xa6fiques de
      \col(3)Twinrova\col(0)!\stop
      S'il te pla\xa9t,
      \Link, chasse
      les t\xa6n\xa5bres de
      ce royaume de ta
      main de justice
      et de courage!
  - name: TX_0605
