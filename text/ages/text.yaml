      \col(1)graines\col(0).
- group: 0x36
  data:
  - name: TX_3600
    index: 0x00
    text: |-
      Naviguer, c'est
      le r\xa7ve de tous!\stop
      Mes r\xa7ves ne
      sont que voyages
      en bateau...
      \call(TX_3602)
  - name: TX_3601
    index: 0x01
    text: |-
      Yoho! Ca fait
      longtemps! Je ne
      pensais pas te
      rencontrer ici!
      Nous avons
      parcouru tout le
      chemin depuis
      \col(3)Holodrum\col(0)...
      \call(TX_3602)
  - name: TX_3602
    index: 0x02
    text: |-
      Mais nous avons
      \xa6t\xa6 bloqu\xa6s dans
      la \col(3)Mer des
      Temp\xa7tes\col(0)!
      Har! Tu as le
      charme de
      l'\col(1)Ecaille des
      Zora\col(0)!
      Ca pourrait
      calmer la \col(3)Mer
      des Temp\xa7tes\col(0)!
      Bon, donne-moi
      cette \col(1)Ecaille
      des Zora\col(0)!
        \opt()OK \opt()Non
  - name: TX_3603
    index: 0x03
    text: |-
      Merci! T'es un
      bon gar\xa4on!
      Yoho, matelots!
  - name: TX_3604
    index: 0x04
    text: |-
      \call(TX_3603)
      On va vers
      \col(3)Holodrum\col(0), le
      pays des
      saisons!
  - name: TX_3605
    index: 0x05
    text: |-
      \call(TX_3603)
      Contemple
      l'\xa1me des
      marins!
  - name: TX_3606
    index: 0x06
    text: |-
      Merci! Gr\xa1ce \xa0
      toi, nous
      pouvons quitter
      cette mer!
      Prends-\xa4a! C'est
      un joyau appel\xa6
      l'\col(1)Oeil de Tokay\col(0)!
      Il para\xa9t que \xa4a
      peut ouvrir
      le chemin d'une
      \col(3)tombe ancienne\col(0).
      Je ne sais pas
      si c'est vrai.
  - name: TX_3607
    index: 0x07
    text: Yoho!
  - name: TX_3608
    index: 0x08
    text: |-
      Ca fait combien
      de temps qu'on
      est l\xa0?
  - name: TX_3609
    index: 0x09
    text: |-
      Le \col(3)Capt'n\col(0) ne
      comprend rien.
  - name: TX_360a
    index: 0x0a
    text: |-
      On raconte qu'il
      y a des ruines
      g\xa6antes \xa0 l'est
      dans la \col(3)Mer du
      Non Retour\col(0).
  - name: TX_360b
    index: 0x0b
    text: |-
      Si tu vas dans
      les ruines de
      l'est, tu seras
      perdu \xa0 jamais.
  - name: TX_360c
    index: 0x0c
    text: |-
      Tu nous as bien
      aid\xa6s! Nous
      avons trouv\xa6 cet
      \col(1)Oeil de Tokay\col(0)
      sur l'\col(3)Ile du
      Croissant\col(0). Faut
      p't-\xa7tre aller
      l\xa0-bas?\stop
      Hissez la voile,
      matelots!\stop
      Yoho!
  - name: TX_360d
    index: 0x0d
    text: |-
      L'orbite de
      l'oeil est vide,
      qu'est-ce qui
      pourrait bien y
      rentrer?
- group: 0x37
  data:
  - name: TX_3700
    index: 0x00
    text: |-
      Je suis \col(3)Plen\col(0), le
      maire de \col(3)Cit\xa6
      Lynna\col(0).\stop
      As-tu besoin de
      moi?
        \opt()Oui \opt()Non
  - name: TX_3701
    index: 0x01
    text: Je vois...
  - name: TX_3702
    index: 0x02
    text: |-
      C'est de la part
      du type habill\xa6
      bizarrement.
      Merci de ta
      gentillesse.
      Accepte ceci.
  - name: TX_3703
    index: 0x03
    text: |-
      Qu'est-ce que
      c'est?
  - name:
    - TX_3704
    - TX_3705
    - TX_3706
    - TX_3707
    - TX_3708
    - TX_3709
    - TX_370a
    - TX_370b
    - TX_370c
    - TX_370d
    - TX_370e
    - TX_370f
    index:
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Souviens-toi
      qu'il faut le
      faire \xa6valuer.
  - name: TX_3710
    index: 0x10
    text: |-
      Je suis \col(3)Adlar\col(0).\stop
      Pendant
      cinquante ans
      j'ai \xa6t\xa6 le
      conseiller du
      palais, mais
      on m'en a
      chass\xa6. Je
      connais la Reine
      depuis qu'elle
      est enfant. Elle
      aidait toujours
      le peuple.
      Mais depuis que
      cette \col(3)Nayru\col(0) est
      avec elle, elle
      a chang\xa6... Elle
      ne m'\xa6coute
      plus... C'est
      cette fille qui
      a demand\xa6 que je
      sois renvoy\xa6...
  - name: TX_3711
    index: 0x11
    text: |-
      Mais qui est
      cette \col(3)Nayru\col(0)?\stop
      Je ne vois que
      le monstre qui
      se cache en
      elle.\stop
      Je me demande si
      la Reine va
      bien.
  - name: TX_3712
    index: 0x12
    text: |-
      Je pensais que
      \col(3)Nayru\col(0) \xa6tait
      partie, mais la
      Reine ne va pas
      bien. Je ressens
      le m\xa7me frisson
      que j'ai
      ressenti en
      parlant \xa0 \col(3)Nayru\col(0).
      On dirait que
      c'est la Reine
      qui est un
      monstre...\stop
      J'esp\xa5re que la
      Reine va
      bien...
  - name: TX_3713
    index: 0x13
    text: |-
      La Reine va bien
      de nouveau.
      C'est bien, mais
      elle a dit
      qu'elle voulait
      partir en voyage
      dans un autre
      pays.\stop
      J'esp\xa5re qu'elle
      ira bien...
  - name: TX_3714
    index: 0x14
    text: |-
      Je suis \col(3)Plen\col(0), le
      maire de \col(3)Cit\xa6
      Lynna\col(0).\stop
      \col(3)Lynna\col(0) a une
      histoire qui
      remonte \xa0
      quelques
      centaines
      d'ann\xa6es. Avant,
      elle s'appelait
      \col(3)Village
      Lynna\col(0).
  - name: TX_3715
    index: 0x15
    text: |-
      Je suis \col(3)Plen\col(0), le
      maire de \col(3)Cit\xa6
      Lynna\col(0).\stop
      Il y a
      longtemps, la
      \col(3)Reine Ambi\col(0), est
      devenue une
      personne
      cruelle.
      On raconte que
      c'est \xa0 cause
      d'une fille qui
      a \xa6t\xa6 enlev\xa6e.\stop
      Je me demande
      bien ce qui
      s'est en fait
      pass\xa6?
  - name: TX_3716
    index: 0x16
    text: |-
      Hein? Il semble
      que la Reine ne
      soit pas
      retourn\xa6e au
      Palais.
      Quelque chose
      serait arriv\xa6 \xa0
      la tour.
- group: 0x38
  data:
  - name: TX_3800
    index: 0x00
    text: |-
      Que se
      passe-t-il?
      Mon p'tit-fils
      est en pierre!
      Pourquoi?
      Comment?
      R\xa6veillez-vous!
      Appelez-moi
      Grand-m\xa5re...
  - name: TX_3801
    index: 0x01
    text: |-
      Voir mon fils
      en bonne sant\xa6
      me fait du bien!
- group: 0x39
  data:
  - name: TX_3900
    index: 0x00
    text: |-
      Am\xa5ne-les moi
      tous.
  - name: TX_3901
    index: 0x01
    text: |-
      Une bonne
      d\xa6fense est la
      meilleure
      attaque
      contre des
      piques.
  - name: TX_3902
    index: 0x02
    text: |-
      Des sentiers
      s'ouvrent quand
      les anciens mots
      sont ma\xa9tris\xa6s.
  - name: TX_3903
    index: 0x03
    text: |-
      Avec l'aile
      bleue, tu
      voyages
      au-dessus des
      sommets
      color\xa6s.
  - name:
    - TX_3904
    - TX_3905
    index:
    - 0x04
    - 0x05
    text: |-
      Le flux du temps
      peut changer le
      pays.
  - name: TX_3906
    index: 0x06
    text: |-
      N'oublie pas de
      me nourrir de
      graines
      myst\xa5re.
  - name: TX_3907
    index: 0x07
    text: |-
      Le visage rouge
      n'aime pas la
      fum\xa6e.
  - name: TX_3908
    index: 0x08
    text: |-
      L'odeur pla\xa9t
      aux monstres.
  - name: TX_3909
    index: 0x09
    text: |-
      Prends garde \xa0
      l'eau profonde.
  - name: TX_390a
    index: 0x0a
    text: |-
      Ouvre tes
      oreilles au
      bruit de l'\xa6p\xa6e
      qui cogne les
      murs.
  - name: TX_390b
    index: 0x0b
    text: |-
      Tente ta
      chance.
  - name: TX_390c
    index: 0x0c
    text: |-
      Les soldats de
      pierre ne
      craignent pas
      les \xa6p\xa6es.
  - name: TX_390d
    index: 0x0d
    text: |-
      Les quatre
      cristaux
      s'assemblent.
  - name: TX_390e
    index: 0x0e
    text: |-
      La v\xa6rit\xa6 est
      derri\xa5re toi.
  - name: TX_390f
    index: 0x0f
    text: |-
      Plus rapide...
      Plus loin...
  - name: TX_3910
    index: 0x10
    text: |-
      Le flux monte en
      bleu et se
      r\xa6duit en
      rouge.
  - name: TX_3911
    index: 0x11
    text: |-
      La couleur
      montre la
      faiblesse.
  - name: TX_3912
    index: 0x12
    text: |-
      L'Ile Dor\xa6e est
      sur l'eau.
  - name:
    - TX_3913
    - TX_3914
    - TX_3915
    - TX_3916
    - TX_3917
    - TX_3918
    - TX_3919
    - TX_391a
    - TX_391b
    - TX_391c
    - TX_391d
    index:
    - 0x13
    - 0x14
    - 0x15
    - 0x16
    - 0x17
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    text: |-
      La l\xa6gende de la
      sir\xa5ne va du
      pass\xa6 vers le
      pr\xa6sent.
- group: 0x3d
  data:
  - name:
    - TX_3d00
    - TX_3d01
    - TX_3d02
    - TX_3d03
    - TX_3d04
    - TX_3d05
    - TX_3d0d
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x0d
    text: |-
      \pos(2)Uhhn...
      \Link!\stop
      ... C'est fini.
      Merci \xa0 toi,
      \Link.
      Tu as emp\xa7ch\xa6 le
      rituel qui
      aurait fait
      revivre \col(3)Ganon\col(0)!\stop
      Comme ils ne
      m'ont pas
      sacrifi\xa6e
      dans leur
      dernier rituel,
      le pouvoir des
      t\xa6n\xa5bres n'a
      rappel\xa6 qu'un
      \col(3)Ganon\col(0) sans
      esprit.\stop
      Tes pouvoirs, ta
      sagesse et ton
      courage, ont pu
      contrer les
      plans de
      \col(3)Twinrova\col(0).
      \col(3)Ganon\col(0) ne
      reviendra pas.\stop
      L'espoir et la
      paix vont
      revenir dans le
      coeur des gens.
      Merci \xa0 toi! Tu
      es un vrai
      h\xa6ros! Allons
      voir les
      autres!
  - name:
    - TX_3d06
    - TX_3d07
    - TX_3d08
    - TX_3d10
    - TX_3d11
    - TX_3d12
    - TX_3d14
    - TX_3d15
    index:
    - 0x06
    - 0x07
    - 0x08
    - 0x10
    - 0x11
    - 0x12
    - 0x14
    - 0x15
    text: |-
      \pos(0)\col(3)Zelda\col(0)! Je
      suis heureux
      voir que tu es
      sauve...
      \Link!
      Je savais que tu
      t'en sortirais!
      J'ai toujours
      cru en toi!
  - name:
    - TX_3d09
    - TX_3d13
    index:
    - 0x09
    - 0x13
    text: |-
      \pos(0)Je savais que
      tu trouverais un
      moyen, \Link!\stop
      Dansons
      ensemble!
  - name:
    - TX_3d0a
    - TX_3d0b
    index:
    - 0x0a
    - 0x0b
    text: |-
      \pos(0)Bienvenue,
      \col(3)Zelda\col(0), et toi
      aussi, \Link.\stop
      C'est termin\xa6,
      n'est-ce pas?
  - name:
    - TX_3d0c
    - TX_3d16
    index:
    - 0x0c
    - 0x16
    text: |-
      \pos(0)\Link...\stop
      Les trois \sym(0x57)sur
      ta main gauche
      symbolisent le
      courage, la
      sagesse et la
      puissance.
      Elles sont
      la marque
      des h\xa6ros dont
      la destin\xa6e est
      de sauver
      \col(3)Hyrule\col(0).\stop
      Avec les
      \col(1)Essences de la
      Nature et du
      Temps\col(0)\stop
      et ton courage,
      tu as repouss\xa6
      les puissances
      mal\xa6fiques! La
      Triforce a fait
      de toi un h\xa6ros
      l\xa6gendaire!
      Merci \xa0 toi,
      \Link.
  - name: TX_3d0e
    index: 0x0e
    text: |-
      \pos(2)Oh, non!!!\stop
      Le ch\xa1teau
      s'\xa6croule car
      les puissances
      des t\xa6n\xa5bres se
      dissipent!\stop
      Il faut quitter
      cet endroit!
  - name: TX_3d0f
    index: 0x0f
    text: |-
      \pos(2)! ! !
      Que
      faisons-nous?
- group: 0x41
  data:
  - name: TX_4100
    index: 0x00
    text: |-
      \pos(2)Je vais te
      soulager de ta
      fatigue. Ferme
      les yeux...
  - name:
    - TX_4101
    - TX_4102
    - TX_4103
    - TX_4104
    - TX_4105
    index:
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    text: |-
      \pos(2)Reviens me
      voir si tu te
      sens fatigu\xa6.
  - name: TX_4106
    index: 0x06
    text: |-
      Ecoute, jeune
      h\xa6ros! Je suis
      la \col(3)Reine des
      F\xa6es\col(0), gardienne
      de cette mer!
      \col(3)Veran\col(0) m'a maudit
      pour que je
      ressemble \xa0 \xa4a!
      La magie de la
      \col(1)Poudre de F\xa6e\col(0)
      peut me faire
      redevenir
      normale.\stop
      \col(3)Veran\col(0) a
      empoisonn\xa6 les
      mers. Bient\xd0t,
      toute forme de
      vie p\xa6rira!\n
    null_terminator: false
  - name: TX_4107
    index: 0x07
    text: |-
      Tu dois trouver
      de la \col(1)Poudre de
      F\xa6e\col(0)!
  - name: TX_4108
    index: 0x08
    text: |-
      Tu as amen\xa6 de
      la \col(1)Poudre de
      F\xa6e\col(0)!
      Je vais pouvoir
      redevenir
      normale!
      Jette de la
      \col(1)poudre\col(0) sur moi!
  - name: TX_4109
    index: 0x09
    text: |-
      Merci, jeune
      h\xa6ros!\stop
      Je peux
      maintenant
      purifier les
      mers pollu\xa6es!
- group: 0x42
  data:
  - name: TX_4200
    index: 0x00
    text: |-
      Je... Je suis
      \col(3)\Child\col(0)!\stop
      ! ! ! ! ! !
      Euh! J'ai parl\xa6
      \xa0 un \xa6tranger!
  - name: TX_4201
    index: 0x01
    text: |-
      Tu es \Link?\stop
      Je suis \col(3)\Child\col(0)!
      Pas moyen!
  - name: TX_4202
    index: 0x02
    text: |-
      Es-tu costaud?
        \opt()Oui \opt()Non
  - name: TX_4203
    index: 0x03
    text: |-
      Je serai fort
      aussi, pour
      prot\xa6ger
      m\xd0man et p\xd0pa!
  - name: TX_4204
    index: 0x04
    text: |-
      Hein???
      Et \xa4a ne
      t'ennuie pas?!?
  - name: TX_4205
    index: 0x05
    text: |-
      J'ai h\xa1te d'\xa7tre
      grand. Ouaip!
- group: 0x43
  data:
  - name: TX_4300
    index: 0x00
    text: |-
      Je suis \col(3)Bipin\col(0),
      l'arboriste! Je
      connais plein de
      choses sur les
      arbres.
      Tu sais quoi?
      \col(3)Blossom\col(0) et moi
      venons d'avoir
      notre premier
      enfant!
      Si, c'est
      vrai!!!\stop
      Regarde!
  - name: TX_4301
    index: 0x01
    text: |-
      Tr\xa5s bien, le
      nom est choisi!
      \col(3)\Child\col(0), hmm?
      C'est un joli
      nom! J'esp\xa5re
      qu'il sera un
      bon gar\xa4on!
  - name: TX_4302
    index: 0x02
    text: |-
      H\xa6, \Link!\stop
      Mon fils est
      malade, mais
      j'ai quand m\xa7me
      des choses \xa0 te
      dire.
  - name: TX_4303
    index: 0x03
    text: |-
      Mon gar\xa4on va
      bien, alors je
      peux me reposer!
      Aujourd'hui, je
      peux en dire
      plus!
  - name: TX_4304
    index: 0x04
    text: |-
      H\xa6, \Link!
      \col(3)\Child\col(0) grandit
      de jour en jour.
      J'ai des choses
      \xa0 dire!
  - name: TX_4305
    index: 0x05
    text: |-
      \Link! Ca
      fait longtemps!
      J'ai d\xa6m\xa6nag\xa6
      dans la cit\xa6.
      C'est cool de
      voir un visage
      connu!
  - name: TX_4306
    index: 0x06
    text: |-
      H\xa6, \Link!
      \col(3)\Child\col(0) va bien!
      Je vais te
      parler des
      arbres!
  - name: TX_4307
    index: 0x07
    text: |-
      H\xa6, \Link!\stop
      \col(3)\Child\col(0) est un
      grand
      maintenant!\n
    null_terminator: false
  - name: TX_4308
    index: 0x08
    text: |-
      Je vais tout te
      dire \xa0 propos
      des arbres!
  - name: TX_4309
    index: 0x09
    text: |-
      Le contenu des
      \col(1)Graines Gasha\col(0)
      d\xa6pend de
      l'endroit o\xae a
      \xa6t\xa6 plant\xa6 la
      \col(1)graine\col(0). Si tu
      trouves un bon
      endroit, dis-le
      moi!
  - name: TX_430a
    index: 0x0a
    text: |-
      A l'int\xa6rieur
      d'une \col(1)Graine
      Gasha\col(0)? Tu
      trouveras
      surtout des
      \col(1)Anneaux
      Magiques\col(0),
      parfois des
      Rubis ou des
      Coeurs.
  - name: TX_430b
    index: 0x0b
    text: |-
      Il para\xa9t que le
      contenu d'une
      \col(1)graine\col(0) d\xa6pend
      des actions du
      planteur. Plus
      il a voyag\xa6,
      plus il a occis
      de monstres,
      plus la graine
      sera
      int\xa6ressante!
  - name: TX_430c
    index: 0x0c
    text: |-
      Trouver de
      nouveaux
      endroits pour
