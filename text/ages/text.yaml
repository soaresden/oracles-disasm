      de mon peuple.
  - name: TX_1311
    index: 0x11
    text: |-
      \pos(2)C'est dur! Je
      suis encore
      jeune, ne
      m'appelle pas
      mamy!
  - name: TX_1312
    index: 0x12
    text: |-
      \pos(3)Le pass\xa6 est
      en ordre! Tu
      peux revenir
      sans crainte.Je
      ne t'oublierai
      jamais.
  - name: TX_1313
    index: 0x13
    text: |-
      \pos(2)Tu dois
      \xa7tre... \col(3)Ralph\col(0),
      de la famille
      d'\col(3)Ambi\col(0)...\stop
      Hah! Je n'ai
      pas le temps de
      m'occuper de ce
      t\xa6tard! Va-t'en
      si tu tiens \xa0
      ta vie.
      A moins que
      tu ne veuilles
      te battre?
      Ne me fais pas
      rire!\stop
      Cr\xa6tin! Voici le
      corps d'\col(3)Ambi\col(0),
      ton anc\xa7tre. Si
      tu me tues, tu
      dispara\xa9tras
      aussi!\stop
      Veux-tu toujours
      te battre?
  - name: TX_1314
    index: 0x14
    text: |-
      \pos(2)Oh, \Link!\stop
      Gr\xa1ce \xa0 ma
      gentillesse,
      \col(3)Ralph\col(0) est en
      vie. Et pourtant
      tu veux te
      battre!
      Si tu touches le
      corps d'\col(3)Ambi\col(0),
      \col(3)Ralph\col(0)
      dispara\xa9tra.\stop
      La vie de ton
      ami repose
      entre
      tes mains!
      Hah hah hah
      hah!
  - name: TX_1315
    index: 0x15
    text: |-
      \pos(1)Tu es venu
      malgr\xa6 mes
      avertissements?
      Tu ne respectes
      pas la vie? Ou
      tu es idiot? Ca
      ne sera pas
      facile, de toute
      fa\xa4on! Je vais
      te donner une
      le\xa4on!\stop
      Tu vas conna\xa9tre
      ma col\xa5re!
  - name: TX_1316
    index: 0x16
    text: |-
      La \col(3)Tour Ambi\col(0)
      sera bient\xd0t
      finie!
  - name: TX_1317
    index: 0x17
    text: |-
      Une fois la Tour
      d'Ambi termin\xa6e,
      on se souviendra
      de moi comme la
      Grande Reine!
  - name: TX_1318
    index: 0x18
    text: |-
      \Link! Que
      s'est-il pass\xa6?
      Je me sens
      bizarre... Comme
      si j'\xa6tais
      poss\xa6d\xa6e par
      le Mal...
  - name: TX_1319
    index: 0x19
    text: |-
      Quoi? Je dois
      partir
      maintenant! Je
      vois la peur
      dans tes yeux.
      J'aurais d\xaf
      faire comme
      pr\xa6vu...
  - name: TX_131a
    index: 0x1a
    text: |-
      Ne t'inqu\xa5te pas
      pour la ville.
      \col(3)Ralph\col(0) et moi, on
      est l\xa0. Tu dois
      sauver la
      \col(3)Princesse
      Zelda\col(0).
- group: 0x14
  data:
  - name: TX_1400
    index: 0x00
    text: |-
      Voici le \col(3)Village
      Lynna\col(0)...
      Hwahhhh! Oh!
      D\xa6sol\xa6! Ca fait
      longtemps que je
      n'ai pas eu une
      vraie nuit.
  - name: TX_1401
    index: 0x01
    text: |-
      Tout le monde
      dans le village
      est endormi.
  - name:
    - TX_1402
    - TX_1408
    - TX_1409
    - TX_140a
    - TX_140b
    - TX_140c
    - TX_140d
    - TX_140e
    - TX_140f
    - TX_1410
    - TX_1411
    - TX_1412
    - TX_1413
    index:
    - 0x02
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    - 0x10
    - 0x11
    - 0x12
    - 0x13
    text: |-
      C'est le matin?
      Midi? La nuit?
      Je n'en sais
      rien.
  - name: TX_1403
    index: 0x03
    text: |-
      Il y a du
      grabuge au
      \col(3)Palais d'Ambi\col(0).
  - name: TX_1404
    index: 0x04
    text: |-
      Ce monde va
      mourir. Mes
      larmes se sont
      s\xa6ch\xa6es.
  - name: TX_1405
    index: 0x05
    text: |-
      Ohhh... Mes
      espoirs, mes
      r\xa7ves... Tout
      est perdu...
  - name: TX_1406
    index: 0x06
    text: |-
      Ils ont captur\xa6
      la \col(3)Princesse
      Zelda\col(0)? Tout est
      fini!
  - name: TX_1407
    index: 0x07
    text: |-
      Bienvenue \xa0
      \col(3)Lynna\col(0), le
      Village du
      Temps!
  - name: TX_1414
    index: 0x14
    text: |-
      Je suis d\xa6prim\xa6!
      Il y a comme un
      trou dans mon
      coeur.
  - name:
    - TX_1415
    - TX_1416
    index:
    - 0x15
    - 0x16
    text: |-
      J'ai arr\xa7t\xa6
      \col(3)Ralph\col(0) quand il
      allait dans la
      tour. Il a dit:
      \x1aPeu importe
      ce qui va
      m'arriver!\x1a
      Il est comme
      nous tous.
      Plus rien
      ne compte.
  - name: TX_1417
    index: 0x17
    text: |-
      Bonjour!
      Bon apr\xa5s-midi!
      Bonsoir!
      Bonne nuit!
      Ahh! J'aime les
      salutations!
  - name:
    - TX_1418
    - TX_1419
    - TX_141a
    - TX_141b
    - TX_141c
    - TX_141d
    - TX_141e
    - TX_141f
    index:
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Je croyais que
      la \col(3)Princesse
      Zelda\col(0) \xa6tait ici.
      Elle n'est plus
      l\xa0, mon coeur
      est vide.
  - name: TX_1420
    index: 0x20
    text: |-
      L'\col(3)Arbre Bojo\col(0) est
      tout \xa0 l'est de
      cette grotte.
  - name: TX_1421
    index: 0x21
    text: |-
      Mon sens du
      temps est
      perturb\xa6.
      Pourquoi...
  - name: TX_1422
    index: 0x22
    text: |-
      \col(3)Nayru\col(0), l'Oracle
      des Ages, est
      revenue?!?
      Hourra!
  - name: TX_1423
    index: 0x23
    text: |-
      M\xa7me si \col(3)Nayru\col(0)
      est l\xa0, la tour
      grandit
      toujours! C'est
      un mauvais
      pr\xa6sage.
  - name: TX_1424
    index: 0x24
    text: |-
      Je sens de la
      magie dans
      l'\col(3)Arbre Bojo\col(0).
  - name:
    - TX_1425
    - TX_1426
    - TX_1427
    - TX_1428
    - TX_1429
    - TX_142a
    - TX_142b
    - TX_142c
    - TX_142d
    - TX_142e
    - TX_142f
    index:
    - 0x25
    - 0x26
    - 0x27
    - 0x28
    - 0x29
    - 0x2a
    - 0x2b
    - 0x2c
    - 0x2d
    - 0x2e
    - 0x2f
    text: |-
      L'\col(3)Arbre Bojo\col(0)
      \xa6tait contente.
      J'crois qu'elle
      est amoureuse!
  - name: TX_1430
    index: 0x30
    text: |-
      Cette blague va
      \xa0 l'encontre de
      nos convictions,
      tu sais...
  - name:
    - TX_1431
    - TX_1432
    - TX_1433
    index:
    - 0x31
    - 0x32
    - 0x33
    text: |-
      Je ne peux plus
      faire \xa4a!
      C'est fini!!!
  - name: TX_1434
    index: 0x34
    text: |-
      L'incertitude
      m'envahit!
  - name:
    - TX_1435
    - TX_1436
    - TX_1437
    - TX_1438
    - TX_1439
    - TX_143a
    - TX_143b
    - TX_143c
    - TX_143d
    - TX_143e
    - TX_143f
    - TX_1440
    index:
    - 0x35
    - 0x36
    - 0x37
    - 0x38
    - 0x39
    - 0x3a
    - 0x3b
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    - 0x40
    text: |-
      Alors, tu veux
      recommencer?
  - name: TX_1441
    index: 0x41
    text: |-
      On ne peut pas
      aller plus loin.
      Ce n'est pas
      fini ici, alors
      il n'y a pas
      d'entr\xa6e!
  - name: TX_1442
    index: 0x42
    text: |-
      Le village n'est
      pas heureux \xa0
      cause des
      travaux dans la
      tour de la \col(3)Reine
      Ambi\col(0). Pourtant
      tu passes du
      temps avec les
      enfants. H\xa6!
      T'es sympa!
  - name: TX_1443
    index: 0x43
    text: |-
      Mon fils est
      devenu si
      gentil! Il est
      heureux, \xa4a
      faisait
      longtemps que
      je n'avais pas
      jou\xa6 avec lui!
- group: 0x15
  data:
  - name: TX_1500
    index: 0x00
    text: |-
      La Reine \xa6tait
      tr\xa5s gentille
      avant. Tu peux
      demander \xa0
      l'ancien du
      village. Il vit
      sur la rivi\xa5re,
      pr\xa5s de la
      tour.
  - name: TX_1501
    index: 0x01
    text: |-
      Mon mari a \xa6t\xa6
      envoy\xa6 \xa0 la
      \col(3)Tour Noire\col(0).
      Je ne l'ai
      jamais revu.
  - name: TX_1502
    index: 0x02
    text: |-
      Ne dis rien de
      mal sur la
      Reine, sinon tu
      seras envoy\xa6
      dans les
      cachots. Elle
      est devenue
      dure.
  - name: TX_1503
    index: 0x03
    text: |-
      La \col(3)Reine Ambi\col(0)
      semble avoir
      chang\xa6e. Elle
      est tr\xa5s
      nerveuse.
  - name: TX_1504
    index: 0x04
    text: |-
      Il se passe des
      choses \xa6tranges
      dans les
      environs.
  - name:
    - TX_1505
    - TX_1506
    index:
    - 0x05
    - 0x06
    text: |-
      J'ai des choses
      \xa0 faire avant de
      partir!
  - name: TX_1507
    index: 0x07
    text: |-
      La Reine est
      gentille comme
      avant!
  - name:
    - TX_1508
    - TX_1509
    - TX_150a
    - TX_150b
    - TX_150c
    - TX_150d
    - TX_150e
    - TX_150f
    index:
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Les jours
      anciens o\xae il
      faisait bon
      vivre, me
      manquent...
  - name: TX_1510
    index: 0x10
    text: |-
      La \col(3)Reine Ambi\col(0)
      avait un petit
      ami, un marin.
      Mais il est
      parti un jour et
      n'est jamais
      revenu. Elle
      construit une
      grande tour pour
      guetter son
      retour de loin.
      On l'appelle la
      \col(3)Tour d'Ambi\col(0).
      C'est une
      histoire
      triste...
  - name: TX_1511
    index: 0x11
    text: |-
      Il y en a encore
      qui l'appelle la
      \col(3)Tour d'Ambi\col(0).
      Maintenant, on
      l'appelle la
      \col(3)Tour Noire\col(0).
  - name: TX_1512
    index: 0x12
    text: |-
      Je ne sais pas
      qui est la
      m\xa6chante, la
      \col(3)Reine Ambi\col(0) ou
      cette \col(3)Nayru\col(0).
      Qu'en
      penses-tu?
  - name:
    - TX_1513
    - TX_1514
    index:
    - 0x13
    - 0x14
    text: |-
      J'ai \xa6t\xa6 touch\xa6e
      par le visage de
      \col(3)Ralph\col(0) quand il
      pense \xa0 \col(3)Nayru\col(0).
      Il avait l'air
      si romantique.\heart
  - name:
    - TX_1515
    - TX_1516
    - TX_1517
    index:
    - 0x15
    - 0x16
    - 0x17
    text: |-
      \col(3)Ralph\col(0) n'est pas
      revenu... Hmm,
      pas que ce soit
      important....
  - name:
    - TX_1518
    - TX_1519
    - TX_151a
    - TX_151b
    - TX_151c
    - TX_151d
    - TX_151e
    - TX_151f
    index:
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Je suis rassur\xa6
      de savoir que la
      \col(3)Reine Ambi\col(0) n'est
      pas mauvaise,
      mais que va-t-il
      arriver \xa0 la
      \col(3)Princesse
      Zelda\col(0)?
  - name: TX_1520
    index: 0x20
    text: |-
      Ils construisent
      une tour de
      l'autre c\xd0t\xa6 de
      la rivi\xa5re.
  - name: TX_1521
    index: 0x21
    text: |-
      Hier, j'ai fait
      deux fois le
      petit-d\xa6jeuner.
      Par accident...
  - name: TX_1522
    index: 0x22
    text: |-
      Tu sais quoi? Je
      viens de
      d\xa6jeuner!
  - name: TX_1523
    index: 0x23
    text: |-
      Ca faisait
      longtemps que je
      n'avais pas
      pr\xa6par\xa6 \xa0
      d\xa9ner.
  - name: TX_1524
    index: 0x24
    text: |-
      J'suis une
      loque. J'ai
      envie de rien.
  - name: TX_1525
    index: 0x25
    text: |-
      C'est trop dur
      de pr\xa6parer \xa0
      manger!
  - name: TX_1526
    index: 0x26
    text: |-
      Il y avait un
      truc pour
      sceller les
      affaires,
      derri\xa5re. Mais
      il ne reste que
      ce \col(1)livre\col(0)
      chiffonn\xa6.
  - name: TX_1527
    index: 0x27
    text: |-
      Une beaut\xa6 qui
      lit un livre
      dans une
      biblioth\xa5que
      pr\xa5s d'une mer
      calme... C'est
      tr\xa5s romantique!
      C'est tout moi,
      \xa4a!
- group: 0x16
  data:
  - name: TX_1600
    index: 0x00
    text: |-
      Le village est
      rempli des
      d\xa6combres de la
      tour. Il n'y a
      pas de place
      pour marcher,
      et tous les
      outils pour
      d\xa6blayer
      sont utilis\xa6s
      dans la tour.
  - name: TX_1601
    index: 0x01
    text: |-
      Tous les hommes
      ont \xa6t\xa6
      r\xa6quisitionn\xa6s
      pour construire
      la tour. Il ne
      reste que les
      anciens.
  - name:
    - TX_1602
    - TX_1603
    index:
    - 0x02
    - 0x03
    text: |-
      L'Oracle des
      Ages habite
      quelque part
      dans ce pays.
      Je me demande
      si elle va bien.
  - name: TX_1604
    index: 0x04
    text: |-
      Que va-t-il
      arriver au
      monde?
  - name:
    - TX_1605
    - TX_1606
    index:
    - 0x05
    - 0x06
    text: |-
      Un gars nomm\xa6
      \col(3)Ralph\col(0) vient de
      rentrer dans la
      \col(3)Tour Noire\col(0).
  - name: TX_1607
    index: 0x07
    text: |-
      Mon fils est
      revenu de la
      tour! Mais il y
      est retourn\xa6!
      C'est un enfant
      anxieux!
  - name: TX_1608
    index: 0x08
    text: |-
      Quelqu'un s'est
      \xa6chou\xa6 sur la
      plage. Il a
      l'air subrosien.
  - name: TX_1609
    index: 0x09
    text: |-
      Je n'ai plus
      d'espoir. Je
      n'ai plus qu'\xa0
      attendre la
      fin...
  - name:
    - TX_160a
    - TX_160b
    - TX_160c
    - TX_160d
    - TX_160e
    - TX_160f
    index:
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      Hmph! Je crois
      que ce n'est pas
      encore le moment
      de partir!
  - name: TX_1610
    index: 0x10
    text: |-
      Voici la \col(3)Cit\xa6
      Lynna\col(0).
  - name: TX_1611
    index: 0x11
    text: |-
      Il para\xa9t qu'il
      y a des animaux
      qui appr\xa6cient
      les humains.
  - name: TX_1612
    index: 0x12
    text: |-
      Il para\xa9t qu'il
      y a une mer
      peupl\xa6e de
      cr\xa6atures
      appel\xa6es
      Zora.
  - name: TX_1613
    index: 0x13
    text: |-
      As-tu vu le
      Vaisseau Fant\xd0me
      naviguant vers
      les mers du
      sud?
  - name: TX_1614
    index: 0x14
    text: |-
      La tour est
      devenue si
      grande. Et le
      sommet est tr\xa5s
      moche. C'est
      quoi ce truc?
  - name:
    - TX_1615
    - TX_1616
    - TX_1617
    - TX_1618
    - TX_1619
    - TX_161a
    - TX_161b
    - TX_161c
    - TX_161d
    - TX_161e
    - TX_161f
    index:
    - 0x15
    - 0x16
    - 0x17
    - 0x18
    - 0x19
    - 0x1a
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      Voici la \col(3)Cit\xa6 de
      Lynna\col(0). C'est la
      cit\xa6 du temps
      sans fin!
  - name: TX_1620
    index: 0x20
    text: |-
      Que voulait la
      Reine? Graines
      Puzzle? Graines
      Enigmes? C'est
      un myst\xa5re!
  - name: TX_1621
    index: 0x21
    text: |-
      C'est \xa4a! La
      Reine voulait
      des Graines
      Puzzle! Je parie
      qu'elle est
      contente!
  - name: TX_1622
    index: 0x22
    text: |-
      Encore un?!?\stop
      D'abord, ce gars
      avec un chapeau
      bizarre...
      Depuis la venue
      de \col(3)Nayru\col(0), il se
      passe des choses
      \xa6tranges par
      ici!
- group: 0x17
  data:
  - name:
    - TX_1700
    - TX_1701
    index:
    - 0x00
    - 0x01
    text: |-
      Connais-tu les
      \col(3)Tokay\col(0)? Il para\xa9t
      qu'il y en a
      plein sur une
      \xa9le de l'autre
      c\xd0t\xa6 de la
      mer!
  - name: TX_1702
    index: 0x02
    text: |-
      \col(3)Nayru\col(0) a jou\xa6 un
      tour \xa0 la \col(3)Reine
      Ambi\col(0)? J'le
      savais!
  - name: TX_1703
    index: 0x03
    text: |-
      Quand \col(3)Nayru\col(0) a
      disparu, la
      Reine est
      devenue
      \xa6trange!
  - name:
    - TX_1704
    - TX_1705
    - TX_1706
    index:
    - 0x04
    - 0x05
    - 0x06
    text: |-
      La Reine semble
      \xa7tre
      compl\xa5tement
      diff\xa6rente.
  - name:
    - TX_1707
    - TX_1708
    - TX_1709
    - TX_170a
    - TX_170b
    - TX_170c
    - TX_170d
    - TX_170e
    - TX_170f
    index:
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      La Reine a
      chang\xa6. C'est
      bien qu'elle
      soit redevenue
      gentille.
  - name: TX_1710
    index: 0x10
    text: |-
      Je vais trouver
      un truc que la
      \col(3)Reine Ambi\col(0)
      d\xa6sire, comme \xa4a
      je n'aurai pas
      \xa0 bosser dans la
      tour.
  - name: TX_1711
    index: 0x11
    text: |-
      Je me demande ce
      que la \col(3)Reine
      Ambi\col(0) voudra
      ensuite...
  - name: TX_1712
    index: 0x12
    text: |-
      On dirait une
      famille
      heureuse.
      J'aimerais en
      faire partie...
- group: 0x18
  data:
  - name: TX_1800
    index: 0x00
    text: |-
      Ca fait
      longtemps qu'il
      n'a pas fait
      nuit, comme si
      le temps s'\xa6tait
      arr\xa7t\xa6.
  - name: TX_1801
    index: 0x01
    text: |-
      Il y a un dessin
      \xa6trange sur la
      porte de l'\col(3)Arbre
      Bojo\col(0). Qu'est-ce
      que \xa4a peut bien
      \xa7tre?
  - name: TX_1802
    index: 0x02
    text: |-
      Tous les jours,
      chaque jour
      c'est \x1abien
      le bonjour!\x1a
  - name:
    - TX_1803
    - TX_1804
    - TX_1805
    - TX_1806
    - TX_1807
    - TX_1808
    index:
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    text: |-
      Encore un qui a
      \xa6t\xa6 envoy\xa6 dans
      la tour. Que se
      passe-t-il?
  - name: TX_1809
    index: 0x09
    text: |-
      Tout le monde
      dit que \xa4a porte
      malheur de
      s'approcher de
      la tour.
  - name: TX_180a
    index: 0x0a
    text: |-
      Mon mari a donn\xa6
      \xa0 la \col(3)Reine Ambi\col(0)
      ce qu'elle
      d\xa6sirait, mais
      on l'a quand
      m\xa7me envoy\xa6
      au travail dans
      la \col(3)Tour
      Noire\col(0). Je veux
      qu'il revienne.
- group: 0x1a
  data:
  - name:
    - TX_1a00
    - TX_1a01
    - TX_1a02
    index:
    - 0x00
    - 0x01
    - 0x02
    text: |-
      L'\col(3)Arbre Bojo\col(0) est
      un arbre qui
      parle! Mais il a
      \xa6t\xa6 emb\xa7t\xa6 par
      des monstres...
  - name: TX_1a03
    index: 0x03
    text: |-
      Une personne
      \xa6trange est
      venue au
      village. On ne
      pourrait dire si
      c'\xa6tait un homme
      ou une femme!
      Hum... C'est
      inqui\xa6tant!
  - name: TX_1a04
    index: 0x04
    text: |-
      Je suis furieux!
      M\xa7me si la tour
      est finie, mon
      p\xa5re n'est pas
      revenu!
  - name:
    - TX_1a05
    - TX_1a06
    - TX_1a08
    index:
    - 0x05
    - 0x06
    - 0x08
    text: |-
      Sais-tu ce que
      l'expression \x1ade
      mon propre sang\x1a
      veut dire? \col(3)Ralph\col(0)
      le sait. Qu'est-
      ce que c'est?
  - name: TX_1a07
    index: 0x07
    text: |-
      Je peux jouer
      d\xa5s que j'en ai
      envie! Quel
      pied!
  - name: TX_1a09
    index: 0x09
    text: |-
      Quoi?!? La
      \col(3)Princesse Zelda\col(0)
      est partie???
- group: 0x1b
  data:
  - name: TX_1b00
    index: 0x00
    text: |-
      Le village est
      plein de
      rocaille depuis
      que la tour est
      en construction!
      Tu ne peux aller
      nulle part sans
      \col(1)Pelle\col(0) pour
      d\xa6blayer le
      chemin!
  - name: TX_1b01
    index: 0x01
    text: |-
      Ohh! Ca fait
      combien de temps
      que je
      travaille? Il
      ne fait jamais
      nuit, alors je
      ne sais plus. Je
      veux rentrer \xa0
      la maison.
  - name: TX_1b02
    index: 0x02
    text: |-
      La \col(3)Reine Ambi\col(0) a
      chang\xa6. Elle
      n'\xa6tait pas
      cruelle, mais
      elle nous
      demande
      l'impossible. Je
      n'ai rien dit!
  - name: TX_1b03
    index: 0x03
    text: |-
      C'est terrible
      depuis que \col(3)Nayru\col(0)
      est apparue. On
      doit bosser
      comme des b\xa7tes
      maintenant!
  - name: TX_1b04
    index: 0x04
    text: Creuse! Creuse!
  - name: TX_1b05
    index: 0x05
    text: Ho-hisse!
- group: 0x1c
  data:
  - name:
    - TX_1c00
    - TX_1c01
    - TX_1c02
    - TX_1c03
    - TX_1c04
    - TX_1c05
    - TX_1c06
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    text: |-
      Que se
      passe-t-il dans
      ce village? Il
      n'y a plus de
      vie!
  - name:
    - TX_1c07
    - TX_1c08
    - TX_1c09
    - TX_1c0a
    - TX_1c0b
    - TX_1c0c
    - TX_1c0d
    - TX_1c0e
    - TX_1c0f
    index:
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: |-
      L'\xa6nergie de
      tout le monde
      est revenue!
  - name: TX_1c10
    index: 0x10
    text: |-
      Salut! Tu te
      souviens de moi?
      Je suis \col(3)Rosa\col(0)! Tu
      as oubli\xa6 qu'on
      sortait
      ensemble?
      C'est mon
      premier long
      voyage!
      Et j'ai vu des
      gars louches
      avec une \col(1)Pelle\col(0),
      alors je leur ai
      demand\xa6 s'ils te
      connaissaient.\stop
      Et puis ils se
      sont mis \xa0
      sauter partout.
      C'est bizarre.
  - name: TX_1c11
    index: 0x11
    text: |-
      C'est ta \col(1)Pelle\col(0),
      \xa4a?
      Si tu ne la
      tiens pas bien,
      elle va tomber.
  - name: TX_1c12
    index: 0x12
    text: |-
      En fait le th\xa5me
      de mon voyage,
      c'est \x1ala femme
      ind\xa6pendante\x1a,
      alors, pas la
      peine d'attendre
      qu'on ressorte
      ensemble.
  - name: TX_1c13
    index: 0x13
    text: |-
      Salut, \Link! La
      Danse Goron est
      pleine de rage!
      Mais la Danse
      Subrosienne est
      plus cool. Ces
      Goron doivent
      \xa6voluer!
  - name: TX_1c14
    index: 0x14
    text: |-
      La Danse Goron
      est plus cool!
      Je vais la
      rendre
      populaire
      \xa0 Subrosia
  - name: TX_1c15
    index: 0x15
    text: |-
      Le \col(3)Goron
      Gracieux\col(0) est une
      star! Je vais
      devenir le
      \col(3)Subrosien
      Gracieux\col(0)!
- group: 0x1d
  data:
  - name: TX_1d00
    index: 0x00
    text: |-
      Merci \xa0 toi.\stop
      Tu viens
      d'\col(3)Hyrule\col(0)?
      Ravie de te
      rencontrer. Je
      suis \col(3)Nayru\col(0).
      J'\xa6tais inqui\xa5te
      en apprenant que
      les forces
      mal\xa6fiques
      semaient le
      trouble en
      \col(3)Labrynna\col(0).
  - name: TX_1d01
    index: 0x01
    text: |-
      \pos(2)\Link...
      Ha! Tu as bien
      fait! D'abord tu
      me fais passer
      la barri\xa5re,
      ensuite tu
      m'am\xa5nes des
      \col(1)Graines Myst\xa5re\col(0)!
      Tu es g\xa6nial!
      Se servir de la
      gentillesse des
      gens est trop
      facile!
      Voil\xa0 qui remet
      en cause mes
      ambitions. Mais
      ces \col(1)Graines
      Myst\xa5re\col(0) me
      g\xa7nent! Leur
      vue, leur
      odeur... Hmf!
  - name: TX_1d02
    index: 0x02
    text: |-
      \pos(2)\col(3)Reine Ambi\col(0)...
      Avec mes
      pouvoirs, le
      cours du temps
      est \xa0 tes
      ordres.
      Pour toi, je
      vais cr\xa6er un
      jour sans fin,
      pour que les
      gens
      ne dorment
      jamais et
      travaillent en
      permanence dans
      la tour. Et
      quand la tour
      touchera le
      ciel, tu seras
      la reine la plus
      c\xa6l\xa5bre!
  - name: TX_1d03
    index: 0x03
    text: |-
      \pos(1)H\xa6 h\xa6 h\xa6 h\xa6!
      Nous sommes
      proches de l'\xa1ge
      des ombres! Les
      t\xa6n\xa5bres
      s'abattront
      quand la\x20
      \col(3)Tour Noire\col(4)
      touchera les
      cieux. Je
      pourrai alors
      monter \xa0 son
      sommet!
      Alors, il sera
      l'heure...
      H\xa6 h\xa6 h\xa6...
      Hah hah hah
      hah!
  - name: TX_1d04
    index: 0x04
    text: |-
      Huhhn...
      \Link..?
      O\xae sommes-nous?
  - name: TX_1d05
    index: 0x05
    text: |-
      \col(3)Ralph\col(0)!!! Pardon\stop
      de t'inqui\xa6ter.\x20
      Je vais bien
      maintenant.
      Retournons \xa0
      notre \xa6poque!
  - name: TX_1d06
    index: 0x06
    text: |-
      Merci,
      \Link!\stop
      Tu m'as sauv\xa6e
      de l'emprise de
      \col(3)Veran\col(0).
      Toutes les
      catastrophes qui
      se sont abattues
      sur le pays sont
      annul\xa6es.
  - name: TX_1d07
    index: 0x07
    text: |-
      \col(3)Ralph\col(0)...
      Je vais aider
      autant que je le
      pourrai!
  - name: TX_1d08
    index: 0x08
    text: |-
      Je ne peux plus
      faire grand-
      chose. Je vais
      rentrer. Reviens
      quand tu veux.
  - name: TX_1d09
    index: 0x09
    text: |-
      \Link,
      Tu as la \col(1)Harpe
      des Ages\col(0).\stop
      Je veux que tu
      la gardes.
      Elle te sera
      tr\xa5s utile. Je
      vais t'apprendre
      le dernier
      \col(1)chant\col(0), qui va
      activer le vrai
      pouvoir de la
      \col(1)Harpe des Ages\col(0).
  - name: TX_1d0a
    index: 0x0a
    text: |-
      \pos(0)\Link...\stop
      Que se
      passe-t-il \xa0
      l'int\xa6rieur?
  - name: TX_1d0b
    index: 0x0b
    text: |-
      \pos(0)\Link!!!
      Tu vas bien!
      C'est
      fantastique!
  - name: TX_1d0c
    index: 0x0c
    text: \pos(0)Allons-y!
  - name: TX_1d0d
    index: 0x0d
    text: |-
      \pos(0)Je n'ai pas
      envie de partir,
      mais on doit
      revenir \xa0 notre
      \xa6poque!
  - name:
    - TX_1d0e
    - TX_1d0f
    index:
    - 0x0e
    - 0x0f
    text: |-
      Tu ne partiras
      pas aussi
      facilement!
  - name: TX_1d10
    index: 0x10
    text: |-
      Je suis \col(3)Nayru\col(4),
      l'Oracle des
      Ages.\stop
      Tu poss\xa5des la
      \col(2)Harpe des Ages\col(4).
      Je ne te connais
      pas, mais si tu
      as cette \col(2)harpe\col(4),
      c'est que tu es
      important.
      Tu es un h\xa6ros
      choisi par le
      flux du temps.\stop
      Ta venue
      signifie que je
      ne suis plus
      dans cette
      \xa6poque.\stop
      J'ai cach\xa6 cette
      \col(2)harpe\col(4) ici,
      sachant que tu
      viendrais.
      Je te confie
      cette \col(2)harpe\col(4)!
      En jouant des
      \col(2)chants\col(4) avec la
      \col(2)Harpe des Ages\col(4),
      tu peux voyager
      \xa0 travers le
      temps!\stop
      Je vais
      t'apprendre le
      \col(2)Chant des
      Echos\col(4)!
  - name: TX_1d11
    index: 0x11
    text: |-
      Si tu joues ce
      \col(2)chant\col(4), tu vas
      ouvrir les
      \col(3)Portails du
      Temps\col(4) qui se
      trouvent sur ce
      pays.\stop
      Entre dans un
      \col(3)Portail du Temps\col(4)
      pour voyager \xa0
      travers le
      temps.\stop
      Dans ton voyage
      tu apprendras
      d'autres \col(2)chants\col(4)
      qui am\xa6lioreront
      ta capacit\xa6 \xa0
      voyager dans le
      temps.\stop
      S'il te pla\xa9t,
      h\xa6ros, prot\xa5ge
      ce pays des
      t\xa6n\xa5bres! Je
      compte sur toi,
      h\xa6ros.
  - name: TX_1d12
    index: 0x12
    text: |-
      \pos(2)\Link! Arr\xa7te
      \col(3)Ralph\col(0)! Il veut
      se sacrifier
      pour son peuple,
      il veut occire
      la \col(3)Reine Ambi\col(0)...
       Je ne peux pas
      laisser \col(3)Ralph\col(0)
      faire ce
      sacrifice!
  - name: TX_1d13
    index: 0x13
    text: |-
      \pos(2)\col(3)Impa\col(0) et moi
      allons trouver
      un moyen pour
      redonner de la
      force aux
      villageois.
      \Link, va sauver
      \col(3)Ralph\col(0).
  - name: TX_1d14
    index: 0x14
    text: |-
      Je vais bien.\stop
      \Link...
      Tu es le seul \xa0
      pouvoir stopper
      \col(3)Veran\col(0). Mais
      \col(3)Ralph\col(0) va
      t'aider.
  - name: TX_1d15
    index: 0x15
    text: |-
      \Link, vite!
      J'ai peur que
      \col(3)Ralph\col(0) fasse
      quelque chose de
      mal!
  - name: TX_1d16
    index: 0x16
    text: |-
      Merci,
      \Link,
      gr\xa1ce \xa0 toi, la
      \col(3)Cit\xa6 de Lynna\col(0)
      est sauv\xa6e!
  - name: TX_1d17
    index: 0x17
    text: |-
      Alors que je
      croyais que tout
      allait bien, les
      t\xa6n\xa5bres
      s'intensifient,
      comme l'avait
      pr\xa6dit \col(3)Veran\col(0).
      \Link!
      Va aider \col(3)Zelda\col(0)!
  - name: TX_1d18
    index: 0x18
    text: |-
      \Link, tu vas
      bien?
  - name: TX_1d19
    index: 0x19
    text: |-
      Tu as vaincu
      \col(3)Veran\col(0).
      Le flux du temps
      va redevenir
      normal.
      Devrions-nous
      retourner au
      village?
  - name: TX_1d1a
    index: 0x1a
    text: |-
      \pos(1)Je vais
      t'aider!
  - name: TX_1d1b
    index: 0x1b
    text: |-
      \pos(2)Temps,
      Nature...
      H\xa6ros des
      \col(1)essences\col(0), je
      suis \col(3)Din\col(0),
      l'Oracle des
      Saisons. Vite,
      \Link! Tu as
      vaincu \col(3)Veran\col(0),
      mais \col(3)Twinrova\col(0)
      est toujours l\xa0!\stop
      Les pouvoirs du
      Roi Mal\xa6fique
      grandissent!
  - name: TX_1d1c
    index: 0x1c
    text: |-
      \pos(2)Les pouvoirs
      des Oracles\stop te
      guideront vers
      la \col(3)Princesse
      Zelda\col(0)! Arr\xa7te
      \col(3)Twinrova\col(0) et le
      Roi Mal\xa6fique,
      \col(3)Ganon\col(0)!\stop
      \Link, tu peux y
      arriver!
      Nous comptons
      sur toi!
  - name: TX_1d1d
    index: 0x1d
    text: |-
      \pos(1)Que la divine
      Triforce soit
      avec toi, h\xa6ros
      des \col(1)Essences du
      Temps et de la
      Nature\col(0)!
  - name: TX_1d1e
    index: 0x1e
    text: |-
      \Link, h\xa6ros! Tu
      as franchi de
      nombreuses
      \xa6preuves pour
      m\xa6riter les
      \col(1)Essences de la
      Nature et du
      Temps\col(0). Toi seul
      peux vaincre
      \col(3)Twinrova\col(0)!
  - name: TX_1d1f
    index: 0x1f
    text: |-
      La puissance
      magique emplit
      mon corps!
  - name: TX_1d20
    index: 0x20
    text: |-
      Je dois
      m'occuper de
      \col(3)Veran\col(0). Je ne
      vais pas laisser
      \col(3)Ralph\col(0) s'en
      occuper tout
      seul.
  - name: TX_1d21
    index: 0x21
    text: |-
      \Link!
      Comment vas-tu?
      Ecoute-moi.
      Apr\xa5s ce qui
      s'est pass\xa6,
      \col(3)Ralph\col(0), est
      devenu un autre
      homme, il prend
      part aux
      combats. Je ne
      vais pas le
      laisser
      l'emporter!
      Je dois remplir
      mes devoirs en
      tant qu'Oracle
      des Ages.\stop
      Mais j'ai un
      souci: \col(3)Impa\col(0). Un
      oiseau m'a amen\xa6
      une lettre
      expliquant
      qu'\col(3)Impa\col(0) se
      dirigeait vers
      \col(3)Holodrum\col(0)...
      Il doit encore
      se passer
      quelque chose de
      terrible! Je
      m'inqui\xa5te
      peut-\xa7tre
      trop...
  - name: TX_1d22
    index: 0x22
    text: |-
      Je suis d\xa6sol\xa6e,
      \Link.
      \col(3)Ralph\col(0) se
      comporte
      toujours comme
      \xa4a, quand il
      s'agit de moi.
      Je sens que
      quelque chose de
      mauvais se
      rapproche...
- group: 0x1e
  data:
  - name: TX_1e00
    index: 0x00
    text: |-
      C'est quoi \xa4a?
      Tenue verte...
      Messire,
      \xa7tes-vous en
      contact avec les
      esprits de la
      for\xa7t?
      Mon nom est
      \col(3)Tingle\col(0), le seul
      et unique!
      Je suis
      moi-m\xa7me une
      f\xa6e!\stop
      Il para\xa9t qu'\xa0
      35 ans, je
      devrais penser \xa0
      grandir un
      peu...
      Mais moi je dis
      que \col(3)Tingle\col(0) est
      une f\xa6e! Si
      c'est vrai!
      Voulez-vous que
      \col(3)Tingle\col(0) la f\xa6e
      soit votre ami?
        \opt()Ouaip \opt()Nian!
  - name: TX_1e01
    index: 0x01
    text: |-
      Messire, tu dois
      \xa7tre l'ami des
      f\xa6es sylvestres!\stop
      D\xa6sires-tu que
      \col(3)Tingle\col(0) la f\xa6e
      soit ton ami?
        \opt()Moui \opt()Nan!
  - name: TX_1e02
    index: 0x02
    text: |-
      A partir de ce
      jour, toi et
      \col(3)Tingle\col(0) \xa7tes
      amis!\stop
      Oui! Oui! En
      gage de notre
      amiti\xa6, \col(3)Tingle\col(0)
      va te donner
      une \col(1)carte\col(0) vers
      l'\xa9le secr\xa5te!
  - name: TX_1e03
    index: 0x03
    text: |-
      ... Je vois!
      J'esp\xa5re que
      tu ne le
      regretteras
      pas!
  - name: TX_1e04
    index: 0x04
    text: |-
      Reviens ici si
      tu veux voir
      \col(3)Tingle\col(0)!
      Si tu as
      beaucoup de
      \col(1)Graines Myst\xa5re\col(0),
      il ne t'arrivera
      que des bonnes
      choses!
  - name: TX_1e05
    index: 0x05
    text: |-
      \call(TX_1e0c)
      Ce sont les
      mots magiques
      que \col(3)Tingle\col(0) a
      cr\xa6\xa6s tout seul.
      Ne me les copie
      pas!
  - name: TX_1e06
    index: 0x06
    text: |-
      Ben alors \xa4a?
      Regarde toutes
      ces \col(1)Graines
      Myst\xa5re\col(0)!
      \col(3)Tingle\col(0) la f\xa6e
      peut faire que
      ta \col(1)poche\col(0)
      porte plus de
      graines, t'es
      d'accord?
        \opt()Voui \opt()Non
  - name: TX_1e07
    index: 0x07
    text: |-
      Tr\xa5s bien! Alors
      \col(3)Tingle\col(0) va
      utiliser sa
      magie.
      Ferme tes
      yeux!
  - name: TX_1e08
    index: 0x08
    text: |-
      Reviens si tu
      veux revoir
      \col(3)Tingle\col(0).
  - name: TX_1e09
    index: 0x09
    text: |-
      Connais-tu
      des \col(1)secrets\col(0) plus
      f\xa6eriques que
      \col(3)Tingle\col(0)?
        \opt()Oui \opt()Non
  - name: TX_1e0a
    index: 0x0a
    text: '... Ze vois!\n'
    null_terminator: false
  - name: TX_1e0b
    index: 0x0b
    text: |-
      Ze crois que
      \col(3)Tingle\col(0) est le
      plus cool.
  - name: TX_1e0c
    index: 0x0c
    text: |-
      \sfx(0xb5)Tingle, Tingle!
      Kooloo-Limpah!
  - name: TX_1e0d
    index: 0x0d
    text: |-
      Ben, c'est pas
      cool du tout
      \xa4a!!!
      \jump(TX_1e0b)
    null_terminator: false
  - name: TX_1e0e
    index: 0x0e
    text: |-
      Comment?!?
      C'est dur, mais
      je crois que
      tu es bien
      plus cool que
      \col(3)Tingle\col(0)...
      En \xa6change, je
      vais utiliser ma
      puissante magie
      pour que tu
      puisses porter
      plus de \col(1)graines\col(0)!
      Ferme les
      yeux!
  - name: TX_1e0f
    index: 0x0f
    text: |-
      Je vais te dire
      le \col(1)secret\col(0) pour
      porter plus de
      \col(1)graines\col(0) en
      \col(3)Holodrum\col(0).\stop
      \secret1\stop
      Appelle-moi,
      si tu as oubli\xa6.
  - name: TX_1e10
    index: 0x10
    text: |-
      \call(TX_1e0c)
      Les mots de
      \col(3)Tingle\col(0)
      les plus cool!
      Ne les vole pas!
- group: 0x20
  data:
  - name: TX_2000
    index: 0x00
    text: |-
      \sfx(0xc3)Ho...
      Je suis \col(3)Ricky\col(0).
      Je peux sauter
      par dessus des
      trous et des
      collines gr\xa1ce
      \xa0 mon super
      saut...
      \jump(TX_2002)
    null_terminator: false
  - name: TX_2001
    index: 0x01
    text: |-
      \sfx(0xc3)Ho...
      \Link?
      Ca faisait
      longtemps!\stop
      C'est pas que
      je sois content
      de te voir...\n
    null_terminator: false
  - name: TX_2002
    index: 0x02
    text: |-
      Mais je ne suis
      pas de bonne
      humeur...
      Tu vois...
      J'ai perdu mes
      pr\xa6cieux
      \col(1)gants\col(0)...
  - name: TX_2003
    index: 0x03
    text: |-
      Je crois que je
      les ai laiss\xa6s
      pr\xa5s de l'arbre
      sur la plage,
      mais je ne les
      trouve pas.
  - name: TX_2004
    index: 0x04
    text: |-
      \sfx(0xc3)H\xa6! Mes \col(1)gants\col(0)!
      Tu les as
      trouv\xa6s! Merci!\stop
      Je vais t'aider
      maintenant!
      Saute dans
      ma poche!
  - name: TX_2005
    index: 0x05
    text: |-
      \sfx(0xc3)\abtn pour un coup
      de poing, ou
      pour stocker de
      la puissance et
      rel\xa1cher une
      tornade. Je peux
      sauter des trous
      ou des collines.
  - name: TX_2006
    index: 0x06
    text: |-
      \sfx(0xc3)J'esp\xa5re que tu
      as trouv\xa6 ce que
      tu cherchais...
      Juste entre
      nous, je ne
      supporte pas
      ce mec,
      \xa0 plus tard!
  - name: TX_2007
    index: 0x07
    text: |-
      Ce n'est pas
      ce que tu
      cherches?
  - name: TX_2008
    index: 0x08
    text: |-
      \sfx(0xc3)Si tu
      t'approches d'un
      trou, je vais
      sauter par
       dessus.
      Essaie, et tu
      verras.
  - name: TX_2009
    index: 0x09
    text: |-
      \sfx(0xc3)Une colline
      comme \xa4a,
      c'est un saut
      pour moi si tu
      vas vers elle.
  - name: TX_200a
    index: 0x0a
    text: |-
      \sfx(0xc3)Yow!
      J'suis d\xa6sol\xa6,
      mais il fait
      trop chaud
      pour moi ici!
- group: 0x21
  data:
  - name: TX_2100
    index: 0x00
    text: \pos(2)\sfx(0xc4)Dii! Dii!
  - name: TX_2101
    index: 0x01
    text: |-
      \sfx(0xc4)J'ai
      failli me faire
      bouffer! Je suis
      \col(3)Dimitri\col(0). Je peux
      nager dans la
      mer.
      \jump(TX_2103)
    null_terminator: false
  - name: TX_2102
    index: 0x02
    text: |-
      \sfx(0xc4)\Link!
      C'est toi! Tu
      m'as sauv\xa6! T'es
      un vrai pote.\n
    null_terminator: false
  - name: TX_2103
    index: 0x03
    text: |-
      Tu vas quelque
      part? Je peux
      t'emmener?
  - name: TX_2104
    index: 0x04
    text: |-
      \sfx(0xc4)Tu y es!
      Va tout seul
      maintenant.
      Salut!
  - name: TX_2105
    index: 0x05
    text: |-
      \sfx(0xc4)Je vais
      me perdre si je
      vais trop
      loin!
  - name: TX_2106
    index: 0x06
    text: |-
      \sfx(0xc4)Je mords avec
      \abtn.\stop
      Et je nage comme
      un poisson, m\xa7me
      dans les
      cascades. Tu
      peux m\xa7me
      me porter
      avec le \col(1)Bracelet
      de Force\col(0).
  - name: TX_2107
    index: 0x07
    text: |-
      \sfx(0xc4)Tu peux
      me porter ou me
      lancer avec le
      \col(1)Bracelet de
      Force\col(0).
      Tu veux
      essayer?
  - name: TX_2108
    index: 0x08
    text: |-
      \sfx(0xc4)Je nage
      m\xa7me dans les
      cascades.
      Veux-tu
      essayer!
  - name: TX_2109
    index: 0x09
    text: |-
      \sfx(0xc4)Fait
      grave trop
      chaud! Je vais
      te laisser,
      \Link!
- group: 0x22
  data:
  - name: TX_2200
    index: 0x00
    text: |-
      \sfx(0xc5)Un
      F-f-fant\xd0me!
      A l'aide!
  - name: TX_2201
    index: 0x01
    text: |-
      \sfx(0xc5)Ne me
      mange pas!
      J'suis pas bon!
  - name: TX_2202
    index: 0x02
    text: |-
      \sfx(0xc5)... Les
      fant\xd0mes sont
      partis!
  - name: TX_2203
    index: 0x03
    text: |-
      \call(TX_2202)Les as-tu
      chass\xa6s? Merci!
      Je suis \col(3)Moosh\col(0).
      Je peux t'aider.
      Grimpe sur mon
      dos.
  - name: TX_2204
    index: 0x04
    text: |-
      \call(TX_2202)
      \sfx(0xc5)!!!
      \Link?
      je peux t'aider,
      si tu veux,
      \Link.
      Grimpe sur
      mon dos.
  - name: TX_2205
    index: 0x05
    text: |-
      \sfx(0xc5)\abtn pour
      l\xa6viter, ou pour
      charger une
      secousse en le
      maintenant.\stop
      Je n'aime pas
      l'eau. Je ne
      m'approche pas
      des eaux
      profondes, alors
      fais gaffe.
  - name: TX_2206
    index: 0x06
    text: |-
      \sfx(0xc5)Maintiens \abtn
      pour charger la
      puissance et
      rel\xa1che pour
      faire un s\xa6isme.
  - name: TX_2207
    index: 0x07
    text: |-
      \sfx(0xc5)Je peux
      l\xa6viter si tu
      appuies sur \abtn.
      Tu peux te
      d\xa6placer au
      dessus de
      pr\xa6cipices
      pendant que je
      l\xa6vite.
  - name: TX_2208
    index: 0x08
    text: |-
      \sfx(0xc5)Tu as
      trouv\xa6 ce que tu
      cherchais?
      Heureux de
      t'avoir aid\xa6. A
      bient\xd0t.
  - name: TX_2209
    index: 0x09
    text: |-
      \sfx(0xc5)Je ne
      veux pas aller
      trop loin...
  - name: TX_220a
    index: 0x0a
    text: |-
      \sfx(0xc5)Argh!
      C'est chaud!\stop
      D\xa6sol\xa6, je te
      laisse.
- group: 0x23
  data:
  - name: TX_2300
    index: 0x00
    text: |-
      Cr\xa6tins
      paresseux!\stop
      On construit un
      pont pour aller
      aux \col(3)Ruines de
      la Cit\xa6
      Sym\xa6trie\col(0),
      et ils sont en
      pause!
      J'attends
      depuis
      des heures,
      mais ils ne
      reviennent
      pas!
  - name: TX_2301
    index: 0x01
    text: |-
      \call(TX_2300)
      Le pont ne
      sera jamais
      fini \xa0 ce
      rythme!
      Faudrait que
      j'aille les
      chercher, mais
      c'est loin
      et dur!\stop
      Un homme ne
      peut naviguer
      tout seul!
  - name: TX_2302
    index: 0x02
    text: |-
      \call(TX_2300)\stop
      Viens, mon
      pote.
      Peux-tu aller
      chercher ces
      paresseux pour
      moi?
        \opt()Oui \opt()Non
  - name: TX_2303
    index: 0x03
    text: |-
      Alors d\xa6gage!
      Sale mioche!
  - name: TX_2304
    index: 0x04
    text: |-
      Merci mon pote!
      Tu vas y aller
      alors!\n
    null_terminator: false
  - name: TX_2305
    index: 0x05
    text: |-
      Si tu attrapes
      ces trois
      guignols, on
      pourra finir ce
      pont.
      Mais le terrain
      est trop
      accident\xa6,
      alors tu ne peux
      y arriver seul.
      OK?
        \opt()OK \opt()Quoi?
  - name: TX_2306
    index: 0x06
    text: |-
      Si tu attrapes
      ces trois
      guignols, on
      pourra finir le
      pont.
  - name: TX_2307
    index: 0x07
    text: |-
      Tu abandonnes?
        \opt()Oui \opt()Non
  - name: TX_2308
    index: 0x08
    text: |-
      Vraiment! Alors
      \xa0 plus tard!
  - name: TX_2309
    index: 0x09
    text: |-
      Alors
      continue!
  - name: TX_230a
    index: 0x0a
    text: |-
      Hah hah! Ils
      sont enfin l\xa0!
      Ils \xa6taient
      juste en retard!
      Bon, au boulot!
      Plus de pause
      tant que le pont
      n'est pas fini!
  - name: TX_230b
    index: 0x0b
    text: |-
      Quoi? Vous avez
      fini?
      C'est bien! Mais
      vous n'aurez pas
      de pause la
      prochaine fois!
  - name: TX_230c
    index: 0x0c
    text: |-
      Mon chef est un
      m\xa6chant!
      Il ne travaille
      pas mais il
      critique
      beaucoup!
  - name: TX_230d
    index: 0x0d
    text: |-
      Il veut
      construire un
      pont pour aller
      aux \col(3)Ruines de
      Cit\xa6 Sym\xa6trie\col(0),
      mais personne ne
      nous attend. Y'a
      pas le feu!
  - name: TX_230e
    index: 0x0e
    text: |-
      Ahh! C'est une
      tr\xa5s belle
      journ\xa6e!
      J'arr\xa7te de
      bosser! Je vais
      \xa6crire un
      po\xa5me...
  - name: TX_230f
    index: 0x0f
    text: |-
      Hein? Le chef?\stop
      Ben, je voulais
      glander un
      peu... Bon, j'y
      vais...
  - name: TX_2310
    index: 0x10
    text: |-
      Pas question! Il
      ne peut pas
      penser que je
      glande!
  - name: TX_2311
    index: 0x11
    text: Oui, chef...
  - name: TX_2312
    index: 0x12
    text: |-
      On a fini,
      chef!
  - name: TX_2313
    index: 0x13
    text: |-
      As-tu entendu
      parler de la
      \col(1)Poudre de F\xa6e\col(0)?\stop
      On raconte
      qu'elle peut
      rendre une Reine
      maudite normale.
      Il para\xa9t que la
      \col(1)Poudre de F\xa6e\col(0)
      \xa6tait gard\xa6e \xa0
      l'arri\xa5re,
      il y a
      longtemps!\stop
      Je ne sais pas
      si c'est vrai ou
      non, mais c'est
      romantique.
  - name: TX_2314
    index: 0x14
    text: |-
      Je cherche un
      po\xa5me romantique
      mais je n'en
      trouve pas...
      Voyons voir...
      \x1aRoses rouges,
      vous \xa7tes...\x1a
- group: 0x24
  data:
  - name: TX_2400
    index: 0x00
    text: |-
      \sfx(0xc7)Bienvenue!\stop
      Je suis la
      premi\xa5re
      g\xa6n\xa6ration de
      Danseurs
      Gracieux! Voici
      notre hall de
      danse!
      Celui qui veut
      \xa7tre Goron doit
      conna\xa9tre ce
      hall de danse.
      Si tu danses
      bien, je te
      donnerai un
      \col(1)Embl\xa5me
      Fr\xa5re\col(0)!
      C'est 20 Rubis.
      Veux-tu danser?
        \opt()Oui \opt()Non
  - name: TX_2401
    index: 0x01
    text: |-
      \sfx(0xc7)Bienvenue!
      Je suis le
      premier Danseur
      Gracieux! Voici
      ma salle de
      danse.
      La Danse des
      Goron est super
      \xa0 la mode.
      C'est g\xa6nial!!!\stop
      Veux-tu danser?
      C'est 20 Rubis.
        \opt()OK \opt()Non
  - name:
    - TX_2402
    - TX_2422
    index:
    - 0x02
    - 0x22
    text: |-
      \sfx(0xc7)Dois-je
      expliquer les
      pas de danse?
        \opt()Non \opt()Oui
  - name:
    - TX_2403
    - TX_2423
    index:
    - 0x03
    - 0x23
    text: |-
      \sfx(0xc7)On accepte les
      all\xa6es et
      venues de tout
      le monde.
      Reviens quand tu
      veux.
  - name:
    - TX_2404
    - TX_2424
    index:
    - 0x04
    - 0x24
    text: |-
      \sfx(0xc7)Fais attention
      \xa0 mes le\xa4ons.
      Tu vas entendre
      le rythme quand
      la danse va
      commencer.
      Tu dois r\xa6p\xa6ter
      ce rythme. Il y
      a deux types.
  - name:
    - TX_2405
    - TX_2425
    index:
    - 0x05
    - 0x25
    text: |-
      \sfx(0xc7)\bbtn pour bouger
      sur ce son!
  - name:
    - TX_2406
    - TX_2426
    index:
    - 0x06
    - 0x26
    text: |-
      \sfx(0xc7)\abtn pour faire
      une pause sur ce
      son!
      Il y a 8 rounds
      en tout.
      Si tu danses
      bien pendant 6
      rounds, tu auras
      un prix!
      Si tu fais trois
      fautes, t'es
      \xa6limin\xa6.\stop
      Essayer c'est
      apprendre!
      T'as pig\xa6?
        \opt()Oui \opt()Non
  - name:
    - TX_2407
    - TX_2427
    index:
    - 0x07
    - 0x27
    text: |-
      \sfx(0xc7)Tant que tu es
      en rythme, c'est
      bien!
      Suis-je un bon
      danseur?
  - name:
    - TX_2408
    - TX_2428
    index:
    - 0x08
    - 0x28
    text: |-
      \sfx(0xc7)Un... Deux...\stop
      Un, deux,
      trois!
  - name:
    - TX_2409
    - TX_2429
    index:
    - 0x09
    - 0x29
    text: |-
      \sfx(0xc7)H\xa6! Il te faut
      plus de Rubis!
  - name:
    - TX_240a
    - TX_242a
    index:
    - 0x0a
    - 0x2a
    text: |-
      Tu es un danseur
      Goron dou\xa6! Tu
      peux danser sur
      n'importe quel
      niveau!
      Lequel
      choisis-tu?
  - name: TX_240b
    index: 0x0b
    text: |-
      \sfx(0xc7)\call(TX_240a)
       \opt()Platine \opt()Or
       \opt()Argent
  - name:
    - TX_240c
    - TX_242c
    index:
    - 0x0c
    - 0x2c
    text: \sfx(0xc7)Platine?
  - name:
    - TX_240d
    - TX_242d
    index:
    - 0x0d
    - 0x2d
    text: \sfx(0xc7)Or?
  - name:
    - TX_240e
    - TX_242e
    index:
    - 0x0e
    - 0x2e
    text: \sfx(0xc7)Argent?
  - name:
    - TX_240f
    - TX_242f
    index:
    - 0x0f
    - 0x2f
    text: \sfx(0xc7)Bronze?
  - name:
    - TX_2410
    - TX_2430
    index:
    - 0x10
    - 0x30
    text: |-
      \sfx(0xc7)Tu es tr\xa5s bon!
      Tu es consid\xa6r\xa6
      comme un fr\xa5re
      par les Gorons!\stop
      Comme promis,
      voici ta
      r\xa6compense!
  - name:
    - TX_2411
    - TX_2431
    index:
    - 0x11
    - 0x31
    text: |-
      \sfx(0xc7)Tu seras vu
      comme un ami par
      tous les Gorons!
      J'esp\xa5re que
      nous pourrons
      encore danser
      ensemble!
  - name:
    - TX_2412
    - TX_2432
    index:
    - 0x12
    - 0x32
    text: |-
      \sfx(0xc7)Parfait!
      C'\xa6tait super!
      Je me suis
      \xa6clat\xa6! C'\xa6tait
      de la pure
      classe! Merci de
      m'avoir fait
      partag\xa6 \xa4a.
      Voici ton prix.
  - name:
    - TX_2413
    - TX_2433
    index:
    - 0x13
    - 0x33
    text: |-
      \sfx(0xc7)Tu as pass\xa6 les
      8 rounds!
      Bien jou\xa6!
      Tu es presque
      aussi bon que
      moi!
      Voici ton prix!
  - name:
    - TX_2414
    - TX_2434
    index:
    - 0x14
    - 0x34
    text: |-
      \sfx(0xc7)Bouge ton corps
      pour exprimer ta
      passion!
  - name:
    - TX_2415
    - TX_2435
    index:
    - 0x15
    - 0x35
    text: |-
      \sfx(0xc7)La danse vient
      du coeur!\stop
      Ton corps doit
      exprimer tes
      passions! Faites
      chauffer la
      piste!!! Tu veux
      encore essayer?
        \opt()Oui \opt()Non
  - name:
    - TX_2416
    - TX_2436
    index:
    - 0x16
    - 0x36
    text: |-
      \sfx(0xc7)Concentre-toi!
      OK, round
      suivant!
  - name:
    - TX_2417
    - TX_2437
    index:
    - 0x17
    - 0x37
    text: |-
      \sfx(0xc7)Tu \xa6choues si tu
      rates encore une
      fois!
  - name:
    - TX_2418
    - TX_2438
    index:
    - 0x18
    - 0x38
    text: |-
      \sfx(0xc7)Dommage! Tu as
      \xa6chou\xa6.
  - name: TX_2419
    index: 0x19
    text: |-
      \sfx(0xc7)Hein? C'est une
      \col(1)lettre
      d'introduction\col(0)
      de mon fr\xa5re?
      Qu'est-ce...\stop
      Donne-moi ta \col(1)Cl\xa6
      Sir\xa5ne\col(0)?
      Comment
      savait-il que je
      l'avais?
      Oh bon ...\stop
      Je ne peux rien
      refuser \xa0 mon
      fr\xa5re.
      Mais je ne peux
      pas te donner \xa4a
      comme \xa4a!
      Tu vas danser
      pour l'avoir!
      Si tu peux
      copier mes pas,
      la \col(1)Cl\xa6 Sir\xa5ne\col(0)
      sera \xa0 toi.
      Alors?
      C'est 20
      Rubis...
        \opt()OK \opt()Non merci
  - name: TX_241a
    index: 0x1a
    text: |-
      \sfx(0xc7)Quel rythme!\stop
      Comme mon fr\xa5re
      t'a recommand\xa6,
      je vais faire
      comme promis!
  - name:
    - TX_241b
    - TX_241c
    - TX_241d
    - TX_241e
    - TX_241f
    index:
    - 0x1b
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    text: |-
      \sfx(0xc7)Reviens si tu
      as besoin d'une
      autre le\xa4on!
  - name: TX_2420
    index: 0x20
    text: |-
      \sfx(0xc7)Bienvenue!\stop
      Je suis le 5\xa5me
      Danseur
      Gracieux! Voici
      ma salle de
      danse.
      Celui qui veut
      \xa7tre appel\xa6
      Goron doit
      conna\xa9tre notre
      danse.
      Si tu danses
      bien, je te
      donnerai
      l'\col(1)Embl\xa5me Fr\xa5re\col(0)!
      C'est 10 Rubis
      pour essayer.
      Veux-tu danser?
        \opt()Oui \opt()Non
  - name: TX_2421
    index: 0x21
    text: |-
      \sfx(0xc7)Bienvenue!
      Je suis le 5\xa5me
      Danseur
      Gracieux! Voici
      ma salle de
      danse.
      La Danse Goron
      est super \xa0 la
      mode chez les
      jeunes dans le
      vent.
      C'est g\xa6nial!!!\stop
      Tu veux danser?
