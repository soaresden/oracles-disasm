  data:
  - name: TX_5800
    index: 0x00
    text: |-
      Ca fait
      longtemps que
      je n'ai pas eu
      de visite.\n
    null_terminator: false
  - name: TX_5801
    index: 0x01
    text: |-
      Je suis \col(3)Patch\col(0),
      le gourou de la
      r\xa6paration.
      As-tu besoin de
      moi?
        \opt()Oui \opt()Non
  - name: TX_5802
    index: 0x02
    text: |-
      Tu dois avoir du
      temps \xa0 perdre
      si tu viens ici
      pour rien.
  - name: TX_5803
    index: 0x03
    text: |-
      Tu ne poss\xa5des
      rien \xa0 r\xa6parer.
      Donc...?
  - name: TX_5804
    index: 0x04
    text: |-
      H\xa6, h\xa6! Je vois.
      Tu veux que je
      r\xa6pare ce truc
      \col(1)\call(0xff)\col(0).\stop
      Ma c\xa6r\xa6monie de
      r\xa6paration va
      le faire.
      On essaie?
        \opt()Oui \opt()Non
  - name: TX_5805
    index: 0x05
    text: |-
      Alors ce truc:
      \col(1)\call(0xff)\col(0)
      Ne sera
      jamais
      r\xa6par\xa6...
  - name: TX_5806
    index: 0x06
    text: |-
      Tu veux essayer?
      Tr\xa5s bien.
      Suis-moi.
      H\xa6, h\xa6!
  - name: TX_5807
    index: 0x07
    text: |-
      Bienvenue aux
      Chariots Dingos
      de Patch!
      Veux-tu
      participer \xa0 ma
      c\xa6r\xa6monie?
        \opt()Oui \opt()Non
  - name: TX_5808
    index: 0x08
    text: |-
      Tr\xa5s bien! Tu
      connais les
      r\xa5gles?
        \opt()Oui \opt()Non
  - name: TX_5809
    index: 0x09
    text: |-
      Alors je vais
      t'expliquer!\stop
      Je vais mettre
      ton
      \col(1)\call(0xff)\col(0)
      sur cette
      tuile verte et
      r\xa6citer la
      formule de la
      r\xa6paration. Tu
      dois assomer
      tous les
      monstres qui
      sont dans les
      trous. Facile
      tu dis?
      On va voir!!!\stop
      La r\xa6paration
      est un travail
      d\xa6licat.
      Ton truc:
      \col(1)\call(0xff)\col(0)
      se met ici...
      Le chariot
      commence bouger
      quand la
      c\xa6r\xa6monie est
      lanc\xa6e.
      Tant que tu te
      tiens sur
      l'interrupteur,
      le chariot ne
      touchera pas ton
      \col(1)\call(0xff)\col(0),
      mais s'il
      est touch\xa6\stop
      BOOM!!!\stop
      Alors? Veux-tu
      participer \xa0
      cette c\xa6r\xa6monie?
        \opt()Oui \opt()Non
  - name: TX_580a
    index: 0x0a
    text: |-
      Que la c\xa6r\xa6monie
      commence!
  - name: TX_580b
    index: 0x0b
    text: |-
      Dex ifeb!!!
      Dex iflla!!!
  - name: TX_580c
    index: 0x0c
    text: |-
      La c\xa6r\xa6monie est
      un \xa6chec, mais
      ton
      \col(1)\call(0xff)\col(0)
      est intact.
      Tu veux
      recommencer.
  - name: TX_580d
    index: 0x0d
    text: |-
