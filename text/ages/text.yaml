    - 0x07
    - 0x08
    - 0x09
    text: |-
      \pos(0)\Link!\stop
      As-tu entendu?
      Ils disent
      d'horribles
      choses sur \col(3)Nayru\col(0)
      dans le
      village...
      Mais pourquoi?
      Cela doit \xa7tre
      l'oeuvre de
      \col(3)Veran\col(0)!
      La v\xa6rit\xa6
      surgira quand
      j'aurais sauv\xa6
      \col(3)Nayru\col(0)!
      Attends ici! J'y
      vais!
      \jump(TX_2a06)
    null_terminator: false
  - name: TX_2a0a
    index: 0x0a
    text: |-
      \pos(2)Tiens donc,
      mais c'est
      \Link!
  - name: TX_2a0b
    index: 0x0b
    text: |-
      Tu tra\xa9nes,
      comme
      d'habitude. Que
      fais-tu? Hein?
      Tu as besoin
      d'une \col(1)Carte des
      \xa9les\col(0)? Il para\xa9t
      qu'il y a un
      d\xa6bile qui vend
      des \col(1)cartes des
      mers\col(0) menant \xa0
      l'\xa9le secr\xa5te.
      Fais ce que tu
      veux! Je suis
      trop occup\xa6 \xa0
      sauver \col(3)Nayru\col(0)
      pour t'aider!
      A bient\xd0t!
  - name: TX_2a0c
    index: 0x0c
    text: \col(3)Nayru\col(0)!!!
  - name: TX_2a0d
    index: 0x0d
    text: |-
      C'est toi? C'est
      vraiment toi
      \col(3)Nayru\col(0)?
  - name: TX_2a0e
    index: 0x0e
    text: |-
      D\xa6sol\xa6, \Link.
      Je n'\xa6tais pas
      l\xa0 pour le
      sauvetage...\stop
      Mais, sache que
      j'arr\xa7terai
      \col(3)Veran\col(0)!!! Je
      ne laisserai pas
      les gens du
      pass\xa6 comme \xa4a!
      Il faut
      s'occuper de
      \col(3)Veran\col(0). Si on ne
      le fait pas,
      elle va capturer
      \col(3)Nayru\col(0) encore!
  - name: TX_2a0f
    index: 0x0f
    text: |-
      Qu'est-ce
      que...?\stop
      Je ne peux pas
      prendre \xa4a!
      \Link! Je
      retourne \xa0
      l'\xa6poque d'\col(3)Ambi\col(0)!
      J'esp\xa5re que
      nous pourrons
      revenir ensemble
      ici!
  - name: TX_2a10
    index: 0x10
    text: |-
      Qui c'\xa6tait?
      Ces sorci\xa5res...
      Qu'est-ce
      qu'elles
      voulaient?\stop
      Je ne peux pas
      laisser faire
      \xa4a!
      \Link! Je
      retourne \xa0
      l'\xa6poque d'\col(3)Ambi\col(0)!
      Que le destin
      nous ram\xa5ne
      ensemble!
  - name: TX_2a11
    index: 0x11
    text: |-
      \pos(0)Tu as
      vraiment vaincu
      \col(3)Veran\col(0)? Bon
      travail \Link!
      T'es g\xa6nial!
      ...Hein? La
      \col(3)Reine Ambi\col(0)? Elle
      t'a vu, et elle
      s'est enfuie.
  - name: TX_2a12
    index: 0x12
    text: |-
      \pos(2)Quoi? Tu vas
      t'occuper de
      \col(3)Ralph\col(0)?
  - name: TX_2a13
    index: 0x13
    text: |-
      Ne me mens pas!
      Je pensais que
      Ies tours de
      \col(3)Veran\col(0) avaient eu
      raison de toi!
  - name: TX_2a14
    index: 0x14
    text: |-
      \Link! Je te
      respecte. Je
      pensais que tout
      \xa6tait fini quand
      tu as \xa6t\xa6
      enferm\xa6 dans
      la tour. Je ne
      pensais pas que
      tu m'aurais
      surpris!
  - name: TX_2a15
    index: 0x15
    text: |-
      Et toi, \col(3)Reine
      Ambi\col(0)! \col(3)Veran\col(0) est
      partie, tu es
      ma grand- grand-
      grand -grand-
      m\xa5re! Une Reine!
      Je suis fier!
  - name: TX_2a16
    index: 0x16
    text: |-
      \Link! Ne me
      fais pas peur!
      Le garde du
      palais est
      descendu pour
      sauver \col(3)Nayru\col(0)?
      Si quelqu'un
      peut la sauver,
      c'est moi! Tu ne
      m'auras pas!
  - name: TX_2a17
    index: 0x17
    text: |-
      Il ne faut pas
      entrer par la
      porte
      principale.\stop
      Je sais! Il doit
      y avoir une
      entr\xa6e secr\xa5te
      dans le jardin
      du palais!
  - name: TX_2a18
    index: 0x18
    text: |-
      Quoi? \x1aPourquoi
      je suis au
      courant d'un
      passage secret?\x1a\stop
      Oublie \xa4a!!!
      J'arrive,
      \col(3)Nayru\col(0)!!!
  - name: TX_2a19
    index: 0x19
    text: |-
      Bon, \Link, tu y
      es arriv\xa6! Je
      suis venu
      d\xa6truire \col(3)Veran\col(0)!
      \col(3)Veran\col(0) a pris le
      contr\xd0le de la
      \col(3)Reine Ambi\col(0)?
      Alors il faut
      tuer \col(3)Veran\col(0)...
      Je dois
      battre... La
      \col(3)Reine Ambi\col(0)...
      Umm... Bon! La
      \col(3)Reine Ambi\col(0)!
      \col(3)Veran\col(0)! Je vais
      tous vous
      d\xa6truire!
      Et alors, les
      hommes de cet
      \xa1ge et de notre
      \xa1ge seront en
      paix... Mais que
      va-t-il
      m'arriver?\stop
      Umm...
      \Link...
      Ne m'oublie pas.
      Je veux dire,
      nous sommes des
      amis...
      OK! J'y vais!
      \col(3)Ralph\col(0) peut y
      arriver! Adieu,
      \Link!
  - name: TX_2a1a
    index: 0x1a
    text: |-
      H\xa6, \Link!
      Que fais-tu ici?
      Je suis venu
      trouver un vieil
      ermite qui
      conna\xa9t les
      \col(1)chants\col(0) dans
      cette montagne.
      Je ne sais pas
      o\xae il est, mais
      il doit pouvoir
      me donner un
      indice pour
      sauver \col(3)Nayru\col(0).\stop
      Je vais le
      trouver!
      Adieu!
  - name: TX_2a1b
    index: 0x1b
    text: |-
      Sale mioche!\stop
      Si je te tue, je
      disparais...
      Mais bon, ce qui
      doit \xa7tre fait,
      doit \xa7tre fait.
      Je n'aime pas ne
      rien faire!
      Cela ne veut
      rien dire! Je
      vais te tuer!
      Pour sauver les
      gens de cet \xa1ge,
      et pour prot\xa6ger
      \col(3)Nayru\col(0)!!!
  - name: TX_2a1c
    index: 0x1c
    text: |-
      Cette voix...
      \Link...
      Je n'ai pas
      pu... H\xa6 h\xa6.
      Je suis le
      cr\xa6tin de
      l'histoire, non?\n
    null_terminator: false
  - name: TX_2a1d
    index: 0x1d
    text: \col(3)Na-Nayru\col(0)...
  - name: TX_2a1e
    index: 0x1e
    text: |-
      L'\col(3)Arbre Bojo\col(0)?
      Et voil\xa0 pour
      les plans de
      \col(3)Veran\col(0)!\stop
      \Link! Tu as
      r\xa6ussi! \col(3)Veran\col(0)
      vient de sauter
      dans ce \col(3)Portail
      du Temps\col(0)! Si on
      va dans le
      pass\xa6, je vais
      pouvoir revenir
      dans le temps
      pour sauver
      \col(3)Nayru\col(0) et l'\col(3)Arbre
      Bojo\col(0)! J'arrive,
      \col(3)Nayru\col(0)!
  - name: TX_2a1f
    index: 0x1f
    text: |-
      \pos(0)\Link! Tu as
      r\xa6ussi! M\xa7me si
      je pensais que
      c'\xa6tait fini,
      \col(3)Nayru\col(0) \xa6tait
      quand m\xa7me l\xa0.
      Elle ne peut
      rester ainsi!
      Je vais bien
      m'entra\xa9ner
      pour pouvoir
      prot\xa6ger \col(3)Nayru\col(0)
      tout seul!
  - name: TX_2a20
    index: 0x20
    text: |-
      H\xa6, \Link!\stop
      Tu cherches un
      truc, ou quoi?
      La \col(3)Corde de
      Cheval\col(0)?
      Je connais ce
      nom. Ouais! J'ai
      vu une tombe qui
      portait ce nom a
      notre \xa6poque.\stop
      Je n'ai pas le
      temps de parler!
      Je suis occup\xa6!
      A bient\xd0t!
  - name: TX_2a21
    index: 0x21
    text: |-
      H\xa6, \Link!
      Comment vas-tu?
      Je m'entra\xa9ne
      tous les jours!
      Je dois \xa7tre
      fort pour
      devenir le garde
      de \col(3)Nayru\col(0)!
      Tu veux qu'on
      s'entra\xa9ne la
      prochaine fois?
      Comme tu es l\xa0,
      nous devrions
      aller \xa6couter
      \col(3)Nayru\col(0) chanter!
  - name: TX_2a22
    index: 0x22
    text: |-
      Ne t'inqui\xa5te
      pas, \col(3)Nayru\col(0)! Je
      suis l\xa0.
      Je te d\xa6fendrai
      des monstres qui
      viennent!
      D\xa6sol\xa6, \Link,
      mais je doute
      que nous ayons
      besoin de toi.
  - name: TX_2a23
    index: 0x23
    text: |-
      Laisse \xa4a \xa0 moi
      et \xa0 ma
      grand-m\xa5re!
      Tu va t'occuper
      de \col(3)Twinrova\col(0)!
