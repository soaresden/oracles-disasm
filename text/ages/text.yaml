      pr\xa6caution!
  - name: TX_003d
    index: 0x3d
    text: |-
      Vous obtenez la
      \col(1)Cl\xa6 Couronne\col(0)!
  - name: TX_003e
    index: 0x3e
    text: |-
      Vous obtenez le
      \col(1)Filet de Roc\col(0)!
  - name: TX_003f
    index: 0x3f
    text: |-
      Vous obtenez le
      \col(1)Vase Goron\col(0)!
  - name: TX_0040
    index: 0x40
    text: |-
      Vous obtenez la
      \col(1)Goronade\col(0)! Une
      gorg\xa6e et vous
      serez \xa6veill\xa6.
  - name: TX_0041
    index: 0x41
    text: |-
      Vous obtenez le
      \col(1)Jus de Lave\col(0)!
  - name: TX_0042
    index: 0x42
    text: |-
      Vous obtenez la
      \col(1)Cl\xa6 Sir\xa5ne\col(0)!
  - name: TX_0043
    index: 0x43
    text: |-
      Vous obtenez la
      \col(1)Vieille Cl\xa6
