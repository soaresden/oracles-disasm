  - name: TX_2a00
    index: 0x00
    text: |-
      Tu es le
      messager
      d'\col(3)Hyrule\col(0)?
      \col(3)Impa\col(0) et \Link?
      Un oiseau m'a
      pr\xa6venu de votre
      arriv\xa6e.\stop
      Mon nom est
      \col(3)Ralph\col(0)! Je suis
      un vieil ami de
      \col(3)Nayru\col(0). Nous
      comptons sur
      toi.
  - name: TX_2a01
    index: 0x01
    text: |-
      \pos(2)Que fais-tu \xa0
      \col(3)Nayru\col(0)?
      Je te coupe en
      deux si tu ne la
      laisses pas
      partir!
  - name: TX_2a02
    index: 0x02
