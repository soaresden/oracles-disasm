      \pos(2)... Une
      \col(1)essence\col(0) dans un
      poisson?
  - name:
    - TX_0516
    - TX_0517
    - TX_0536
    - TX_0537
    index:
    - 0x16
    - 0x17
    - 0x36
    - 0x37
    text: |-
      \pos(2)La derni\xa5re
      \col(1)essence\col(0) doit
      \xa7tre cach\xa6e en
      \col(3)Labrynna\col(0)...
      Bonne chance!
  - name:
    - TX_0518
    - TX_0519
    - TX_0538
    - TX_0539
    index:
    - 0x18
    - 0x19
    - 0x38
    - 0x39
    text: |-
      \pos(2)Bonne chance,
      \Link!
      \col(3)Veran\col(0) est au
      sommet de la
      \col(3)Tour Noire\col(0)!
  - name:
    - TX_051a
    - TX_051b
    - TX_053a
    - TX_053b
    index:
    - 0x1a
    - 0x1b
    - 0x3a
    - 0x3b
    text: |-
      \pos(2)L'Oeil de la
      D\xa6ception ne
      t'affectera pas,
      \Link.
      J'en suis s\xafre!\heart
  - name:
    - TX_051c
    - TX_051d
    - TX_051e
    - TX_051f
    - TX_053c
    - TX_053d
    - TX_053e
    - TX_053f
    index:
    - 0x1c
    - 0x1d
    - 0x1e
    - 0x1f
    - 0x3c
    - 0x3d
    - 0x3e
    - 0x3f
    text: |-
      \pos(2)Ahh... La
      paix, c'est
      cool. Je peux
      penser autant
      que je veux \xa0
      \Link\heart.
  - name: TX_0540
    index: 0x40
    text: \pos(2)Ahh...
  - name: TX_0541
    index: 0x41
    text: |-
      \pos(2)J'me sens
      bizarre. Je suis
      en train de
      dispara\xa9tre! Il
      doit se passer
      quelque chose
      dans le pass\xa6!
      A l'aide!
  - name: TX_0542
    index: 0x42
    text: |-
      \pos(2)Uhhn... C'est
      bizarre... Tout
      est sombre.
      J'oublie...
      J'oublie
      tout...
  - name: TX_0543
    index: 0x43
    text: |-
      \pos(2)...Oh!?!
      Tu... Tu es...
      \Link!
      \Link!\heart
  - name: TX_0544
    index: 0x44
    text: |-
      \pos(2)Pourquoi
      es-tu l\xa0? Je
      t'attends depuis
      si longtemps.\heart
      Tu ne te
      souviens pas, il
      y a si
      longtemps?
      \Link, tu avais
      promis\heart!
  - name: TX_0545
    index: 0x45
    text: |-
      \pos(2)\x1aQuand tu
      seras grande,
      je me marierai
      avec toi!\x1a C'est
      ce que tu as
      dit, \Link.\heart
      J'ai attendu
      pendant 400 ans.\stop
      Mais...
  - name: TX_0546
    index: 0x46
    text: |-
      \pos(2)Je savais que
      tu n'oublierais
      pas.\heart
      Nos coeurs sont
      li\xa6s \xa0 travers
      le temps...
  - name: TX_0547
    index: 0x47
    text: |-
      \pos(2)Quoi? Tu n'es
      pas l\xa0 pour \xa4a?\stop
      Pourquoi ne
      m'\xa6coutes-tu
      pas?\stop
      Tu veux parler
      de \col(3)Veran\col(0)?
  - name: TX_0548
    index: 0x48
    text: |-
      \pos(2)Je pense que
      \col(3)Veran\col(0) utilise la
      \col(3)Reine Ambi\col(0) pour
      construire une
      tour. \x1aSi un
      coeur impure
      gagne les
      pouvoirs des
      ombres...
  - name: TX_0549
    index: 0x49
    text: |-
      \pos(2)Le monde sera
      envahit par les
      T\xa6n\xa5bres.\x1a
      C'est ainsi...
  - name: TX_054a
    index: 0x4a
    text: |-
      \pos(2)Il faut
      conna\xa9tre le
      pass\xa6 pour
      comprendre le
      pr\xa6sent. \col(3)Veran\col(0)
      peut faire ce
      qu'elle veut, si
      elle obtient les
      pouvoirs
      sombres. Tout
      sera perdu!
      \Link! Tu dois
      arr\xa7ter \col(3)Veran\col(0) et
      sauver \col(3)Nayru\col(0)!\stop
      Dois-je le
      r\xa6p\xa6ter?
        \opt()Oui \opt()Non
  - name: TX_054b
    index: 0x4b
    text: |-
      \pos(2)Je ne me
      souviens pas,
      mais je crois
      que tu as besoin
      des huit
      \col(1)Essences du
      Temps\col(0) cach\xa6es en
      \col(3)Labrynna\col(0) pour
      battre \col(3)Veran\col(0)!\stop
      Les \col(1)essences\col(0)
      poss\xa5dent le
      pouvoir de la
      v\xa6rit\xa6. Elles
      d\xa6tiennent ma
      m\xa6moire!
      Tu ne battras
      pas \col(3)Veran\col(0) si tu
      ne peux voir la
      v\xa6rit\xa6!
  - name: TX_054c
    index: 0x4c
    text: |-
      \pos(2)Avec le cours
      du temps
      d\xa6rang\xa6, ma
      m\xa6moire
      s'estompe...
  - name: TX_054d
    index: 0x4d
    text: |-
      \pos(2)Qu'allons-nous
      faire? Je suis
      perdue...
  - name: TX_054e
    index: 0x4e
    text: |-
      \pos(2)Mais si tu
      trouves les
      \col(1)essences\col(0), je me
      souviendrai!
      Et tu pourras
      arr\xa7ter \col(3)Veran\col(0)!!!
      Tu dois le
      faire,
      \Link!
  - name: TX_054f
    index: 0x4f
    text: |-
      \pos(2)D'abord tu
      dois aller au
      \col(3)Cimeti\xa5re Yoll\col(0) \xa0
      l'est.
      J'entends la
      premi\xa5re \col(1)essence\col(0)
      ici.
  - name: TX_0550
    index: 0x50
    text: |-
      \pos(2)Je ne peux
      rien faire, mais
      prends-\xa4a.
  - name: TX_0551
    index: 0x51
    text: |-
      \pos(2)Bienvenue,
      \Link!
      Tu as enfin
      vaincu \col(3)Veran\col(0)!
      \Link, je savais
      que tu y
      arriverais et
      que tu
      reviendrais...\heart
  - name: TX_0552
    index: 0x52
    text: |-
      \pos(2)Bienvenue,
      \Link!
      La paix est
      revenue sur le
      monde! Je savais
      que tu y
      arriverais,
      \Link\heart. Et je
      savais que tu
      reviendrais...\heart
  - name: TX_0553
    index: 0x53
    text: |-
      \pos(2)Mais \Link,
      \col(3)Veran\col(0) est
      toujours dans le
      pass\xa6?\stop
      Si oui, elle
      peut encore
      cr\xa6er une \xa6poque
      de t\xa6n\xa5bres qui
      va s'\xa6tendre sur
      le pr\xa6sent?
  - name: TX_0554
    index: 0x54
    text: |-
      \pos(2)Que se
      passe-t-il?
      Qu'est-ce que \xa4a
      veut dire s'ils
      sont derri\xa5re
      les actes de
      \col(3)Veran\col(0)?
  - name: TX_0555
    index: 0x55
    text: |-
      \pos(2)\Link, la
      prochaine
      \col(1)essence\col(0)...
  - name: TX_0556
    index: 0x56
    text: |-
      \pos(2)C'est
      \xa6trange!
      Une \col(1)essence\col(0)
      r\xa6sonne dans le
      ventre d'un
      poisson.
  - name: TX_0557
    index: 0x57
    text: |-
      \pos(2)\col(3)Twinrova\col(0) est
      derri\xa5re
      \col(3)Veran\col(0)?!?
      Qui est ce Roi
      Mal\xa6fique? Que
      se passe-t-il?
      \Link, j'ai un
      tr\xa5s mauvais
      pressentiment!
      Tu dois
      l'arr\xa7ter!
  - name: TX_0558
    index: 0x58
    text: |-
      \pos(2)Mais d'abord
      la prochaine
      \col(1)essence\col(0), \Link!
  - name:
    - TX_0559
    - TX_055a
    - TX_055d
    - TX_055e
    index:
    - 0x59
    - 0x5a
    - 0x5d
    - 0x5e
    text: |-
      \pos(2)\Link!\stop
      Tu as ramass\xa6
      les huit
      \col(1)Essences du
      Temps\col(0)!\stop
      Gr\xa1ce \xa0 toi, le
      flux du temps
      est redevenu
      normal en moi!
      Je me souviens
      de tout!
      \pos(2)Je suis la
      gardienne de
      \col(3)Nayru\col(0), l'Oracle
      des Ages, et ma
      \col(1)Graine Bojo\col(0) ne
      peut \xa7tre
      utilis\xa6e que par
      un h\xa6ros
      poss\xa6dant le
      pouvoir des huit
      \col(1)Essences du
      Temps\col(0).
      Le h\xa6ros qui
      connait les
      \col(1)Essences du
      Temps\col(0) peut voir
      la v\xa6rit\xa6 dans
      le temps et
      l'espace.
      Si tu peux faire
      \xa4a, \Link, tu
      pourras arr\xa7ter
      \col(3)Veran\col(0)!
      Prends-ceci!
  - name: TX_055b
    index: 0x5b
    text: |-
      \pos(2)\Link,
      c'est \col(3)Twinrova\col(0)!
      \col(3)Twinrova\col(0)...\stop
      Qui aurait pu
      penser que la
      terrible
      Sorci\xa5re Gerudo
      serait derri\xa5re
      tout cela...
      Quels sont ses
      plans...
  - name: TX_055c
    index: 0x5c
    text: |-
      \pos(2)Je suis
      d\xa6sesp\xa6r\xa6e,
      comme le voulait
      \col(3)Twinrova\col(0)!
      Le monde est
      perdu!\stop
      \jump(TX_0560)
    null_terminator: false
  - name: TX_055f
    index: 0x5f
    text: |-
      \pos(2)\Link,
      je ne devrais
      pas dire \xa4a,
      mais...\stop
      Un monde de
      d\xa6sespoir est un
      monde perdu!
  - name: TX_0560
    index: 0x60
    text: |-
      \pos(2)Tu dois
      arr\xa7ter la \col(3)Reine
      Ambi\col(0) dans la
      \col(3)Tour Noire\col(0) et
      vaincre \col(3)Veran\col(0)!
  - name: TX_0561
    index: 0x61
    text: |-
      \pos(2)Les \col(1)Graines
      Braise\col(0) dans
      cette \col(1)Poche \xa0
      Graines\col(0) peuvent
      br\xafler les
      petits
      buissons.
  - name:
    - TX_0562
    - TX_0563
    index:
    - 0x62
    - 0x63
    text: |-
      \Link,
      tu as r\xa6ussi! Je
      savais que tu
      r\xa6ussirais!
      Laisse-moi \xa4a!
  - name:
    - TX_0564
    - TX_0565
    - TX_0566
    - TX_0567
    - TX_0568
    - TX_0569
    - TX_056a
    - TX_056b
    - TX_056c
    - TX_056d
    - TX_056e
    - TX_056f
    index:
    - 0x64
    - 0x65
    - 0x66
    - 0x67
    - 0x68
    - 0x69
    - 0x6a
    - 0x6b
    - 0x6c
    - 0x6d
    - 0x6e
    - 0x6f
    text: |-
      \pos(2)Ravie de te
      rencontrer,
      jeune h\xa6ros. Je
      suis l'\col(3)Arbre
      Bojo\col(0), gardienne
      de \col(3)Labrynna\col(0).\stop
      \col(3)Veran\col(0), la
      Sorci\xa5re des
      Ombres, a
      captur\xa6 \col(3)Nayru\col(0),
      l'Oracle des
      Ages. Elle a
      d\xa6truit le flux
      du temps.
      Elle veut
      remplir le monde
      de d\xa6sespoir.
      Nous ne pouvons
      pas abandonner.
      Tu dois arr\xa7ter
      \col(3)Veran\col(0), et vite!
      Mais il te faut
      certaines
      choses...
  - name:
    - TX_0570
    - TX_0571
    - TX_0590
    - TX_0591
    index:
    - 0x70
    - 0x71
    - 0x90
    - 0x91
    text: |-
      \pos(2)J'entends le
      son des \col(1)essences\col(0)
      dans la \col(3)For\xa7t \xa0
      l'Ouest\col(0)!
      Vas-y!
  - name:
    - TX_0572
    - TX_0573
    - TX_0592
    - TX_0593
    index:
    - 0x72
    - 0x73
    - 0x92
    - 0x93
    text: |-
      \pos(2)J'entends le
      son d'une
      \col(1)essence\col(0) dans la
      \col(3)For\xa7t \xa0 l'Ouest\col(0)!
