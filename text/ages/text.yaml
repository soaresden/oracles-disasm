    - TX_010e
    - TX_010f
    index:
    - 0x0c
    - 0x0d
    - 0x0e
    - 0x0f
    text: D\xa6p\xa7che-toi!
  - name: TX_0110
    index: 0x10
    text: |-
      Oh! \Link!
      Tu m'as sauv\xa6e!
      Et dire que
      j'\xa6tais
      poss\xa6d\xa6e!
  - name: TX_0111
    index: 0x11
    text: |-
      ............\stop
      Cette dame
      \col(3)Veran\col(0) est
      effrayante.
      J'\xa6tais oblig\xa6e
      de lui ob\xa6ir
      malgr\xa6 moi.
  - name: TX_0112
    index: 0x12
    text: |-
      Les t\xa6n\xa5bres
      entourent
      l'Oracle des
      Ages. Alors je
      suis venue
      l'amener en
      \col(3)Hyrule\col(0). Je ne
      pensais pas que
      \xa4a se passerait
      comme \xa4a...
      \jump(TX_0111)
    null_terminator: false
  - name: TX_0113
    index: 0x13
    text: |-
      J'ai \xa6chou\xa6
      \col(3)Zelda\col(0)...
      \col(3)Zelda\col(0)...\stop
      Elle a senti
      une sombre
      pr\xa6sence pr\xa5s
      de \col(3)Nayru\col(0)
      et m'a demand\xa6
      de l'amener en
      \col(3)Hyrule\col(0).
      Nous ne
      t'oublierons
      pas, h\xa6ros
      d'\col(3)Holodrum\col(0).\stop
      Regarde ce qui
      s'est pass\xa6...
      \jump(TX_0111)
    null_terminator: false
  - name: TX_0114
    index: 0x14
    text: |-
      \col(3)Veran\col(0) a dit
      qu'elle va
      revenir dans le
      temps. Elle
      veut utiliser le
      pouvoir de
      \col(3)Nayru\col(0)
      pour intervenir
      dans le pass\xa6.
      On ressent d\xa6j\xa0
      les effets \xa0
      \col(3)Labrynna\col(0).\stop
      Si c'est vrai,
      il faut la
      stopper...
      Humm!
      Mes jambes sont
      si lourdes apr\xa5s
      ce que \col(3)Veran\col(0)
      m'a fait. Je ne
      peux pas bouger.\stop
      \Link...
      Si la \sym(0x57) sur ta
      main gauche est
      vraie, alors tu
      dois \xa7tre le
      h\xa6ros qui
      sauvera le
      monde.
      Aide-nous!
  - name: TX_0115
    index: 0x15
    text: |-
      \call(TX_0114)\stop
      Ah, oui!
      \col(3)Zelda\col(0)
      m'a donn\xa6 cette
      \xa6p\xa6e. Tu peux
      la prendre.
  - name: TX_0116
    index: 0x16
    text: |-
      \call(TX_0118)\stop
      Ah, oui!
      \col(3)Zelda\col(0)
      m'a donn\xa6 cet
      \col(1)\xa6cu\col(0). Tu peux
      le prendre.
  - name: TX_0117
    index: 0x17
    text: |-
      \Link,
      tu dois aller
      voir l'\col(3)Arbre
      Bojo\col(0) dans le
      \col(3)Village Lynna\col(0).\stop
      L'\col(3)Arbre Bojo\col(0)
      est le gardien
      de \col(3)Labrynna\col(0). Il
      pourra t'aider.
      La \col(3)Maison de
      Nayru\col(0) est dans
      les bois, \xa0
      l'est d'ici. Je
      t'y attendrai.
  - name:
    - TX_0118
    - TX_0119
