- group: 0x26
  data:
  - name: TX_2600
    index: 0x00
    text: |-
      Les gens ont
      disparu ou se
      transforment en
      pierre. Que se
      passe-t-il?
  - name: TX_2601
    index: 0x01
    text: |-
      C'est moi, ou la
      tour est plus
      grande?
  - name: TX_2602
    index: 0x02
    text: |-
      Hahh... Je me
      fatigue si vite.
      Deviendrais-je
      vieux?
  - name: TX_2603
    index: 0x03
    text: |-
      La tour est bien
      plus grande et
      la ville est en
      d\xa6sordre. Je ne
      me sens pas
      bien. Il doit se
      passer de bien
      \xa6tranges
      choses.
  - name: TX_2604
    index: 0x04
    text: |-
      Mes jambes sont
      lourdes comme de
      la pierre...
      Je suis fatigu\xa6
      de tous ces
      malheurs.
  - name: TX_2605
    index: 0x05
    text: |-
      Mes os sont
      fragiles!
      Je ne laisserai
      pas passer un
      freluquet!
  - name: TX_2606
    index: 0x06
    text: |-
      Je crois qu'il
      doit y avoir
      un tr\xa6sor dans
      cette grotte,
      mais ce rocher
      m'en barre la
      route. Si je
      pouvais le faire
      sauter...
- group: 0x27
  data:
  - name: TX_2700
    index: 0x00
    text: |-
      Je suis \col(3)Rafton\col(0).
      Mon r\xa7ve est de
      construire un
      radeau pour
      aller sur la
      mer!
  - name: TX_2701
    index: 0x01
    text: |-
      Si j'avais une
      corde qui
      r\xa6siste \xa0 l'eau,
      je pourrais le
      faire. Il y a un
      type nomm\xa6
      \col(3)Cheval\col(0) \xa0 l'est
      de la ville qui
      fait ce genre de
      cordes.
  - name: TX_2702
    index: 0x02
    text: H\xa6! C'est \xa4a!
  - name: TX_2703
    index: 0x03
    text: |-
      Avec la \col(1)Corde de
      Cheval\col(0), je vais
      finir mon
      radeau!
      Donne moi cette
      \col(1)Corde\col(0), s'teup'!
         \opt()OK \opt()Nan
  - name: TX_2704
    index: 0x04
    text: |-
      Je crois qu'on
      n'y peux
      rien.
  - name: TX_2705
    index: 0x05
    text: |-
      Merci! Tu seras
      le premier \xa0
      monter sur mon
      radeau quand il
      sera fini. Mais
      il te faudra une
      \col(1)carte\col(0) si tu veux
      aller en mer.
      Si tu n'as pas
      de \col(1)carte\col(0), ce
      sera un
      d\xa6sastre.\n
    null_terminator: false
  - name: TX_2706
    index: 0x06
    text: |-
      Le radeau sera
      pr\xa7t quand tu
      auras une
      \col(1)carte\col(0).
  - name: TX_2707
    index: 0x07
    text: |-
      H\xa6! T'en as mis
      du temps? Mon
      radeau est pr\xa7t!
      Viens ici!
  - name: TX_2708
    index: 0x08
    text: |-
      Pousse-toi de
      l\xa0. Le radeau
      est pr\xa7t!\n
    null_terminator: false
  - name: TX_2709
    index: 0x09
    text: |-
      Grimpe dessus et
      appuie sur \col(0x84)\item(0x00)\col(0)
      pour bouger!
  - name: TX_270a
    index: 0x0a
    text: |-
      J'aurai un
      radeau pr\xa7t \xa0
      chaque fois que
      tu viendras me
      voir!
      \jump(TX_2709)
    null_terminator: false
  - name: TX_270b
    index: 0x0b
    text: |-
      Je suis \col(3)Cheval\col(0).\stop
      Je recherche des
      objets qui
      resistent \xa0
      l'eau.
  - name: TX_270c
    index: 0x0c
    text: |-
      \call(TX_270b)
