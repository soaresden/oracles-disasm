      Merci...(sniff)
      C'\xa6tait bien...
      Prends-\xa4a.
      C'est ma
      premi\xa5re.
      Syrup ne m'a
      jamais
      compliment\xa6. Je
      garde ce \col(1)livre\col(0).
      (Sniff!)
  - name: TX_0712
    index: 0x12
    text: |-
      Ouch...\stop
      Fais attention
      o\xae tu vas!
      Je viens de ce
      tunnel \xa6trange,
      je volais
      tranquillement
      quand tu m'as
      fonc\xa6 dedans! Je
      suis \col(3)Maple\col(0),
      l'apprentie de
      \col(3)Syrup\col(0), la
      sorci\xa5re!
