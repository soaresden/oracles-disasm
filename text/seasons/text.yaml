    index: 0x11
    text: |-
      Il y a quatre
      saisons dans
      \col(3)Holodrum\col(0):
      printemps, \xa6t\xa6,
      automne, hiver.
      Le monde change
      avec les
      saisons. Au
      printemps, le
      vent peut vous
      balayer, en \xa6t\xa6
      les lacs et
      rivi\xa5res sont
      ass\xa6ch\xa6es.
      En automne, les
      feuilles ouvrent
      de nouveaux
      chemins. En
      hiver, la neige
      bloque les
      chemins et les
      lacs sont
      gel\xa6s.
  - name: TX_3212
    index: 0x12
    text: |-
      START pour
      acc\xa6der au
      menus, SELECT
      pour faire
      d\xa6filer les
      \xa6crans.\stop
      Inventaire,
      \xa6cran Qu\xa7te,
      \xa6cran Statut et
      \xa6cran Essence.\stop
      Dans l'\xa6cran
      Qu\xa7te, vous
      pouvez activer
      un \col(1)anneau\col(0).
  - name: TX_3213
    index: 0x13
    text: |-
      Hmm, m\xa7me ces
      \col(3)Oizosaitout\col(0)
      en savent peu
      sur les
      \col(1)essences\col(0).
- group: 0x33
  data:
  - name: TX_3300
    index: 0x00
    text: |-
      Redonne la
      lumi\xa5re aux
      torches
      \xa6teintes!
  - name: TX_3301
    index: 0x01
    text: |-
      Ce que tu
      cherches est
      dans l'oeil.
  - name: TX_3302
    index: 0x02
    text: |-
      Voici la \col(3)Grotte
      du H\xa6ros\col(0).\stop
      Va plus loin si
      si tu as
      confiance
      en toi.
  - name: TX_3303
    index: 0x03
    text: |-
      C'est bien, tu
      es arriv\xa6
      jusqu'ici! Mais
      il reste un
      dernier d\xa6fi.
      Cela te co\xaftera
      60 Rubis.
      Veux-tu essayer?
        \opt()Oui \opt()Non
  - name: TX_3304
    index: 0x04
    text: |-
      Ouvre les
      coffres
      dans le bon
      ordre. Leur
      position te
      donne un indice.
      Sois attentif.
  - name: TX_3305
    index: 0x05
    text: |-
      Alors reviens
      plus tard.
  - name: TX_3306
    index: 0x06
    text: |-
      M\xa7me un h\xa6ros
      a besoin
      d'argent.
      Reviens quand
      tu en auras.
  - name: TX_3307
    index: 0x07
    text: |-
      Incroyable!
      Tu as gagn\xa6
      ce d\xa6fi!
- group: 0x34
  data:
  - name: TX_3400
    index: 0x00
    text: |-
      Je suis le
      Ma\xa9tre
      Plongeur! Pour
      devenir mon
      \xa6l\xa5ve, va
      dans la grotte,
      ouvre les quatre
      yeux en m\xa7me
      temps!
      Ram\xa5ne-moi
      la preuve que
      tu l'as fait!
  - name: TX_3401
    index: 0x01
    text: |-
      Ohh!!!
      C'est ma \col(1)Dipl\xd0me
      du Ma\xa9tre\col(0)!
      Tu as pass\xa6
      mon test!
      Tr\xa5s tr\xa5s bien!
      Je te prends
      comme \xa6l\xa5ve!
      Prends ces
      \col(1)Palmes\col(0)!
  - name: TX_3402
    index: 0x02
    text: |-
      Tu ne veux
      vraiment pas
      \xa7tre mon
      \xa6l\xa5ve?
      Pas moyen?
  - name: TX_3403
    index: 0x03
    text: |-
      Il para\xa9t que
      \col(3)Zelda\col(0) a \xa6t\xa6
      kidnapp\xa6e.
      Qu'allons-nous
      faire?
  - name: TX_3404
    index: 0x04
    text: |-
      Je vais te
      montrer
      ma route secr\xa5te
      du \col(3)Mt. Cocotte\col(0)!
      Il y a un trou
      de plong\xa6e
      dans la ville.
      Utilise les
      \col(1)Palmes\col(0) que je
      t'ai donn\xa6es.
- group: 0x35
  data:
  - name: TX_3500
    index: 0x00
    text: |-
      Vous pouvez
      planter
      une \col(1)Graine
      Gasha\col(0).
        \opt()Planter \opt()Non
  - name: TX_3501
    index: 0x01
    text: |-
      Vous obtenez une
      \col(1)Noix Gasha\col(0)!
      Que renferme-
      t-elle donc?
  - name: TX_3502
    index: 0x02
    text: |2-

      \xa0 l'int\xa6rieur!
  - name: TX_3503
    index: 0x03
    text: |-
      Il y a dedans\x20
      un \col(1)Quart de
      Coeur\col(0)!\heartpiece
      V\xa6rifiez dans le
      sous-menu.
  - name: TX_3504
    index: 0x04
    text: Un \col(1)Anneau\col(0) \xa6tait\jump(TX_3502)
    null_terminator: false
  - name: TX_3505
    index: 0x05
    text: Une \col(1)Potion\col(0) \xa6tait\jump(TX_3502)
    null_terminator: false
  - name: TX_3506
    index: 0x06
    text: |-
      \col(1)200 Rubis\col(0)
      \xa6taient\jump(TX_3502)
    null_terminator: false
  - name: TX_3507
    index: 0x07
    text: \col(1)5 coeurs\col(0) \xa6taient\jump(TX_3502)
    null_terminator: false
  - name: TX_3508
    index: 0x08
    text: Une \col(1)f\xa6e\col(0) \xa6tait\jump(TX_3502)
    null_terminator: false
  - name: TX_3509
    index: 0x09
    text: |-
      Ce sol fertile
      est parfait pour
      planter des
      \col(1)graines\col(0).
- group: 0x36
  data:
  - name: TX_3600
    index: 0x00
    text: |-
      Tes bijoux sont
      parfaits!
  - name: TX_3601
    index: 0x01
    text: |-
      Sol, temps,
      soleil,
      pluie,
      chaleur...
      J'attends celui
      conna\xa9t ces
      \col(1)essences\col(0)...
  - name: TX_3602
    index: 0x02
    text: |-
      O, gardien des
      \col(1)essences\col(0)!
      J'ai attendu
      ta venue!
      Voil\xa0 pour toi!
  - name: TX_3603
    index: 0x03
    text: |-
      Je n'ai rien
      d'autre \xa0
      donner.
      Reprends ta
      route!
  - name: TX_3604
    index: 0x04
    text: |-
      Ooo! D\xa6sol\xa6!
      Me pardonneras-
      tu si je te dis
      un secret?\stop
      Si tu es perdu
      dans les bois,
      va \xa0 l'ouest, au
      sud, \xa0 l'est,
      et au nord,
      passant d'une
      saison \xa0 une
      autre encore
      plus chaude.
- group: 0x37
  data:
  - name: TX_3700
    index: 0x00
    text: |-
      \sfx(0xc7)Bienvenue \xa0 la
      \col(3)Montagne Goron\col(0).\stop
      Il fait si froid
      que personne ne
      va dehors et moi
      je ne me sens
      pas bien.
  - name: TX_3701
    index: 0x01
    text: |-
      \sfx(0xc7)Connais-tu le
      \col(1)Vase Goron\col(0)?\stop
      Tous les
      collectionneurs
      le veulent!
  - name: TX_3702
    index: 0x02
    text: |-
      \sfx(0xc7)\col(3)Biggoron\col(0) est si
      grand qu'il ne
      peut vivre dans
      nos cavernes.
      Mais il fait si
      froid dehors...
      Le pauvre Goron.
  - name: TX_3703
    index: 0x03
    text: |-
      \sfx(0xc7)La \col(3)Montagne
      Goron\col(0) a
      toujours eu de
      courts hivers.
      Mais depuis que
      le \col(3)Temple des
      Saisons\col(0) a \xa6t\xa6
      englouti, y fait
      trop froid. On
      s'enrhume rien
      qu'en sortant.
  - name: TX_3704
    index: 0x04
    text: |-
      \sfx(0xc7)\col(3)Biggoron\col(0) est
      au-dessus, mais
      il est enrhum\xa6.
      Sois discret.
  - name: TX_3705
    index: 0x05
    text: |-
      \sfx(0xc7)De la lave?
      J'aime pas le
      froid.
  - name: TX_3706
    index: 0x06
    text: |-
      \sfx(0xc7)Si j'avais un
      \col(1)Vase Goron\col(0),
      je l'\xa6changerais
      pas contre 100
      \col(1)Poissons\col(0).
  - name: TX_3707
    index: 0x07
    text: |-
      \sfx(0xc7)Cette ann\xa6e est
      bizarre.\stop
      Qu'importe la
      dur\xa6e de l'hiver
      il n'a jamais
      fait si froid...
      Y'a un truc
      qui cloche.
  - name: TX_3708
    index: 0x08
    text: |-
      \sfx(0xc7)C'est bien,
      \col(3)Biggoron\col(0) n'est
      plus enrhum\xa6.
  - name: TX_3709
    index: 0x09
    text: |-
      \sfx(0xc7)C'est gentil
      d'avoir fait
      tout ce chemin
      pour me voir!
      En remerciement,
      veux-tu que
      je fasse
      une bo\xa9te qui
      pourra contenir
      plus d'\col(1)anneaux\col(0)?
        \opt()Oui! \opt()Non
  - name: TX_370a
    index: 0x0a
    text: |-
      \sfx(0xc7)Voyons voir ta
      \col(1)bo\xa9te\col(0).\stop
      Bon, coller-ci.
      Bouger \xa4a.\stop
      Voil\xa0, c'est
      fini!
  - name: TX_370b
    index: 0x0b
    text: |-
      \sfx(0xc7)Vivre seul,
      c'est calme,
      mais un peu
      triste...
  - name: TX_370c
    index: 0x0c
    text: |-
      \sfx(0xc7)Occupe-toi de
      tes affaires...\stop
      T'es pas tr\xa5s
      bien \xa6lev\xa6..?
  - name: TX_370d
    index: 0x0d
    text: |-
      Ben, t'as pas de
      \col(1)Bo\xa9te \xa0 Anneaux\col(0)?
      Reviens quand tu
      en auras une.
  - name: TX_370e
    index: 0x0e
    text: |-
      \sfx(0xc7)Forger la
      \col(1)grande \xa6p\xa6e\col(0) est
      une lourde
      t\xa1che.
      \col(3)Biggoron\col(0) ne
      peut pas la
      mener \xa0 bien
      s'il est malade.
  - name: TX_370f
    index: 0x0f
    text: |-
      \sfx(0xc7)Le temps est
      redevenu normal,
      mais je d\xa6teste
      toujours le
      froid.
- group: 0x38
  data:
  - name: TX_3800
    index: 0x00
    text: |-
      Bwee...\stop
      Le pauvre
      \col(3)Moblin\col(0)...
      Etre oblig\xa6 de
      fabriquer des
      \col(3)Bombes\col(0) ici...
  - name: TX_3801
    index: 0x01
    text: |-
      Bwee...
      Nous allons
      surpasser ces
      \xa6preuves et
      cr\xa6er un nouvel
      avenir!
  - name: TX_3802
    index: 0x02
    text: |-
      Bwee...\stop
      Mon \col(3)antre\col(0) est
      en ruine! Je
      dois tout
      recommencer...
      Pourquoi \xa4a
      m'arrive \xa0 moi?
  - name: TX_3803
    index: 0x03
    text: |-
      Bwee...\stop
      Encore combien
      de \col(3)Bombes\col(0) pour
      reconstruire
      notre \col(3)antre\col(0)?
      Apr\xa5s ce qui
      s'est pass\xa6,
      j'ai perdu
      espoir.
  - name: TX_3804
    index: 0x04
    text: |-
      \pos(2)Bwee-hee!
      C'\xa6tait toi!
      Tu vas payer!\stop
      Oeil pour oeil!
  - name: TX_3805
    index: 0x05
    text: |-
      Bwee...
      J'suis crev\xa6...\stop
      Je ne sais plus
      combien j'ai
      fait de \col(3)Bombes\col(0).
      Ca devrait \xa7tre
      presque fini...
- group: 0x39
  data:
  - name:
    - TX_3900
    - TX_3901
    - TX_3902
    - TX_3903
    - TX_3904
    - TX_3905
    - TX_3906
    - TX_3907
    - TX_3908
    - TX_3909
    - TX_390a
    - TX_390b
    - TX_390c
    - TX_390d
    index:
    - 0x00
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    - 0x08
    - 0x09
    - 0x0a
    - 0x0b
    - 0x0c
    - 0x0d
    text: |-
      Frappe quand la
      bouche s'ouvre.
      La force donne
      la victoire.
  - name: TX_390e
    index: 0x0e
    text: |-
      Un corps gard\xa6
      regarde avec
      des yeux
      non-gard\xa6s.
  - name: TX_390f
    index: 0x0f
    text: |-
      Rappelle-toi de
      l'ordre dans
      lequel tu as
      tu\xa6 les
      chevaliers.
  - name: TX_3910
    index: 0x10
    text: |-
      L'observation
      en silence est
      parfois
      n\xa6cessaire.
  - name: TX_3911
    index: 0x11
    text: |-
      La glace magique
      peut tout geler.
  - name: TX_3912
    index: 0x12
    text: |-
      Le bleu n'est
      pas pour les
      faibles.
  - name: TX_3913
    index: 0x13
    text: |-
      Je serai ton
      guide.
  - name: TX_3914
    index: 0x14
    text: |-
      N'oublie pas de
      me donner
      des Graines
      Myst\xa6rieuses.
  - name: TX_3915
    index: 0x15
    text: |-
      Dans l'eau,
      ils sont
      invincibles.
  - name: TX_3916
    index: 0x16
    text: |-
      La source de la
      mal\xa6diction est
      dans les
      t\xa6n\xa5bres.
  - name: TX_3917
    index: 0x17
    text: |-
      Une bonne
      d\xa6fense est la
      meilleur attaque
      contre les
      piques.
  - name: TX_3918
    index: 0x18
    text: |-
      Sautez plusieurs
      fois et vous
      irez plus haut.
  - name: TX_3919
    index: 0x19
    text: |-
      Celui qui va
      vite parcourt de
      longues
      distances.
  - name: TX_391a
    index: 0x1a
    text: |-
      Les \xa6clats de
      glace font des
      lames
      perforantes.
  - name:
    - TX_391b
    - TX_391c
    index:
    - 0x1b
    - 0x1c
    text: |-
      Sous moi, rouge.
      A ma droite,
      rouge. Moi
      seul deviendrai
      bleu.
  - name: TX_391d
    index: 0x1d
    text: |-
      Les graines
      bleues donnent
      de la vitesse.
- group: 0x3a
  data:
  - name: TX_3a00
    index: 0x00
    text: |-
      A cause de la
      temp\xa7te, le
      \col(3)Capt'n\col(0) a
      perdu la \col(1)cloche\col(0)
      qui lui a \xa6t\xa6
      donn\xa6 par un
      type sp\xa6cial.
      C'est ennuyeux.
  - name: TX_3a01
    index: 0x01
    text: |-
      Cette \col(1)cloche\col(0) est
      toute rouill\xa6e.
      C'est pas bien
      dr\xd0le, \xa4a.
  - name: TX_3a02
    index: 0x02
    text: |-
      Notre bateau a
      \xa6t\xa6 pris dans
      une temp\xa7te
      et a coul\xa6.
      Quand on s'est
      r\xa6veill\xa6s, on
      \xa6tait l\xa0.
      O\xae sommes-nous?
      C'est bizarre
      comme coin.
  - name: TX_3a03
    index: 0x03
    text: |-
      On est morts?
      C'est \xa4a le
      paradis?
      C'est vraiment
      bizarre comme
      coin...
  - name: TX_3a04
    index: 0x04
    text: |-
      Le \col(3)Capt'n\col(0) est
      mal en point!
      On pourra jamais
      quitter cet
      endroit!
  - name: TX_3a05
    index: 0x05
    text: |-
      Cette \col(1)cloche\col(0) est
      peut-\xa7tre
      rouill\xa6e
      mais elle est
      tr\xa5s bien
      sculpt\xa6e.
  - name: TX_3a06
    index: 0x06
    text: |-
      Le type qu'on a
      envoy\xa6 chercher
      la \col(1)cloche\col(0) n'est
      pas revenu.
      Je lui ai dit
      de chercher dans
      le bateau...
  - name: TX_3a07
    index: 0x07
    text: |-
      Seul un vrai
      artisan pourrait
      redonner \xa0 cette
      \col(1)cloche\col(0) tout son
      \xa6clat! Elle est
      compl\xa5tement
      rouill\xa6e.
  - name: TX_3a08
    index: 0x08
    text: |-
      As-tu vu notre
      bateau? Il est
      pr\xa5s du
      cimeti\xa5re.
      Il n'est pas
      r\xa6par\xa6, il est
      tout cass\xa6.
  - name: TX_3a09
    index: 0x09
    text: |-
      Le \col(3)Capt'n\col(0)
      conna\xa9t une
      certaine
      personne.
      Il para\xa9t que
      c'est la reine
      d'un grand
      royaume.
  - name: TX_3a0a
    index: 0x0a
    text: |-
      Il va bien?
      Ce type est
      tr\xa5s imprudent.
  - name: TX_3a0b
    index: 0x0b
    text: |-
      Est-ce qu'on va
      s'en sortir?
      C'est pas
      gagn\xa6...
  - name: TX_3a0c
    index: 0x0c
    text: |-
      Que va-t-il se
      passer?
  - name: TX_3a0d
    index: 0x0d
    text: |-
      Hola!\stop
      Rien! Laisse
      tomber! Pfff!
  - name: TX_3a0e
    index: 0x0e
    text: |-
      C'est trop
      calme en bas...\stop
      Tout le monde
      est parti?
      Y reste que
      nous???
  - name: TX_3a0f
    index: 0x0f
    text: |-
      Je commence
      \xa0 m'habituer \xa0
      la vie ici.
  - name: TX_3a10
    index: 0x10
    text: |-
      Combien de
      temps pensent-
      ils rester
      ici!?!
  - name: TX_3a11
    index: 0x11
    text: |-
      Ne me dis pas
      que tu vas
      rester ici!
  - name: TX_3a12
    index: 0x12
    text: |-
      J'veux revoir
      mes potes et
      r\xa6parer le
      bateau, mais le
      \col(3)Capt'n\col(0) a dit:
      \x1aNe revenez que
      si vous avez
      la \col(1)cloche\col(0)\x1a!\stop
      Quelqu'un veut
      ma place..?
  - name: TX_3a13
    index: 0x13
    text: |-
      Tu t'occupes de
      la \col(1)cloche\col(0)?!?\stop
      Moi je rentre!
      T'es trop cool!
  - name: TX_3a14
    index: 0x14
    text: |-
      \pos(0)Oui,
      m'sieur!
  - name: TX_3a15
    index: 0x15
    text: |-
      Au rapport mon
      \col(3)Capt'n\col(0)! Le
      bateau est
      r\xa6par\xa6! Nous
      pouvons partir
      quand vous
      voulez!
  - name: TX_3a16
    index: 0x16
    text: |-
      Bande
      d'imb\xa6ciles!
      Y'a personne qui
      peut trouver ma
      \col(1)cloche\col(0)?\stop
      Toi...?
  - name: TX_3a17
    index: 0x17
    text: |-
      \call(TX_3a16)
      Ar, har, har!
      Ne sois pas
      stupide!\n
    null_terminator: false
  - name: TX_3a18
    index: 0x18
    text: |-
      Tu n'es pas
      encore un vrai
      aventurier!
      Tu dois d'abord
      me prouver que
      t'es un vrai
      aventurier en
      explorant des
      ruines, sinon...
      Tu t'en vas!
  - name: TX_3a19
    index: 0x19
    text: |-
      \call(TX_3a16)
      Je peux voir
      dans tes yeux.
      Tu es un
      v\xa6ritable
      aventurier...
      OK! Va la
      chercher!\n
    null_terminator: false
  - name: TX_3a1a
    index: 0x1a
    text: |-
      Trouve ma
      \col(1)cloche\col(0)!
      J'attends!
  - name: TX_3a1b
    index: 0x1b
    text: |-
      Hein? Tu m'as
      trouv\xa6 ma
      \col(1)cloche\col(0)?
      Merci, mon
      gars!
  - name: TX_3a1c
    index: 0x1c
    text: |-
      \call(TX_3a1b)
      Oh! Ben v'l\xa0
      aut'chose!\stop
      C'est ben trop
      rouill\xa6!
      Qu'est-ce tu
      fais?
      Ca va pas
      l'faire!\n
    null_terminator: false
  - name: TX_3a1d
    index: 0x1d
    text: |-
      Va la faire
      polir, faut
      qu'\xa4a brille!
  - name: TX_3a1e
    index: 0x1e
    text: |-
