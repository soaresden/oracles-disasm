- group: 0x07
  data:
  - name: TX_0700
    index: 0x00
    text: |-
      Hola! Hola!\stop
      Fais attention!
      Tu viens de
      bousculer \col(3)Maple\col(0),
      l'apprentie de
      la sorci\xa5re
      \col(3)Syrup\col(0)!
      A cause de toi,
      toutes les
      affaires sont
      tomb\xa6es! La
      sorci\xa5re va \xa7tre
      furieuse!
      Je ne trouve pas
      d'\col(1)Oeuf Lon Lon\col(0),
      et voil\xa0...
      Je prends les
      affaires que tu
      as fait tomber!
      C'est \xa0 moi!
  - name: TX_0701
    index: 0x01
    text: |-
      Encore toi?\stop
      A cause de toi,
      j'ai perdu ce
      ce qui \xa6tait
      dans mon sac!
      Moi, \col(3)Maple\col(0), je
      vais me venger
      en prenant tes
      affaires!
      Et voil\xa0!
  - name: TX_0702
    index: 0x02
    text: |-
      A-\x8a-E-!!!
      Toi... ENCORE?
      Tu m'cherches
      ou tu le fais
      expr\xa5s?
      A cause de toi,
      toutes mes
      affaires sont
      par terre! Allez
      j'te prends les
      tiennes!
  - name: TX_0703
    index: 0x03
    text: |-
      AH! Mes affaires
      sont tomb\xa6es
      par terre! Je
      vais te piquer
      les tiennes!
      Ca t'apprendra!
      Faut pas me
      chercher, moi
      \col(3)Maple\col(0)!
  - name: TX_0704
    index: 0x04
    text: |-
      Rh\xa1\xa1\xa1\xa1\xa1...
      Encore?
      Mes affaires
      sont tomb\xa6es!
      Je vais prendre
      les tiennes en
      \xa6change!
  - name: TX_0705
    index: 0x05
    text: |-
      C'est toi?!
      Tu connais le
      syst\xa5me! Le plus
      rapide gagne.
      Pr\xa7t..? Go!
  - name: TX_0706
    index: 0x06
    text: |-
      Hah, ha, ha! Tu
      rigoles moins!
      J'ai gagn\xa6 des
      trucs! Hahaha!
      A bient\xd0t!
  - name: TX_0707
    index: 0x07
    text: |-
      Argh! Toi..!
      Je me
      souviendrai
      de toi!
  - name: TX_0708
    index: 0x08
    text: |-
      Hmm! Pas mal!\stop
      Mais c'est tout
      ce que tu
      auras.
  - name: TX_0709
    index: 0x09
    text: |-
      A\xaae...\stop
      Fais gaffe ou
      tu vas! Tu viens
      de bousculer
      \col(3)Maple\col(0),
      l'apprentie de
      la Sorci\xa5re
      \col(3)Syrup\col(0)!\stop
      Gare \xa0 toi!
  - name: TX_070a
    index: 0x0a
    text: |-
      Mais c'est un
      \col(1)Oeuf Lon Lon\col(0)!
      C'est super \xa0 la
      mode, les filles
      en raffolent!
      C'est ce que je
      cherchais!
      T'es un gar\xa4on!
      T'en as pas
      besoin. Je te
      l'\xa6change contre
      ma poup\xa6e!
  - name: TX_070b
    index: 0x0b
    text: |-
      Ca t'apprendra
      \xa0 me rentrer
      dedans! Salut!
  - name: TX_070c
    index: 0x0c
    text: |-
      Ah!
      . . . . . .\stop
      Salut!\heart
- group: 0x08
