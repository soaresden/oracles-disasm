  - name: TX_3e11
    index: 0x11
    text: |-
      Les douches
      volcan, \xa4a
      requinque!
  - name: TX_3e12
    index: 0x12
    text: |-
      \sym(0x1c)Creuser l\xa0 pour
      du \col(1)Minerai\col(0)\sym(0x1c)
      \sym(0x1c)Creuser l\xa0 pour
      des cailloux\sym(0x1c)
  - name: TX_3e13
    index: 0x13
    text: |-
      Je sais qu'il y
      a un tr\xa6sor
      par ici, et
      je vais le
      trouver!
  - name: TX_3e14
    index: 0x14
    text: |-
      Je sens du
      \col(1)Minerai\col(0) pas
      loin...
  - name: TX_3e15
    index: 0x15
    text: |-
      Il para\xa9t qu'il
      y a du \col(1)Minerai
      Rouge\col(0) et
      \col(1)Bleu\col(0).\stop
      Si tu les
      m\xa6langes, tu
      auras du
      minerai
      indestructible!\stop
      Mais c'est un
      Secret!
  - name: TX_3e16
    index: 0x16
    text: |-
      Des gars
      appell\xa6s
      les \col(3)Piratians\col(0)
      se sont
      install\xa6s au
      sud.
  - name: TX_3e17
    index: 0x17
    text: |-
      Le march\xa6 de
      Subrosia
      s'est mis \xa0
      vendre des trucs
      \xa6tranges.\stop
      Ca doit venir
      du \x1atemple\x1a.
  - name: TX_3e18
    index: 0x18
    text: |-
      Attraper des
      objets, pousser
      des leviers et
      assommer des
      monstres...\stop
      Un \col(1)Boomerang\col(0),
      c'est tr\xa5s
      utile!
  - name: TX_3e19
    index: 0x19
    text: |-
      Le collier de
      \col(3)Rosa\col(0) peut ouvrir
      les portes.\n
  - name: TX_3e1a
    index: 0x1a
    text: |-
      Divines!
      Superbes!
      Fantastiques!
      Merveilleuses\x20
      pancartes!!!
  - name: TX_3e1b
    index: 0x1b
    text: |-
      As-tu cass\xa6
      des pancartes?
      Non, bien s\xafr!
      Elles sont si
      jolies! Je vois
      qu'on est
      d'accord!
  - name: TX_3e1c
    index: 0x1c
    text: |-
      T'as cass\xa6
      \col(4)\num1 pancartes\col(0)!
      Que tu es
      cruel..
  - name: TX_3e1d
    index: 0x1d
    text: |-
      T'as cass\xa6
      \col(4)\num1 pancartes\col(0)!
      Tu vas payer cet
      acte de
      barbarie!
  - name: TX_3e1e
    index: 0x1e
    text: |-
      T'as cass\xa6
      \col(4)\num1 pancartes\col(0)!
      Honte et
      malheur sur
      toi, impudent!
  - name: TX_3e1f
    index: 0x1f
    text: |-
      T'as cass\xa6
      \col(4)\num1 pancartes\col(0)!
      Ne recommence
      pas! Ca suffit
      maintenant!
  - name: TX_3e20
    index: 0x20
    text: |-
      T'as cass\xa6
      \col(4)\num1 pancartes\col(0)!
      Je t'avais
      pr\xa6venu, mais tu
      n'en fais qu'\xa0
      ta t\xa7te..!
      Pr\xa6pare-toi, tu
      vas morfler!\stop
      Ca va \xa7tre ta
      f\xa7te!
  - name: TX_3e21
    index: 0x21
    text: |-
      Surprise?\stop
      T'as compris la
      le\xa4on!?!
      Tu ne casseras
      plus rien.
      Prends cet
      \col(1)anneau\col(0)
      pour te
      rappeler
      ton erreur!
  - name: TX_3e22
    index: 0x22
    text: |-
      Vas-tu enfin
      traiter les
      pancartes avec
      respect?
  - name: TX_3e23
    index: 0x23
    text: |-
      \call(TX_3e1a)
      \jump(TX_3e1b)
    null_terminator: false
  - name: TX_3e24
    index: 0x24
    text: |-
      \call(TX_3e1a)
      \jump(TX_3e1c)
    null_terminator: false
  - name: TX_3e25
    index: 0x25
    text: |-
      \call(TX_3e1a)
      \jump(TX_3e1d)
    null_terminator: false
  - name: TX_3e26
    index: 0x26
    text: |-
      \call(TX_3e1a)
      \jump(TX_3e1e)
    null_terminator: false
  - name: TX_3e27
    index: 0x27
    text: |-
      \call(TX_3e1a)
      \jump(TX_3e1f)
    null_terminator: false
  - name: TX_3e28
    index: 0x28
    text: |-
      \call(TX_3e1a)
      \jump(TX_3e22)
    null_terminator: false
  - name: TX_3e29
    index: 0x29
    text: |-
      Ces deux-l\xa0
      fon\xa4aient vers
      la maison.
      Je me demande
      s'ils ont trouv\xa6
      autre chose...
- group: 0x3f
  data:
  - name: TX_3f00
    index: 0x00
    text: |-
      \pos(0)Toi, le
      mioche!\stop
      ceci est le
      royaume du
      \col(3)Grand Moblin\col(0)!
      Si tu veux
      passer, tu dois
      payer!
  - name: TX_3f01
    index: 0x01
    text: |-
      \pos(0)Ah! Tu es
      de retour!!!
  - name: TX_3f02
    index: 0x02
    text: |-
      \pos(0)Sale mioche!!
      ...!!!  Toi!?!
      Tu vas encore
      m'emb\xa7ter?
      Mais je suis
      plus puissant!
      Tu n'entreras
      jamais dans ma
      forteresse!
      Je vais avoir
      ma vengeance!
      Larguez les
      bombes!!!
  - name:
    - TX_3f03
    - TX_3f04
    index:
    - 0x03
    - 0x04
    text: |-
      \pos(2)Le sale
      mioche
      est revenu!\stop
      Je ne te
      laisserai pas
      faire! Cette
      fois la victoire
      est mienne!
  - name: TX_3f05
    index: 0x05
    text: |-
      \pos(0)Argh! Comment
      ce gosse peut
      me battre?!?
      Argh! Je m'en
      souviendrai!
      J'aurai ma
      revanche!!!
  - name: TX_3f06
    index: 0x06
    text: |-
      \pos(2)Tu ne pourras
      pas me battre
      comme \xa4a!\stop
      Je ne peux \xa7tre
      vaincu tant
      que je ne l\xa1che
      pas ma \col(1)Bombe\col(0)
      derri\xa5re moi et
      que le feu
      s'allume!
- group: 0x40
  data:
  - name: TX_4000
    index: 0x00
    text: |-
      Oh! Tu as du
      \col(1)Minerai Rouge\col(0)
      et \col(1)Bleu\col(0)! Tu
      veux que je
      fasse du
      \col(1)Minerai Solide\col(0)?
        \opt()Oui \opt()Non
  - name: TX_4001
    index: 0x01
    text: Oh, OK.
  - name: TX_4002
    index: 0x02
    text: |-
      Ben, je vais m'y
      mettre
      maintenant!
  - name: TX_4003
    index: 0x03
    text: Et c'est parti!
  - name: TX_4004
    index: 0x04
    text: |-
      Voil\xa0 ton
      \col(1)Minerai Solide\col(0)!
      C'est chaud,
      fais attention.
  - name: TX_4005
    index: 0x05
    text: |-
      Je vais fondre
      du minerai toute
      la journ\xa6e!
- group: 0x41
  data:
  - name: TX_4100
    index: 0x00
    text: |-
      \pos(2)Laisse-moi
      t'apaiser. Ferme
      les yeux...
  - name: TX_4101
    index: 0x01
    text: |-
      Te voici dans le
      saint des saints
      du \col(3)Temple
      des Saisons\col(0).
      As-tu une
      requ\xa7te?
        \opt()Oui \opt()Non
  - name: TX_4102
    index: 0x02
    text: |-
      Alors quitte
      cet endroit.
  - name: TX_4103
    index: 0x03
    text: |-
      Ah, oui...
      Je comprends.\stop
      Merci \xa0 toi,
      messager de
      \col(3)Labrynna\col(0).
      Prends-ceci en
      remerciement.
  - name: TX_4104
    index: 0x04
    text: |-
      Le joaillier du
      \col(3)Village Horon\col(0)
      pourra
      l'analyser.
  - name: TX_4105
    index: 0x05
    text: |-
      \pos(2)Reviens me
      voir quand
      tu te sens
      fatigu\xa6.
- group: 0x42
  data:
  - name: TX_4200
    index: 0x00
    text: |-
      Je... Je suis
      \col(3)\Child\col(0)!\stop
      Oups! J'ai parl\xa6
      \xa0 un \xa6tranger!
  - name: TX_4201
    index: 0x01
    text: |-
      Tu es \Link?\stop
      Je suis \col(3)\Child\col(0)!
      Pas question!
  - name: TX_4202
    index: 0x02
    text: |-
      Es-tu fort?
        \opt()Oui \opt()Non
  - name: TX_4203
    index: 0x03
    text: |-
      Je suis fort
      aussi, et je
      prot\xa5ge ma
      m\xd0man et mon
      p\xd0pa!
  - name: TX_4204
    index: 0x04
    text: |-
      Hein???
      Et \xa4a ne te
      d\xa6range pas?!?
  - name: TX_4205
    index: 0x05
    text: |-
      J'ai h\xa1te d'\xa7tre
      un adulte.
- group: 0x43
  data:
  - name: TX_4300
    index: 0x00
    text: |-
      je suis \col(3)Bipin\col(0),
      l'arboriste!
      Je sais tout
      sur les arbres.
      Je vais te dire
      quelque chose!\stop
      \col(3)Blossom\col(0) et
      moi, on a eu
      un b\xa6b\xa6!
      Oui! C'est
      vrai!!!\stop
      Regarde par toi
      m\xa7me!
  - name: TX_4301
    index: 0x01
    text: |-
      Le nom est
      choisi!
      \col(3)\Child\col(0)!
      C'est un joli
      nom! J'esp\xa5re
      qu'il deviendra
      un bon gar\xa4on!
  - name: TX_4302
    index: 0x02
    text: |-
      H\xa6, \Link!\stop
      Mon gar\xa4on est
      malade! Mais
      j'ai quelque
      chose \xa0 te
      dire.
  - name: TX_4303
    index: 0x03
    text: |-
      Mon gar\xa4on va
      bien! Je peux me
      reposer. Mais
      j'ai des trucs \xa0
      te dire!
  - name: TX_4304
    index: 0x04
    text: |-
      H\xa6, \Link!
      \col(3)\Child\col(0) a bien
      grandi, j'ai
      encore des
      choses \xa0 te
      dire!
  - name: TX_4305
    index: 0x05
    text: |-
      \Link! Ca
      fait longtemps!
      Je suis aussi
      all\xa6 dans ce
      village! C'est
      agr\xa6able de voir
      un visage
      connu!
  - name: TX_4306
    index: 0x06
    text: |-
      H\xa6, \Link!
      \col(3)\Child\col(0) va
      bien!
      Je peux tout
      t'expliquer sur
      les arbres!
  - name: TX_4307
    index: 0x07
    text: |-
      H\xa6, \Link!\stop
      \col(3)\Child\col(0) est
      un grand
      maintenant!\n
    null_terminator: false
  - name: TX_4308
    index: 0x08
    text: |-
      Je vais tout te
      dire sur les
      arbres!
  - name: TX_4309
    index: 0x09
    text: |-
      Le contenu des
      \col(1)Noix Gasha\col(0)
      d\xa6pend de
      l'endroit o\xae
      a \xa6t\xa6 plant\xa6e la
      \col(1)graine\col(0).
      Si tu trouves un
      bon endroit,
      dis-le moi!
  - name: TX_430a
    index: 0x0a
    text: |-
      Dans une \col(1)Noix
      Gasha\col(0), il peut y
      avoir des
      \col(1)Anneaux
      Magiques\col(0),
      mais aussi des
      Rubis et des
      quarts de
      coeur.
  - name: TX_430b
    index: 0x0b
    text: |-
      Il para\xa9t que
      le contenu d'une
      \col(1)noix\col(0) d\xa6pend
      des actions de
      celui qui l'a
      plant\xa6e.
      Plus il a voyag\xa6
      et occis de
      monstres, plus
      le contenu
      sera pr\xa6cieux!
  - name: TX_430c
    index: 0x0c
    text: |-
      Trouver des
      passages
      secrets et de
      nouveaux
      endroits
      pour planter des
      \col(1)Graines Gasha\col(0)
      am\xa6liore les
      \col(1)Noix Gasha\col(0).
  - name: TX_430d
    index: 0x0d
    text: |-
      Aider ceux qui
      ont besoin
      d'aide am\xa6liore
      aussi les
      \col(1)Graines
      Gasha\col(0).
  - name: TX_430e
    index: 0x0e
    text: |-
      Trouver des
      endroits pour
      planter des
      \col(1)Graines Gasha\col(0)
      est difficile.
      Creuse des
      trous,
      d\xa6place des
      rochers.
  - name: TX_430f
    index: 0x0f
    text: |-
      Je sais que
      planter des
      \col(1)Graines Gasha\col(0)
      dans des
      endroits
      \xa6tranges produit
      des effets
      inhabituels!
  - name: TX_4310
    index: 0x10
    text: |-
      Un voyageur m'a
      dit que le temps
      qu'il faut \xa0 une
      \col(1)Graine Gasha\col(0)
      pour devenir un
      arbre d\xa6pend
      du nombre de
      monstres occis!
      Est-ce que c'est
      vrai?
- group: 0x44
  data:
  - name: TX_4400
    index: 0x00
    text: |-
      Je suis \col(3)Blossom\col(0).\stop
      Voici mon fils,
      un enfant en
      pleine forme!
      Mais je n'arrive
      pas \xa0 choisir
      son nom.
      Pourrais-tu
      m'aider \xa0 en
      trouver un?
      Quel nom lui
      donnerais-tu?
  - name:
    - TX_4401
    - TX_4402
    - TX_4403
    - TX_4404
    - TX_4405
    - TX_4406
    - TX_4407
    index:
    - 0x01
    - 0x02
    - 0x03
    - 0x04
    - 0x05
    - 0x06
    - 0x07
    text: |-
      Tu penses \xa0
      \col(3)\Child\col(0)?
       \opt()Oui \opt()Non
  - name: TX_4408
    index: 0x08
    text: |-
      C'est un joli
      nom! C'est comme
      \xa4a que je vais
      l'appeller! Il a
      l'air content!
      Reviens nous
      voir quand tu
      veux.
  - name: TX_4409
    index: 0x09
    text: |-
      J'esp\xa5re que
      \col(3)\Child\col(0) sera
      un grand et beau
      gar\xa4on comme
      toi.
  - name: TX_440a
    index: 0x0a
    text: |-
      Oui, il faut
      peut-\xa7tre plus y
      r\xa6fl\xa6chir.
  - name: TX_440b
    index: 0x0b
    text: |-
      \col(3)\Child\col(0) a l'air
      un peu bizarre.\stop
      Je veux l'amener
      chez le docteur,
      mais nous
      n'avons pas de
      Rubis...
      Pourrais-tu nous
      en pr\xa7ter?
        \opt()Oui \opt()Non
  - name: TX_440c
    index: 0x0c
    text: |-
      Vraiment?
      Combien
      peux-tu nous
      donner?
       \opt()150 \opt()50
       \opt()10  \opt()1
  - name: TX_440d
    index: 0x0d
    text: |-
      Merci,
      \Link!
      Tu es un vrai
      samaritain!
  - name: TX_440e
    index: 0x0e
    text: |-
      Merci beaucoup.
      Voil\xa0 qui
      devrait
      suffir.
  - name: TX_440f
    index: 0x0f
    text: |-
      Merci...
      Je vais
      m'occuper
      de la somme
      qui manque...
  - name: TX_4410
    index: 0x10
    text: |-
      \Link! Tu
      n'es pas riche.
      Ta sympathie
      fera l'affaire.
  - name: TX_4411
    index: 0x11
    text: Je comprends...
  - name: TX_4412
    index: 0x12
    text: |-
      \col(3)\Child\col(0) va
      beaucoup mieux!
      Merci \xa0 toi!
  - name: TX_4413
    index: 0x13
    text: |-
      Mon b\xa6b\xa6 ne dort
      jamais. \Link,\stop
      comment puis-je
      le faire dormir?
       \opt()Chanter
       \opt()Jouer avec lui
  - name: TX_4414
    index: 0x14
    text: |-
      J'aime chanter!
      Je vais
      essayer!
  - name: TX_4415
    index: 0x15
    text: |-
      Je vois! Si nous
      jouons, il va
      se fatiguer.
      Merci beaucoup!
  - name: TX_4416
    index: 0x16
    text: |-
      Alors? N'est-ce
      pas
      un adorable
      b\xa6b\xa6?
  - name: TX_4417
    index: 0x17
    text: |-
      \col(3)\Child\col(0)
      a grandi!
  - name: TX_4418
    index: 0x18
    text: |-
      \Link!
      Salut \xa0 toi!\stop
      Te souviens-tu
      de notre gar\xa4on,
      \col(3)\Child\col(0)?
      Il va bien!
  - name: TX_4419
    index: 0x19
    text: |-
      \col(3)\Child\col(0) est
      hyperactif!\stop
      Etais-tu un
      enfant
      hyperactif,
      \Link?
        \opt()Oui \opt()Non
  - name: TX_441a
    index: 0x1a
    text: |-
      \col(3)\Child\col(0) est
      tr\xa5s timide.\stop
      Et toi, comment
      \xa6tais-tu,
      \Link?\stop
      Un gar\xa4on
      \xa6nergique?
        \opt()Oui \opt()Non
  - name: TX_441b
    index: 0x1b
    text: |-
      \col(3)\Child\col(0) est un
      gar\xa4on curieux.\stop
      Et toi, comment
      \xa6tais-tu,
      \Link?\stop
      Un gar\xa4on
      \xa6nergique?
        \opt()Oui \opt()Non
  - name: TX_441c
    index: 0x1c
    text: |-
      Oh? Je parie que
      tu \xa6tais un
      gar\xa4on
      malicieux.
  - name: TX_441d
    index: 0x1d
    text: |-
      Calme?
        \opt()Oui \opt()Non
  - name: TX_441e
    index: 0x1e
    text: |-
      Vraiment? Tu
      devais \xa7tre si
      mignon!
  - name: TX_441f
    index: 0x1f
    text: |-
      Etais-tu
      bizarre?
        \opt()Oui \opt()Non
  - name: TX_4420
    index: 0x20
    text: |-
      C'est vrai? Je
      ne l'aurais
      jamais cru...
  - name: TX_4421
    index: 0x21
    text: |-
      Je parie qu'il
      est impossible
      de
      le r\xa6sumer en un
      mot.
  - name: TX_4422
    index: 0x22
    text: |-
      \col(3)\Child\col(0) est
      hyperactif!
  - name: TX_4423
    index: 0x23
    text: |-
      \col(3)\Child\col(0) est
      trop timide.
  - name: TX_4424
    index: 0x24
    text: |-
      \col(3)\Child\col(0) est un
      \xa6trange gar\xa4on,
      mais il sera un
      homme, un vrai!
  - name:
    - TX_4425
    - TX_4426
    index:
    - 0x25
    - 0x26
    text: |-
      \Link!\stop
      Te souviens-tu
      de notre fils,
      \col(3)\Child\col(0)?
      Il est devenu un
      bel homme!
  - name: TX_4427
    index: 0x27
    text: |-
      \Link!\stop
      Te souviens-tu
      de notre fils,
      \col(3)\Child\col(0)? C'est
      un ma\xa9tre
      arboriste
      maintenant!
  - name: TX_4428
    index: 0x28
    text: |-
      \Link!\stop
      Te souviens-tu
      de notre fils,
      \col(3)\Child\col(0)?
      C'est un
      musicien c\xa6l\xa5bre
      maintenant!
  - name: TX_4429
    index: 0x29
    text: |-
      \col(3)\Child\col(0)...
      Il a grandi,
      mais
      il ne fait rien
      de sa vie.\stop
      Que vais-je
      faire?
  - name: TX_442a
    index: 0x2a
    text: |-
      \col(3)\Child\col(0), mon
      fils te conna\xa9t,
      c'est un de tes
      fans, il veut
      devenir un h\xa6ros
      comme toi.
  - name: TX_442b
    index: 0x2b
    text: |-
      Cet enfant a
      des r\xa7ves de
      gloire!!!
  - name: TX_442c
    index: 0x2c
    text: |-
      \col(3)\Child\col(0) a dit
      qu'il \xa6crivait
      une
      chanson sur tes
      aventures!
  - name: TX_442d
    index: 0x2d
    text: |-
      \col(3)\Child\col(0)...
      C'est un adulte,
      mais il ne fait
