  - name: TX_0800
    index: 0x00
    text: |-
      \col(4)Tu es enfin
      arriv\xa6. Quand le
      temple a \xa6t\xa6
      enseveli, je
      pensais pas que
      tu viendrais.
  - name: TX_0801
    index: 0x01
    text: |-
      \col(1)Ce Temple des
      Saisons est
      l'endroit o\xae
      nous, les quatre
      esprits,
      r\xa6sidons.
  - name: TX_0802
    index: 0x02
    text: |-
      \col(2)Cela fait
      longtemps que je
      t'attends.
      Aimes-tu le
      printemps?
      L'\xa6t\xa6? Ou
      l'automne?
  - name: TX_0803
    index: 0x03
    text: |-
      \col(3)Mais, non! Tu
      dois aimer
      l'hiver!\stop
      Va chercher le
      Sceptre des
      Saisons et va
      dans les quatre
      tours!
  - name: TX_0804
    index: 0x04
    text: |-
      \col(3)Merci de ta
      venue, enfant \xa0
      la main b\xa6nie.
      L'Esprit de
      l'hiver
      t'attendait.\stop
      Din est notre
      amie...
      Je vais donner
      le pouvoir de
      l'Esprit de
      l'hiver \xa0 ton
      Sceptre!
      Brandis le
      Sceptre sur une
      souche et les
      saisons
      changeront.\stop
      En hiver, l'eau
      est gel\xa6e et la
      neige tombe...
      Va voir les
      autres esprits.\n
    null_terminator: false
  - name: TX_0805
    index: 0x05
    text: \col(3)\call(TX_080c)
  - name: TX_0806
    index: 0x06
    text: |-
      \col(1)Te voil\xa0,
      adorable h\xa6ros.
      Je suis l'Esprit
      de l'Et\xa6.
      En \xa6t\xa6, les
      lianes poussent
      et les lacs sont
      ass\xa6ch\xa6s.\stop
      les l\xa6gendes
      d'Hyrule disent
      qu'un h\xa6ros avec
      une \sym(0x57) sur la
      main viendra
      sauver le monde.
      Peut-\xa7tre es-tu
      ce h\xa6ros.
      Je vais te
      donner le
      pouvoir de
      l'Esprit de
      l'Et\xa6!
  - name: TX_0807
    index: 0x07
    text: \col(1)\call(TX_080c)
  - name: TX_0808
    index: 0x08
    text: |-
      \col(4)Je suis l'Esprit
      du printemps.\stop
      Les fleurs
      poussent au
      printemps.
      C'est la saison
      de la
      d\xa6couverte.
      Quand je pense
      que je vais
      donner des
      pouvoirs au
      h\xa6ros avec un \sym(0x57)!
      Je te confie le
      pouvoir de
      l'Esprit du
      printemps!
  - name: TX_0809
    index: 0x09
    text: \col(4)\call(TX_080c)
  - name: TX_080a
    index: 0x0a
    text: |-
      \col(4)Je suis l'Esprit
      de l'automne.
      Mon heure est
      venue!
      L'automne n'est
      pas triste!\stop
      Les trous sont
      remplis de
      feuilles et les
      champignons sont
      m\xafrs!\stop
      Quand les
      t\xa6n\xa5bres
      tomberont sur
      Hyrule, un h\xa6ros
      viendra...
      Es-tu ce h\xa6ros?\stop
      Alors je vais te
      donner le
      pouvoir de
      l'automne!
  - name: TX_080b
    index: 0x0b
    text: \col(4)\call(TX_080c)
  - name: TX_080c
    index: 0x0c
    text: Va sauver Din!
  - name: TX_080d
