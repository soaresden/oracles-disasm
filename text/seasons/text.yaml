- group: 0x05
  data:
  - name: TX_0500
    index: 0x00
    text: |-
      C'est horrible,
      \Link!
      Ze-zel-zel...
      \col(3)Zelda\col(0) a quitt\xa6
      le ch\xa1teau
      d'\col(3)Hyrule\col(0) sans
      escorte. Elle va
      venir ici! C'est
      ce pigeon qui
      me l'a dit!
      Il faut que tu
      retrouves \col(3)Zelda\col(0)!
      Vite! Je vais
      voir en ville.\n
    null_terminator: false
  - name: TX_0501
    index: 0x01
    text: |-
      Va voir au
      nord.
  - name: TX_0502
    index: 0x02
    text: |-
      \Link, as-tu
      trouv\xa6 \col(3)Zelda\col(0)?
      C'est une
      catastrophe. Il
      faut vite la
      retrouver!
      \jump(TX_0501)
    null_terminator: false
  - name: TX_0503
    index: 0x03
    text: |-
      \col(3)Zelda\col(0)!
      \col(3)Zelda\col(0)!
  - name: TX_0504
    index: 0x04
    text: |-
      \pos(2)En voil\xa0 de
      beaux
      v\xa7tements...
      Tu dois \xa7tre de
      la noblesse!
      Rubis, bijoux!
      Je veux tout!
      Donne-moi
      tout!
  - name: TX_0505
    index: 0x05
    text: |-
      \pos(1)Toi... Tu es
      ce gar\xa4on! Ne me
      dis pas que tu
      m'as suivi
      depuis \col(3)Labrynna\col(0)
      jusqu'\xa0 cet
      endroit! Tu veux
      me stopper? Je
      ne te laisserai
      pas faire!
      Cette fois, tu
      vas d\xa6guster!
      Prends-\xa4a!
  - name: TX_0506
    index: 0x06
    text: |-
      \pos(2)Non!!! Je m'en
      souviendrai!
  - name: TX_0507
    index: 0x07
    text: |-
      Merci de m'avoir
      tir\xa6e d'affaire!
      Je m'appelle
      \col(3)Zelda\col(0).
      Tu dois \xa7tre
      \Link. Je
      l'ai su d\xa5s le
      premier regard.
  - name: TX_0508
    index: 0x08
    text: |-
      \pos(0)Princesse
      \col(3)Zelda\col(0)!
      Dieu soit lou\xa6,\x20
      vous \xa7tes sauve!
      Quel bazar!
      Pourquoi avez-
      vous quitt\xa6 le
      ch\xa1teau seule?\x20
  - name: TX_0509
    index: 0x09
    text: |-
      \pos(0)J'ai fait un
      cauchemar!
      \Link a \xa6t\xa6
      attaqu\xa6 par une
      grande ombre...
      Je devais faire
      quelque chose...
      \Link, tu
      peux s\xafrement
      garder \xa4a
      pour moi.
  - name: TX_050a
    index: 0x0a
    text: |-
      \pos(0)Mon dieu!\stop
      C'est trop
      dangereux pour
      vous ici. Allons
      plut\xd0t \xa0 mon
      refuge.
  - name: TX_050b
    index: 0x0b
    text: |-
      Bienvenue,
      \Link.
  - name: TX_050c
    index: 0x0c
    text: |-
      \call(TX_050b)\stop
      Tu es fatigu\xa6.
      Ferme les yeux
      un moment...
  - name: TX_050d
    index: 0x0d
    text: \call(TX_050b)\stop\n
    null_terminator: false
  - name: TX_050e
    index: 0x0e
    text: |-
      Reviens d\xa5s que
      tu seras las.
- group: 0x06
  data:
  - name: TX_0600
    index: 0x00
    text: |-
      \col(3)Princesse Zelda\col(0)!\stop
      Est-elle en
      s\xa6curit\xa6? Elle
      est tellement
      t\xa7te en l'air.
  - name: TX_0601
    index: 0x01
    text: |-
      J'aimerais me
      marier avec la
      \col(3)Princesse
      Zelda\col(0).
  - name: TX_0602
    index: 0x02
    text: |-
      Chut! J'\xa6coute
