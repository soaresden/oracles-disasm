      peuvent fondre
      tous les
      m\xa6taux!
  - name: TX_2703
    index: 0x03
    text: |-
      Je suis en train
      de fondre et
      m\xa6langer deux
      types de
      minerai.
  - name: TX_2704
    index: 0x04
    text: |-
      Tu peux acc\xa6der
      au \x1atemple\x1a du
      nord d'ici.
  - name: TX_2705
    index: 0x05
    text: |-
      Nous ramassons
      du minerai pour
      le faire fondre
      dans les
      forges.
  - name: TX_2706
    index: 0x06
    text: |-
      Le minerai est
      en morceaux.
  - name: TX_2707
    index: 0x07
    text: |-
      Je veux briser
      ces rocs pleins
      de minerai, mais
      ils sont trop
      durs.
      Un \col(1)Chou P\xa6teur\col(0)
      pourrait le
      faire, mais
      ils ne sont
      pas en fleur.
      Il para\xa9t qu'il
      y en a un vers
      le sud.
  - name: TX_2708
    index: 0x08
    text: |-
      Oh! C'est un
      \col(1)Chou P\xa6teur\col(0)!
      Merci! OK,
      je vais tout
      casser!
  - name: TX_2709
    index: 0x09
    text: |-
      C'est g\xa6nial!
      Nous en avons
      plein, merci \xa0
      toi. Si tu as
      besoin de
      minerai fondu,
      viens aux
      forges.
  - name: TX_270a
    index: 0x0a
    text: |-
      Tu nous as
      aid\xa6s, tu peux
      venir nous voir
      si tu as besoin
      de minerai
      fondu.
  - name: TX_270b
    index: 0x0b
    text: |-
