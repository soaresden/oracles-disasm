  - name: TX_0015
    index: 0x15
    text: |-
      \pos(2)\slow()Vous obtenez
      le \col(1)Cycle des
      Saisons\col(0),
      une Essence
      de la Nature!\stop
      Au printemps,
      on s\xa5me.
      En \xa6t\xa6,
      c'est la\x20
      croissance.
      A l'automne,
      les fruits
      sont gros.
      En hiver
      vient le
      sommeil.\stop
      C'est le cycle
      de la vie...
      Le \col(1)Cycle des
      Saisons\col(0)!
