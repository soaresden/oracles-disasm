- group: 0x01
  data:
  - name: TX_0100
    index: 0x00
    text: |-
      Voici la salle
      de danse de
      Subrosia. Il y
      a un concours.
      Nous nous
      entra\xa9nons.
      Veux-tu te
      joindre \xa0 nous?
        \opt()Oui \opt()Non
  - name: TX_0101
    index: 0x01
    text: |-
      Nous allons nous
      entra\xa9ner.
      Veux-tu te
      joindre \xa0 nous?
        \opt()Oui \opt()Non
  - name: TX_0102
    index: 0x02
    text: |-
      Alors viens
      dans le cercle.
  - name: TX_0103
    index: 0x03
    text: |-
      Reviens quand
      tu le d\xa6sires.
  - name: TX_0104
    index: 0x04
    text: |-
      T'es nul!
      D\xa6gage de l\xa0!
  - name: TX_0105
    index: 0x05
    text: |-
      Fais comme
      moi. Quand je
      dis \x1adoo\x1a, un
      pas \xa0 droite.
  - name: TX_0106
    index: 0x06
    text: |-
      Si c'est \x1adah\x1a,
      un pas \xa0 gauche.
  - name: TX_0107
    index: 0x07
    text: |-
      Si c'est \x1adee\x1a,
      Fais une pose.
  - name: TX_0108
    index: 0x08
    text: |-
      Fais attention
      et ne bouscule
      pas les autres.
      Compris?
        \opt()Oui \opt()Heu...
  - name: TX_0109
    index: 0x09
    text: OK! C'est parti!
  - name: TX_010a
    index: 0x0a
    text: |-
      T'es assez fort!
      T'es le meilleur
      danseur de la
      journ\xa6e! Voici
      ton prix!
  - name: TX_010b
    index: 0x0b
    text: |-
      Chut! On
      commence!
  - name: TX_010c
    index: 0x0c
    text: Silence!
  - name: TX_010d
    index: 0x0d
    text: |-
      Aujourd'hui je
      vais gagner,
      c'est s\xafr!
  - name: TX_010e
    index: 0x0e
    text: |-
      Je vais gagner
      le concours de
      Danse et
      impressionner
      \col(3)Rosa\col(0)!
  - name: TX_010f
    index: 0x0f
    text: |-
      La danse de
      Subrosia est
      une tradition
      ancienne de
      \col(3)Subrosia\col(0).
  - name: TX_0110
    index: 0x10
    text: |-
      La danse de
      Subrosia est
      vraiment cool!
  - name: TX_0111
    index: 0x11
    text: |-
      \x1aDoo\x1a \xa0 droite,
      \x1adah\x1a \xa0 gauche.
  - name: TX_0112
    index: 0x12
    text: |-
      Presser \abtn pour
      poser sur \x1adee\x1a.
  - name: TX_0113
    index: 0x13
    text: |-
      Si vous \xa7tes \xa6lu
      plusieurs fois,
      vous gagnerez un
      truc g\xa6nial.
  - name: TX_0114
    index: 0x14
    text: |-
      ...Alors entre
      dans le cercle.
  - name: TX_0115
    index: 0x15
    text: |-
      Besoin de
      renseignements?
        \opt()Non \opt()Oui
