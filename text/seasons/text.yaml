      lui ai dit
      que c'\xa6tait
      dangeureux
      au-del\xa0 du
      village, mais
      elle est quand
      m\xa7me partie.
  - name: TX_0f04
    index: 0x04
    text: |-
      Il y a huit
      choses appel\xa6es
      \col(1)essences\col(0)
      cach\xa6es dans
      ce royaume.
      Que se passera-
      t-il si elles
      sont r\xa6unies?
  - name: TX_0f05
    index: 0x05
    text: |-
      Combien de temps
      les saisons vont
      rester comme \xa4a?
      Ca me rend si
      d\xa6prim\xa6.
  - name: TX_0f06
    index: 0x06
    text: |-
      Je me sens
      mieux gr\xa1ce
      \xa0 la \col(3)Princesse
      Zelda\col(0)!
  - name: TX_0f07
    index: 0x07
    text: |-
      La \col(3)Princesse
      Zelda\col(0) a \xa6t\xa6
      enlev\xa6e par
      un monstre.
      Que va-t-il se
      passer
      maintenant?
  - name: TX_0f08
    index: 0x08
    text: |-
      Je suis heureux
      que le village
      soit redevenu
      normal!
      Mais qui a
      chang\xa6 les
      saisons et
      pourquoi?
- group: 0x10
  data:
  - name: TX_1000
    index: 0x00
    text: |-
      Connais-tu la
      \col(3)Grotte du H\xa6ros\col(0)
      pr\xa5s de la c\xd0te
      ouest?
      Il para\xa9t que
      l'\col(1)Ep\xa6e du H\xa6ros\col(0)
      y est cach\xa6e.
      Personne ne
      l'a jamais
      trouv\xa6e.
  - name: TX_1001
    index: 0x01
    text: |-
      Il y a une
      \col(3)Racine G\xa6ante\col(0)
      au nord de la
      ville...
  - name: TX_1002
    index: 0x02
    text: |-
      Le paysage \xa0
      l'est est vert!
      J'irais le
      peindre si
      j'\xa6tais plus
      jeune...
  - name: TX_1003
    index: 0x03
    text: |-
      Voir des
      paysages sous
      des saisons
      diff\xa6rentes est
      tr\xa5s agr\xa6able...
  - name: TX_1004
    index: 0x04
    text: |-
      J'ai r\xa6cemment
      vu une nouvelle
      fille.
      Est-elle de
      la ville?
  - name: TX_1005
    index: 0x05
    text: |-
      Au nord se
      trouve un lieu
      magique qui
      stoppe tous
      ceux qui veulent
      s'en approcher.\stop
      Mais je n'y
      suis jamais
      all\xa6.
  - name: TX_1006
    index: 0x06
    text: |-
      Avant, notre
      gardien avait
      tellement
      grandi...
      Voil\xa0 qui est
      bien \xa6trange.
  - name: TX_1007
    index: 0x07
    text: |-
      \col(3)Zelda\col(0) est avec
      toi.\stop
      Tout va bien se
      passer, alors.
  - name: TX_1008
    index: 0x08
    text: |-
      C'\xa6tait mon
      dernier espoir.
      Mais maintenant
      que \col(3)Zelda\col(0) a
      \xa6t\xa6 kidnapp\xa6e,
      il est trop
      tard...
  - name: TX_1009
    index: 0x09
    text: |-
      Les saisons sont
      redevenues
      normales.
      C'est un autre
      don du gardien
      de la ville!
- group: 0x11
  data:
  - name: TX_1100
    index: 0x00
    text: |-
      Notre gardien,
      l'\col(3)Arbre Bojo\col(0),
      se trouve
      derri\xa5re la
      porte \xa0 l'est de
      notre ville.\stop
      On dit qu'un
      h\xa6ros arm\xa6 d'une
      \col(1)\xa6p\xa6e\col(0) viendra
      lui parler.
      Je me demande
      si c'est
      vrai...
  - name: TX_1101
    index: 0x01
    text: |-
      Le monde est
      si vaste...
      Ici, dans le
      \col(3)Village Horon\col(0),
      les saisons sont
      devenues folles.
      Je me demande
      s'il se passe la
      m\xa7me chose dans
      les autres
      pays...
  - name: TX_1102
    index: 0x02
    text: |-
      On raconte
      qu'il y a un
      \xa6trange objet
      cach\xa6 au fond
      du \col(3)Fort\col(0)
      \col(3)de Moblin\col(0).
  - name: TX_1103
    index: 0x03
    text: |-
      Les nuages au
      nord bougent
      bizarrement.
      J'ai un mauvais
      pressentiment...
  - name: TX_1104
    index: 0x04
    text: |-
      Je savais que
      quelque chose
      de grave allait
      se passer...
  - name: TX_1105
    index: 0x05
    text: |-
      Apr\xa5s des
      \xa6v\xa6nements
      comme ceux-ci,
      j'appr\xa6cie
      vraiment les
      dons de la
      nature.
- group: 0x12
  data:
  - name: TX_1200
    index: 0x00
    text: |-
      On passe du
      chaud au froid
      d'un coup.
      Les saisons sont
      en d\xa6sordre!
      Que va-t-il
      arriver aux
      r\xa6coltes de
      cette ann\xa6e..?
  - name: TX_1201
    index: 0x01
    text: |-
      Connais-tu les
      \col(1)anneaux\col(0)
      magiques?
        \opt()Oui \opt()Non
  - name: TX_1202
    index: 0x02
    text: |-
      Vraiment?
      La bague de
      mariage de mon
      grand-p\xa5re me
      suffit.
  - name: TX_1203
    index: 0x03
    text: |-
      Ben... Si tu ne
      portes pas tes
      \col(1)anneaux\col(0), leurs
      pouvoirs ne
      seront pas
      activ\xa6s.
      Si tu veux en
      savoir plus, va
      voir le
      joaillier.
  - name: TX_1204
    index: 0x04
    text: |-
      Au nord vit un
      monstre horrible
      inconnu.
      L'as-tu d\xa6j\xa0
      vu?
  - name: TX_1205
    index: 0x05
    text: |-
      J'ai beau
      labourer mes
      champs, ma
      moisson ne
      pousse pas...
  - name: TX_1206
    index: 0x06
    text: |-
      Je dois me
      pr\xa6parer pour
      le jour o\xae
      \col(3)Zelda\col(0)
      reviendra.
  - name: TX_1207
    index: 0x07
    text: |-
      Qu'est-ce qui
      va arriver \xa0 ce
      monde?
  - name: TX_1208
    index: 0x08
    text: |-
      La vie est
      revenue dans
      notre pays!
      Nos r\xa6coltes
      sont sauv\xa6es!
- group: 0x13
  data:
  - name: TX_1300
    index: 0x00
    text: |-
      Si tu te mets
      dans cette
      fleur,
      tu pourras
      sauter sur la
      falaise!
      Ca ne marche
      qu'au printemps,
      quand les
      fleurs s'ouvrent
      au soleil!
  - name: TX_1301
    index: 0x01
    text: |-
      Ce n'est qu'un
      bourgeon, mais
      il deviendra une
      belle fleur au
      printemps.
      Si tu montes
      sur cette
      fleur...!
  - name: TX_1302
    index: 0x02
    text: |-
      Cette fleur est
      g\xa6niale! Au
      printemps elle
      peut te
      propulser en
      l'air!
  - name: TX_1303
    index: 0x03
    text: |-
      Je suis fatigu\xa6
      de jouer avec
      cette fleur.
  - name: TX_1304
    index: 0x04
    text: |-
      He! Viens!
      Joue avec moi!
- group: 0x14
  data:
  - name: TX_1400
    index: 0x00
    text: |-
      Voici la
      demeure des
      \col(3)Oizosaitout\col(0).
      Va les voir si
      tu as des
      questions!
  - name: TX_1401
    index: 0x01
    text: |-
      Les saisons
      changent comme
      le vent ici.
      C'est
      \xa6trange...
  - name: TX_1402
    index: 0x02
    text: |-
      Connais-tu les
      Pierres-Hibous?
        \opt()Oui \opt()Non
  - name: TX_1403
    index: 0x03
    text: |-
      J'le savais!
      C'est un truc
      tr\xa5s c\xa6l\xa5bre
      aujourd'hui.
  - name: TX_1404
    index: 0x04
    text: |-
      Ahem! Alors je
      vais
      t'expliquer.\stop
      Les
      Pierres-Hiboux
      sont des statues
      magiques qui
      donnent des
      conseils si on y
      met une \col(1)graine\col(0).\n
  - name: TX_1405
    index: 0x05
    text: |-
      Quand j'serais
      grand...\stop
      J'irais casser
      la figure du
      g\xa6n\xa6ral super
      m\xa6chant!
  - name: TX_1406
    index: 0x06
    text: |-
      Ils disent
      qu'une princesse
      nomm\xa6e \col(3)Zelda\col(0)
      vit loin d'ici.
      Je r\xa7ve de la
      rencontrer. Je
      me demande si
      elle danse
      aussi bien que
      \col(3)Din\col(0)?
  - name: TX_1407
    index: 0x07
    text: |-
      Voir la
      \col(3)Princesse
      Zelda\col(0) me rend
      super content.
  - name: TX_1408
    index: 0x08
    text: |-
      Donne-m'en
      un, s'teup!
  - name: TX_1409
    index: 0x09
    text: |-
      C'est atroce!
      La \col(3)Princesse
      Zelda\col(0) est
      partie!
      Mes r\xa7ves se
      sont envol\xa6s!!!
- group: 0x15
  data:
  - name: TX_1500
    index: 0x00
    text: |-
      Dans le quartier
      ouest de la
      ville se
      trouvent
      les \col(3)Oizosaitout\col(0).
      Va les voir si
      tu as des
      questions.
  - name: TX_1501
    index: 0x01
    text: |-
      Tu peux br\xafler
      des branches!
      Fais attention
      avec les
      flammes!
  - name: TX_1502
    index: 0x02
    text: |-
      Certains arbres
      ont des \col(1)graines\col(0)
      pendant d'autres
      saisons que le
      printemps.
  - name: TX_1503
    index: 0x03
    text: |-
      J'esp\xa5re que ma
      s\xadur va mieux.\stop
      Elle a dit
      qu'elle
      cherchait
      quelqu'un, mais
      avec le village
      dans cet \xa6tat,
      je suis tr\xa5s
      inquiet.
  - name: TX_1504
    index: 0x04
    text: |-
      Mon chien
      s'appelle Flash!
      Il est bon pour
      ramener la
      baballe!
  - name: TX_1505
    index: 0x05
    text: |-
      On raconte qu'un
      sauveur est
      arriv\xa6 au
      village!
      Qui cela peut
      \xa7tre?
  - name: TX_1506
    index: 0x06
    text: |-
      Ces adultes
      crient et
      hurlent \xa0 propos
      d'un truc, mais
      je ne sais pas
      quoi!
- group: 0x16
  data:
  - name: TX_1600
    index: 0x00
    text: |-
      Voici le \col(3)Village
      Horon\col(0)!\stop
      H\xa6! Je ne te
      connais pas.
      L'\col(3)Arbre Bojo\col(0)?
      Va vers l'est.
  - name: TX_1601
    index: 0x01
    text: |-
      Les saisons sont
      en d\xa6sordre.
      C'est mauvais
      pour ma peau...
  - name: TX_1602
    index: 0x02
    text: |-
      Les terres en
      dehors du
      village sont
      infest\xa6es
      de monstres!
      Je suis trop
      peureuse pour
      y aller seule!
  - name: TX_1603
    index: 0x03
    text: |-
      J'ai une
      \col(1)Carte de Membre\col(0).
      Ce truc me
      rend dingue!
  - name: TX_1604
    index: 0x04
    text: |-
      Je suis pour la
      paix dans le
      monde. J'en ai
      marre des trucs
      m\xa6chants et
      bizarres qui
      arrivent.
  - name: TX_1605
    index: 0x05
    text: |-
      Je dois voir la
      \col(3)Princesse Zelda\col(0)!
      J'ai toujours de
      l'espoir!
  - name: TX_1606
    index: 0x06
    text: |-
      C'est NUL! La
      \col(3)Princesse Zelda\col(0)
      a \xa6t\xa6 kidnapp\xa6e!
      Qu'allons-nous
      faire?
  - name: TX_1607
    index: 0x07
    text: |-
      Voici le \col(3)Village
      Horon\col(0)! H\xa6!
      Ca fait tr\xa5s
      longtemps que je
      ne t'avais vu!
- group: 0x17
  data:
  - name:
    - TX_1700
    - TX_171b
    index:
    - 0x00
    - 0x1b
    text: |-
      \pos(2)Hwaaa......
      Qui c'est?\stop
      Tu m'as
      r\xa6veill\xa6?
      Qui es-tu?\stop
      Hmm... Quoi?!?\stop
      \col(3)Din\col(0) a \xa6t\xa6
      captur\xa6e pendant
      mon sommeil?
      Le \col(3)Temple des
      Saisons\col(0) a
      disparu?!?
      Quelle horreur!
      C'est mon devoir
      de prot\xa6ger
      l'oracle...\stop
      Je crois que je
      suis trop
      vieux!
  - name:
    - TX_1701
    - TX_171c
    index:
    - 0x01
    - 0x1c
    text: |-
      \pos(2)Que dois-je
      faire, \Link?
      Les saisons sont
      en d\xa6sordre, ce
      pays est
      d\xa6pourvu des
      Essences de la
      Nature, mon
      pouvoir diminue!
      Peux-tu sauver
      \col(3)Din\col(0) \xa0 ma place?
      Ce sont l\xa0 les
      seules demandes
      de l'\col(3)Arbre Bojo\col(0)!\stop
      Je sens le Mal
      vers le \col(3)Pic du
      nord\col(0), l\xa0 o\xae se
      trouvait le
      \col(3)Temple des
      Saisons\col(0)!
      \col(3)Onox\col(0) a jet\xa6 un
      voile de
      t\xa6n\xa5bres sur le
      \col(3)Pic du nord\col(0).
      Tu le trouveras
      l\xa0-bas.
      Il te faut les
      huit \col(1)Essences de
      la Nature\col(0) qui
      reposent en
      \col(3)Holodrum\col(0).
      C'est ta seule
      chance. Les
      \col(1)essences\col(0) sont le
      pouvoir sacr\xa6 de
      la nature. Elles
      te permettront
      de franchir la
      barri\xa5re de
      t\xa6n\xa5bres et de
      sauver \col(3)Din\col(0).\stop
      Dois-je r\xa6p\xa6ter?
        \opt()Oui \opt()Non
  - name:
    - TX_1702
    - TX_171d
    index:
    - 0x02
    - 0x1d
    text: |-
      \pos(2)Prends cette
      \col(1)cl\xa6\col(0).
      Va \xa0 la \col(3)racine
      g\xa6ante\col(0) pr\xa5s du
      lac au nord!\stop
      La premi\xa5re
      \col(1)essence\col(0) devrait
      s'y trouver,
      mais elle est
      prot\xa6g\xa6e.
      Sois prudent!
      Je vais me
      reposer jusqu'\xa0
      ... Ahmm...
      Plus de
      force... RZZZ
  - name:
    - TX_1703
    - TX_171e
    index:
    - 0x03
    - 0x1e
    text: |-
      \pos(2)Hwaaah...
      La \col(3)racine
      g\xa6ante\col(0)!
      Fais attention.
      Hohhm___ RZZZ
  - name:
    - TX_1704
    - TX_171f
    index:
    - 0x04
    - 0x1f
    text: |-
      Hwaaah...
      Je suis l'\col(3)Arbre
      Bojo\col(4).
      Un peu de \col(2)Terre
      Fertile\col(4) est
      revenue. Je me
      sens un peu
      mieux.\stop
      Dans mes r\xa7ves,
      j'ai vu le
      \col(3)Temple des
      Saisons\col(4) dans un
      \xa6trange pays
      inconnu.
      J'ai aussi vu un
      objet pr\xa6cieux
      qui t'aidera,
      \Link.
      C'est tout ce
      que je vois...
      Hohm...hmm...
  - name:
    - TX_1705
    - TX_1720
    index:
    - 0x05
    - 0x20
    text: |-
      \pos(2)Hwaah...
      Le \col(3)Temple des
      Saisons\col(0), \Link.
      Objet pr\xa6cieux
      et tr\xa5s utile...
  - name:
    - TX_1706
    - TX_1721
    index:
    - 0x06
    - 0x21
    text: |-
      \pos(2)Hwaah...
      Utilise le
      \col(1)Sceptre des
      Saisons\col(0). Va vers
      la for\xa7t de
      l'est! Hohhm...
  - name:
    - TX_1707
    - TX_1722
    index:
    - 0x07
    - 0x22
    text: |-
      Merci, \Link.\stop
      J'ai aussi re\xa4u
      un peu du \col(2)Don du
      Temps\col(4)!
      J'ai r\xa7v\xa6 des
      \col(3)Marais Boueux\col(4) \xa0
      l'ouest. Il y a
      quelque chose
      l\xa0-bas.\stop
      Je ne vois plus
      rien...
      Hohhm...
  - name:
    - TX_1708
    - TX_1723
    index:
    - 0x08
    - 0x23
    text: |-
      \pos(2)Hwaah...
      \col(3)Marais Boueux\col(0) \xa0
      l'ouest. Quelque
      chose... RZZZ
  - name: TX_1709
    index: 0x09
    text: |-
      Hwaah...\stop
      Merci, \Link.
      Je peux sentir
      le \col(2)Soleil
      Brillant\col(4)!\stop
      J'ai r\xa7v\xa6 d'une
      cascade dans la
      montagne au nord
      de la \col(3)Cit\xa6
      Engloutie\col(4).
      Tu y trouveras
      une autre
      \col(2)essence\col(4)...
  - name: TX_170a
    index: 0x0a
    text: |-
      \pos(2)Hyaah...
      \call(TX_1725)
      Hohhm...
      RZZZ...
  - name: TX_170b
    index: 0x0b
    text: |-
      Oh, \Link...
      \call(TX_1726)
      Hohhm...
      RZZZ...
  - name: TX_170c
    index: 0x0c
    text: |-
      \pos(2)Hwaah...
      \call(TX_1727)
      Hohhm...
      RZZZ...
  - name: TX_170d
    index: 0x0d
    text: |-
      Hwaah...
      \call(TX_1728)
      Hohhm...
      RZZZ...
  - name: TX_170e
    index: 0x0e
    text: |-
      \pos(2)Hwaah...
      \call(TX_1729)
      Hohhm..
      RZZZ...
  - name: TX_170f
    index: 0x0f
    text: |-
      Oh, \Link...\stop
      \call(TX_172a)
      Hohhm...
      RZZZ...
  - name: TX_1710
    index: 0x10
    text: |-
      \call(TX_172b)Hohhm...
      RZZZ...
  - name: TX_1711
    index: 0x11
    text: |-
      \pos(2)Hwaah...
      \call(TX_172c)
      Hohhm...
      RZZZ...
  - name: TX_1712
    index: 0x12
    text: |-
      \call(TX_172d)
      Hohhm...
      RZZZ...
  - name: TX_1713
    index: 0x13
    text: |-
      \pos(2)Hwaah...\stop
      \call(TX_172e)
      Hohhm...
      RZZZ...
  - name: TX_1714
    index: 0x14
    text: |-
      Hwaah...
      \call(TX_172f)
      Merci, mes
      forces
      reviennent!
      Bonne chance,
      \Link!
  - name: TX_1715
    index: 0x15
    text: |-
      \pos(2)\Link! C'est
      la derni\xa5re
      \col(1)Essence de la
      Nature\col(0)!
  - name:
    - TX_1716
    - TX_1731
    index:
    - 0x16
    - 0x31
    text: |-
      \Link! Tu as les
      huit \col(2)Essences\col(4)!
      Le \col(2)Cycle des
      Saisons\col(4) m'a
      redonn\xa6 des
      forces!
      J'ai quelque
      chose \xa0 te
      donner, reviens
      me voir!
  - name:
    - TX_1717
    - TX_1732
    index:
    - 0x17
    - 0x32
    text: |-
      \pos(2)\Link!\stop
      Tu as enfin les
      huit \col(1)Essences de
      la Nature\col(0).
      Tu es devenu un
      vrai h\xa6ros qui
      comprend les
      \col(1)Essences de la
      Nature\col(0).
      Tu es le
      bouclier de
      l'espoir!
      Prends cette
      \col(1)graine\col(0)!
  - name: TX_1718
    index: 0x18
    text: |-
      \pos(2)\Link!
      Tu vas pouvoir
      vaincre \col(3)Onox\col(0), le
      G\xa6n\xa6ral des
      T\xa6n\xa5bres, et
      lib\xa6rer \col(3)Din\col(0),
      l'Oracle des
      Saisons!
  - name:
    - TX_1719
    - TX_1734
    index:
    - 0x19
    - 0x34
    text: |-
      \pos(1)Gwah, hah,
      hah!
      Un h\xa6ros?
      Ca?!!!
  - name:
    - TX_171a
    - TX_1735
    index:
    - 0x1a
    - 0x35
    text: |-
      \pos(3)Viens si tu
      l'oses, \Link!
      Si c'est toi le
      h\xa6ros, alors mes
      pouvoirs
      t\xa6n\xa5breux sont
      invincibles.
      Gwah, hah, hah!
  - name: TX_1724
    index: 0x24
    text: |-
      Merci, \Link!
      Je sens le
      \col(2)Soleil Brillant\col(4).
      Mais les
      t\xa6n\xa5bres sont
      toujours l\xa0...
      Et elles
      grandissent...
      Comment se
      fait-il?\stop
      \Link!\stop
      J'ai r\xa7v\xa6 de la
      cascade dans la
      montagne au nord
      de la \col(3)Cit\xa6
      Engloutie\col(4).
      Peut-\xa7tre c'est
      l\xa0 que se trouve
      la prochaine
      \col(2)essence\col(4)...
  - name: TX_1725
    index: 0x25
    text: |-
      \pos(2)Quelque chose
      ne va pas dans
      les montagnes au
      nord de la \col(3)Cit\xa6
      Engloutie\col(0).
  - name: TX_1726
    index: 0x26
    text: |-
      Je grandis gr\xa1ce
      \xa0 la \col(2)Pluie\col(4)! \stop
      J'ai eu une
      autre vision.
      J'ai vu un lac
      en forme de
      monocle...
  - name: TX_1727
    index: 0x27
    text: |-
      \pos(2)J'ai vu un
      lac dans mes
      r\xa7ves...
  - name: TX_1728
    index: 0x28
    text: |-
      La \col(2)Chaleur
      Nourrissante\col(4) me
      fait du bien!
      J'ai r\xa7v\xa6 d'une
      cascade dans les
      montagnes au
      nord de la \col(3)Cit\xa6
      Engloutie\col(4)...
      Il doit y avoir
      quelque chose,
      l\xa0-bas...
  - name: TX_1729
    index: 0x29
    text: |-
      \pos(2)J'ai r\xa7v\xa6
      d'une cascade
      dans les
      montagnes au
      nord de la \col(3)Cit\xa6
      Engloutie\col(0)...
      Il doit y avoir
      quelque chose,
      l\xa0-bas...
  - name: TX_172a
    index: 0x2a
    text: |-
      La \col(2)Chaleur
      Nourrissante\col(4) m'a
      redonn\xa6 des
      forces!
      J'ai vu en r\xa7ve
      \Link dans des
      vastes ruines.
      Il y a peut-\xa7tre
      une \col(2)essence\col(4)
      l\xa0-bas.
  - name: TX_172b
    index: 0x2b
    text: |-
      J'ai r\xa6cup\xa6r\xa6
      des forces avec
      la \col(2)Pluie
      Appaisante\col(4)!\stop
      J'ai r\xa7v\xa6 de
      \Link explorant
      des ruines. Il y
      a peut-\xa7tre une
      \col(2)essence\col(4) cach\xa6e
      l\xa0-bas.
  - name: TX_172c
    index: 0x2c
    text: |-
      \pos(2)Une
      \col(1)essence\col(0)...
      Des ruines...
  - name: TX_172d
    index: 0x2d
    text: |-
      \Link!\stop
      Le \col(2)Souffle du
      Vent\col(4) me rend
      plus fort!
      J'ai r\xa7v\xa6 d'un
      cimeti\xa5re \xa0
      l'ouest du
      \col(3)Village Horon\col(4).
      Y aurait-il une
      \col(2)essence\col(4)?
      Va l\xa0-bas,
      franchis la
      mer.
  - name: TX_172e
    index: 0x2e
    text: |-
      \pos(2)Il est
      possible qu'une
      \col(1)essence\col(0) soit
      cach\xa6e dans le
      cimeti\xa5re?
      Mais comment
      franchir la
      mer?
  - name: TX_172f
    index: 0x2f
    text: |-
      \Link!\stop
      La \col(2)Graine de Vie\col(4)
      m'a redonn\xa6 des
      forces!
      Il ne reste que
      la derni\xa5re
      \col(2)Essence de la
      Nature\col(4)!
      Mais, cette
      fois, je n'ai
      pas fait de
      r\xa7ve...
      Je te fais
      confiance,
      \Link.
      Elle doit \xa7tre
      quelque part en
      \col(3)Holodrum\col(4).
      Bonne chance!
  - name: TX_1730
    index: 0x30
    text: |-
      \pos(2)\Link!\stop
      Il ne te manque
      que la derni\xa5re
      \col(1)Essence de la
      Nature\col(0)!
      Je compte sur
      toi, \Link!
      Elle est cach\xa6e
      en \col(3)Holodrum\col(0).
      Bonne chance!
  - name: TX_1733
    index: 0x33
    text: |-
      \pos(2)\Link,
      tu dois d'abord
      vaincre \col(3)Onox\col(0),
      le G\xa6n\xa6ral des
      T\xa6n\xa5bres, et
      sauver l'Oracle
      des Saisons,
      \col(3)Din\col(0)!
      Avec l'aide de
      \col(3)Din\col(0), tu pourras
      atteindre
      \col(3)Twinrova\col(0)!\stop
      Bonne chance,
      \Link!
  - name: TX_1736
    index: 0x36
    text: |-
      Cet objet est le
      \col(2)Sceptre des
      Saisons\col(4)!
      De nouveaux
      chemins vont
      s'ouvrir \xa0 toi!
      J'ai r\xa7v\xa6 d'une
      for\xa7t, \xa0
      l'est...
      Il se peut qu'il
      y ait une
      \col(2)essence\col(4) l\xa0-bas!
      \Link, peux-tu y
      aller?
  - name: TX_1737
    index: 0x37
    text: |-
      \pos(2)Vite, \Link!\stop
      Les t\xa6n\xa5bres
      s'\xa6tendent!
      Tu dois arriver
      \xa0 l'entr\xa6e de
      l'antre de
      \col(3)Twinrova\col(0)!
      La \col(3)Princesse
      Zelda\col(0) a besoin
      de toi!
  - name: TX_1738
    index: 0x38
    text: |-
      \pos(2)\Link! Ne te
      laisse pas
      abuser par les
      pi\xa5ges de
      \col(3)Twinrova\col(0)!\stop
      Ce qui semble
      facile ne l'est
      peut-\xa7tre pas!\stop
      Vite, \Link!
      Les t\xa6n\xa5bres
      grandissent de
      plus en plus!
      Le passage dans
      mes racines te
      m\xa5nera au
      repaire de
      \col(3)Twinrova\col(0)!
      Bonne chance,
      \Link!
  - name: TX_1739
    index: 0x39
    text: |-
      \pos(2)Hwaah...
      \Link!
      La paix est
      revenue en
      \col(3)Holodrum\col(0), je
      vais pouvoir
      me reposer!
- group: 0x18
  data:
  - name: TX_1800
    index: 0x00
    text: |-
      Mon mari \xa6tait
      un plongeur!
      Mais il est
      vieux
      maintenant, il
      a cach\xa6 son
      \xa6quipement de
      plong\xa6e
      quelque part.
  - name: TX_1801
    index: 0x01
    text: |-
      As-tu vu mon
      mari? Je savais
      qu'il t'aimerait
      bien.
  - name: TX_1802
    index: 0x02
    text: |-
      La ville est si
      tranquille...
      Que s'est-il
      pass\xa6?
  - name: TX_1803
    index: 0x03
    text: |-
      Il para\xa9t que
      l'\col(3)Arbre Bojo\col(0) du
      \col(3)Village Horon\col(0)
      a des \col(1)graines
      magiques\col(0).\stop
      Je me demande
      quel type de
      \col(1)graines\col(0) il a?
  - name: TX_1804
    index: 0x04
    text: |-
      Le V\xa6n\xa6rable
      \col(3)Arbre Bojo\col(0) du
      \col(3)Village Horon\col(0)!
      S'il te pla\xa9t,
      sauve \col(3)Zelda\col(0)!
  - name: TX_1805
    index: 0x05
    text: |-
      Mon mari est
      finalement
      revenu \xa0 la
      maison!
- group: 0x19
  data:
  - name: TX_1900
    index: 0x00
    text: |-
      Mon papa est un
      super plongeur!
      Il connaissait
      un super endroit
      pour faire de la
      plong\xa6e! Mais il
      ne me l'a jamais
      montr\xa6.\stop
      C'est pas\stop
      gentil.
  - name: TX_1901
    index: 0x01
    text: |-
      Je vais trouver
      son endroit
      secret! Tu ne le
      connais pas,
      n'est-ce pas?
  - name: TX_1902
    index: 0x02
    text: |-
      P\xd0pa m'a enfin
      approuv\xa6 comme
      plongeur. Il va
      me montrer son
      secret! Je vais
      enfin pouvoir
      \xa7tre le nouveau
      ma\xa9tre!
  - name: TX_1903
    index: 0x03
    text: |-
      Derni\xa5rement,
      des monstres se
      sont install\xa6s
      dans le village.
      Il se sont pos\xa6s
      ici, pour
      fabriquer des
      \col(1)bombes\col(0)...
  - name: TX_1904
    index: 0x04
    text: |-
      Et voil\xa0, c'est
      mon heure de
      gloire et la
      \col(3)Princesse Zelda\col(0)
      se fait
      kidnapper?\stop
      Je suis si
      inquiet que je
      ne peux pas
      nager!
  - name: TX_1905
    index: 0x05
    text: |-
      Je vais
      apprendre
      \xa0 retenir mon
      souffle comme
      mon p\xd0pa
      faisait!
- group: 0x1a
  data:
  - name: TX_1a00
    index: 0x00
    text: |-
      Il para\xa9t
      qu'il y a
      une cr\xa6ature
      qui remonte
      les cascades!
      A quoi peut-elle
      bien ressembler?
  - name: TX_1a01
    index: 0x01
    text: |-
      J'en veux une
      comme \xa4a...
      Pour qu'elle
      soit toujours \xa0
      mes c\xd0t\xa6s!
  - name: TX_1a02
    index: 0x02
    text: |-
      Je me demande
      d'o\xae vient le
      monstre qui
      s'est install\xa6
      en ville?
      J'aimerais bien
      m'en faire un
      ami!
  - name: TX_1a03
    index: 0x03
    text: |-
      Ils disent qu'un
      m\xa6chant a
      kidnapp\xa6 la
      \col(3)Princesse Zelda\col(0).
      Si j'avais \xa6t\xa6
      l\xa0, je l'aurais
      prot\xa6g\xa6e!
- group: 0x1b
  data:
  - name: TX_1b00
    index: 0x00
    text: |-
      La l\xa6gende dit
      qu'un tr\xa6sor
      est cach\xa6 au
      sommet!
      C'est devenu
      mon obsession!
      J'y pense trop,
      je n'arrive plus
      \xa0 dormir!
  - name: TX_1b01
    index: 0x01
    text: |-
      Le \col(3)myst\xa6rieux
      arbre\col(0) au bord de
      la ville a des
      \col(1)Graines Vent\col(0).
      Elle peuvent te
      transporter
      n'importe o\xae en
      un \xa6clair!
  - name: TX_1b02
    index: 0x02
    text: |-
      Ils disent qu'il
      y a un arbre au
      \col(3)Village Horon\col(0).
      Un jour, je vais
      utiliser une
      \col(1)graine Vent\col(0)
      pour le voir...
  - name: TX_1b03
    index: 0x03
    text: |-
      Il para\xa9t que
      \col(3)Twinrova\col(0) a
      kidnapp\xa6 la
      \col(3)Princesse Zelda\col(0),
      mais pourquoi
      diable..?
- group: 0x1c
  data:
  - name: TX_1c00
    index: 0x00
    text: |-
      La cit\xa6 est
      inond\xa6e, mais
      je ne sais pas
      nager, je reste
      l\xa0 \xa0 faire des
      bulles.
  - name: TX_1c01
    index: 0x01
    text: |-
      Quelle essence?
      Quelles
      t\xa6n\xa5bres?
      C'est quoi un
      roi mal\xa6fique?
      C'est dur,
      l\xa0...
  - name: TX_1c02
    index: 0x02
    text: |-
      Qui c'est
      l'oracle? C'est
      qui \col(3)Din\col(0)? C'est
      qui \col(3)Onox\col(0)? Trop
      puissant comme
      r\xa6flexion...
  - name: TX_1c03
    index: 0x03
    text: |-
      Je pourrai
      montrer mes
      bulles \xa0 la
      \col(3)Princesse
      Zelda\col(0)?
- group: 0x1d
  data:
  - name: TX_1d00
    index: 0x00
    text: |-
      Avec les saisons
      en d\xa6sordre,
      la neige de la
      montagne a
      fondu, et \xa4a a
      inond\xa6 la ville.
      Je ne peux m\xa7me
      pas quitter ma
      maison!
  - name: TX_1d01
    index: 0x01
    text: |-
      D\xa6licieuses, ces
      \col(1)Bananes
      Printemps\col(0)! Il y
      a un arbre au
      sommet du \col(3)Mont
      Cocotte\col(0), mais
      avec des saisons
      comme \xa4a, il n'a
      pas de fruits.
  - name: TX_1d02
    index: 0x02
    text: |-
      C'est peut-\xa7tre
      une rumeur, mais
      il para\xa9t qu'il
      y a un g\xa6ant
      dans
      les montagnes.
      Ca me fait peur,
      mais je voudrais
      le rencontrer!
  - name: TX_1d03
    index: 0x03
    text: |-
      Je pense que je
      vais quitter la
      ville, mais pour
      aller o\xae?
  - name: TX_1d04
    index: 0x04
    text: |-
      Il para\xa9t que la
      \col(3)Princesse Zelda\col(0)
      a \xa6t\xa6 kidnapp\xa6e.
      C'est horrible.
  - name: TX_1d05
    index: 0x05
    text: |-
      Je viens de ma
      \col(3)Cit\xa6 Engloutie\col(0).
      Je ne m'habitue
      pas \xa0 l'absence
      d'eau autour de
      moi.
- group: 0x1e
  data:
  - name: TX_1e00
    index: 0x00
    text: |-
      \pos(0)Que vas-tu
      faire de moi?!?
  - name: TX_1e01
    index: 0x01
    text: |-
      Comme tu le\stop
      sais, si je
      capture l'Oracle
      des Saisons et
      que j'enterre le
      Temple de
      l'\col(3)Esprit
      des Saisons\col(0), les
      saisons
      d'\col(3)Holodrum\col(0)
      seront en
      d\xa6sordre.
      La nature sera
      pervertie et
      toute vie
      dispara\xa9tra!!!
  - name: TX_1e02
    index: 0x02
    text: |-
      \pos(0)\call(TX_1e01)
      Et ainsi le
      monde deviendra
      t\xa6n\xa5bres et
      horreur comme je
      l'ai toujours
      souhait\xa6!
  - name: TX_1e03
    index: 0x03
    text: |-
      \pos(0)Non, \col(3)Onox\col(0)!\x20
      Non!
  - name: TX_1e04
    index: 0x04
    text: |-
      \pos(0)GWAH, HAH,
      HAH!
  - name: TX_1e05
    index: 0x05
    text: \pos(2)Yaaaaa!
  - name: TX_1e06
    index: 0x06
    text: |-
      \pos(0)A bas le
      \col(3)Temple
      des Saisons\col(0)!!!
      Printemps, \xa6t\xa6,
      automne, hiver!
      Soyez pervertis
      par le Chaos!
  - name: TX_1e07
    index: 0x07
    text: |-
      \call(TX_1e01)
      Les Flammes de
      la Destruction
      br\xafleront avec
      les Flammes de
      la D\xa6solation!!!
      Bient\xd0t le
      Roi Mal\xa6fique
      reviendra!
  - name: TX_1e08
    index: 0x08
    text: |-
      \pos(0)Le Roi
      Mal\xa6fique? Non!
  - name: TX_1e09
    index: 0x09
    text: |-
      \pos(0)Hah, hah! Tu
      ne sais m\xa7me pas
      de quoi tu
      parles!
- group: 0x1f
  data:
  - name: TX_1f00
    index: 0x00
    text: |-
      Merci de payer
      pour r\xa6parer
      ma porte.
  - name: TX_1f01
    index: 0x01
    text: |-
      Ne recommence
      pas.
  - name: TX_1f02
    index: 0x02
    text: |-
      ___ J'aimerais
      le dire, mais
      je ne peux pas
      prendre ce que
      tu n'as pas.
      \jump(TX_1f01)
    null_terminator: false
  - name: TX_1f03
    index: 0x03
    text: |-
      Chut! Ne dis
      rien!
  - name: TX_1f04
    index: 0x04
    text: |-
      Si tu cherches
      la puissance,
      alors tu dois
      occire les
      quatre b\xa7tes
      dor\xa6es. Alors,
      je pourrais te
      donner la
      puissance. Tu
      en as d\xa6j\xa0 tu\xa6
      \col(4)\num1\col(0).
  - name: TX_1f05
    index: 0x05
    text: |-
      Tu as occis les
      quatre b\xa7tes
      dor\xa6es! Tu es
      digne de la
      puissance.
      Re\xa4ois-la!
  - name: TX_1f06
    index: 0x06
    text: |-
      Ce que tu feras
      de la puissance
      ne regarde que
      toi, mais n'en
      abuse pas...
  - name: TX_1f07
    index: 0x07
    text: |-
      Je n'ai plus
      rien pour toi.
- group: 0x20
  data:
  - name: TX_2000
    index: 0x00
    text: |-
      \pos(2)\sfx(0xc3)Je suis \col(3)Ricky\col(0)!\stop
      \jump(TX_200b)
    null_terminator: false
  - name: TX_2001
    index: 0x01
    text: |-
      \pos(2)\sfx(0xc3)C'est... Ce sont
      mes \col(1)gants\col(0)!
      Tu me les as
      ramen\xa6s? Merci!
  - name: TX_2002
    index: 0x02
    text: |-
      \pos(2)\sfx(0xc3)En \xa6change...
      \jump(TX_2009)
    null_terminator: false
  - name: TX_2003
    index: 0x03
    text: |-
      \sfx(0xc3)On a r\xa6ussi!
      Le \col(3)Marais Boueux\col(0)
      est devant. Je
      rentre chez moi,
      tu pourras m'y
      trouver! Salut!
  - name: TX_2004
    index: 0x04
    text: |-
      \sfx(0xc3)Beurkh! Ca sent
      le formol...
      J'ai horreur de
      \xa4a! Salut...
  - name: TX_2005
    index: 0x05
    text: |-
      \sfx(0xc3)Appuie sur \abtn
      pour un poing,
      ou maintiens
      pour envoyer une
      tornade. Je peux
      aussi sauter
      par-dessus trous
      et falaises.
  - name: TX_2006
    index: 0x06
    text: |-
      \pos(2)\sfx(0xc3)Si tu as battu
      \col(3)Blaino\col(0), c'est
      que tu es fort.
      Tu t'appelles?\stop
      \Link? Joli nom!
      Moi c'est \col(3)Ricky\col(0).
      Ravi de faire ta
      connaissance!\n
    null_terminator: false
  - name: TX_2007
    index: 0x07
    text: |-
      Voil\xa0, \Link,
      prends cette
      \col(1)fl\xafte\col(0).
      Si tu as besoin
      de moi, joue de
      la \col(1)fl\xafte\col(0). Je
      te retrouverai.
  - name: TX_2008
    index: 0x08
    text: \pos(2)\sfx(0xc3)D'abord,\n
    null_terminator: false
  - name: TX_2009
    index: 0x09
    text: |-
      je vais
      te mener
      au \col(3)Marais
      Boueux\col(0). Entre
      dans ma poche!
  - name: TX_200a
    index: 0x0a
    text: |-
      \pos(2)\sfx(0xc3)\Link!\stop
      Wow! Quand je
      pense qu'on
      s'est rencontr\xa6s
      ici!\n
    null_terminator: false
  - name: TX_200b
    index: 0x0b
    text: |-
      \pos(2)\sfx(0xc3)Le \col(3)Marais Boueux\col(0)
      est derri\xa5re
      chez moi.
      Va au sud,
      puis tourne
      et remonte
      et tu y seras.
      Je viens avec
      toi, mais je ne
      peux rien faire
      sans mes \col(1)gants\col(0).\stop
      Un gars nomm\xa6
      \col(3)Blaino\col(0) me les
      a pris dans un
      match.
  - name: TX_200c
    index: 0x0c
    text: |-
      \pos(2)\sfx(0xc3)Si tu bats
      \col(3)Blaino\col(0), c'est
      que tu es fort!
      \jump(TX_2007)
    null_terminator: false
  - name: TX_200d
    index: 0x0d
    text: |-
      \sfx(0xc3)Si tu approches
      d'un trou, je
      sauterai par-
      dessus. C'est
      tr\xa5s facile
      pour moi.
      Essaye, tu
      verras.
  - name: TX_200e
    index: 0x0e
    text: |-
      \sfx(0xc3)Une falaise
      comme \xa4a,
      c'est un saut
      pour moi.
      Approche, et
      tu verras comme
      je fais.
- group: 0x21
  data:
  - name: TX_2100
